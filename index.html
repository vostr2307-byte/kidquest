адар. Тогда гнездо найдётся!","b10":"Срочное сообщение для экспедиции! {kids}, на связи Профессор Окаменелкин, учёный с сорокалетним стажем и двумя парами запасных очков. Сегодня мой Палеорадар запищал так, что разбудил соседского кота: в этом доме обнаружен живой динозавр! Точнее, динозаврик Тяпа — небольшая, зелёная и с характером. Тяпа устроила игру: спрятала гнездо с сюрпризом и оставила следы по всему дому. А её родственники — трицератопс Бодя, птерозавр Пик и вулкан Пых — тоже включились в игру и придумали испытания. Соберите все {fragments}, расшифруйте код и введите его в Палеорадар. Учёный мир затаил дыхание!"},"beats":["Экспедиция начинается! Палеорадар пищит: первые следы Тяпы ведут сюда — {room}. Чтобы разглядеть их как следует, учёные должны пройти испытание. Вперёд, исследователи!","Топ-топ-топ… Слышите? Это трицератопс Бодя! Он ворчит, но на самом деле очень добрый и просто хочет поиграть. Он ждёт нас: {room}. Пройдите его испытание!","Над головой захлопали крылья — это птерозавр Пик! Он видел сверху, куда ушла Тяпа, и показывает клювом: {room}. Расскажет больше, если пройдёте испытание!","Вулкан Пых запыхтел, как чайник: «Пых-пых, следы вон там!» Значит, следующая остановка — {room}. Он разрешит искать, если экспедиция справится с испытанием!","Профессор нашёл огрызок огурца! Это верный знак: Тяпа была здесь совсем недавно. Мы на месте: {room}. Пройдите испытание, и след станет яснее!","Сквозь заросли папоротника видна тропинка с отпечатками маленьких лап. Она ведёт сюда: {room}. Чтобы пройти дальше, нужно справиться с испытанием!","Тут Тяпа устраивала дневной сон — осталась вмятинка и одна зелёная чешуйка. {room} хранит её секрет. Пройдите испытание — и найдёте следующий след!","Палеорадар пищит всё громче: «Пип-пип-пип!» Гнездо где-то рядом, а сигнал идёт отсюда: {room}. Новая проверка для смелых учёных — испытание ждёт!","Вдали слышно тоненькое «р-р-ри!» — это Тяпа хихикает в своём укрытии. Мы совсем близко, и вот {room}. Покажите, на что способна лучшая экспедиция!","Профессор Окаменелкин так волнуется, что протирает очки третий раз подряд. {room} — последняя точка на карте перед гнездом. Самое важное испытание экспедиции — вперёд!"],"trial_success":["Р-р-разумеется, справились! Профессор пляшет от восторга. Палеорадар принял подсказку — слушайте, где прячется {fragment}.","Невероятно! Даже трицератопс Бодя перестал ворчать и улыбнулся. Вот подсказка, где искать {fragment}.","Эврика! Испытание пройдено. Птерозавр Пик кружит над тайником — слушайте подсказку!","Великолепно, исследователи! Это открытие века. Держите подсказку — {fragment} совсем близко.","Вот это экспедиция! Вулкан Пых радостно пыхтит. Слушайте, где вас ждёт {fragment}.","Ура учёным! Профессор записывает в журнал: «Команда — легенда». А теперь подсказка!"],"found":["Есть {fragment}! Профессор измеряет его линейкой — настоящий!","Нашли! Где-то хихикает Тяпа: «Р-р-ри!»","Эврика! Ещё один след в коллекции экспедиции!","Вот это нюх! Настоящие следопыты!","Ура! Гнездо всё ближе!","Невероятно! Палеорадар пищит от радости!"],"game_flavor":{"bowling":"Обвал на тропе! Сбейте мячом-валуном все камни-кегли, чтобы освободить дорогу экспедиции.","swamp":"Впереди древнее болото. Переходите по кочкам, как осторожные диплодоки, и не завязните!","magicbag":"В мешке — находки с раскопок. Определите на ощупь, что откопала экспедиция!","cinderella":"Находки перемешались! Разложите их по ящикам: что отправится в музей, а что в гнездо Тяпы.","repeat":"Танец динозавров! Повторяйте за Профессором: топ, как трицератопс, взмах, как птерозавр, «р-р-р», как Тяпа!","lava":"Вулкан Пых пыхнул, и пол стал горячей лавой! Когда Профессор крикнет «Лава!», запрыгивайте на камни-островки.","twister":"Разминка динозавров: лапы на нужные цвета — и держите равновесие, как длинношеий диплодок!","drawdesc":"Профессор нашёл кости неизвестного динозавра. Нарисуйте, как он выглядел, точно по описанию!","whatmissing":"Тяпа утащила одну находку в гнездо! Посмотрите внимательно и скажите, чего не хватает.","chepuha":"Составим «научную» историю о динозаврах по кусочку, не подглядывая. Профессор опубликует её в журнале!","crocodile":"Динозавры не умеют говорить! Покажите слово только движениями и рыком.","puppet":"Театр динозавров! Разыграйте с игрушками, как Тяпа прятала своё гнездо и кто ей помогал.","jenga":"Это слои древних камней. Вынимайте по одному так осторожно, чтобы раскоп не обвалился!","scrabble":"Древняя надпись на камне рассыпалась на буквы. Соберите из них слова и прочитайте послание!","memory":"У каждого динозавра есть пара. Найдите все пары — и путь откроется!","imaginarium":"Профессор показывает рисунки из древней пещеры. Угадайте, какой из них загадал рассказчик.","detective":"Кто-то съел все огурцы в лаборатории! Изучите улики и выясните, кто это был (хотя подозрения есть…).","danetki":"Профессор расскажет загадочную историю из экспедиции. Разгадайте её, задавая вопросы, на которые он ответит только «да» или «нет».","kosoykozel":"Динозавровые скороговорки! Повторите их быстро и без запинки, а то трицератопс Бодя захихикает.","musicpass":"Передавайте по кругу «яйцо динозавра», пока играет музыка. Музыка стихла — у кого яйцо, тот выполняет задание Профессора!","puzzle":"Скелет динозавра рассыпался! Соберите картинку, чтобы увидеть, кто это.","tower":"Постройте башню высотой с шею диплодока — с неё будет видно гнездо!","quiz":"Учёный совет экзаменует экспедицию! Ответьте на вопросы о сказках и мультиках.","wordgame":"Учёные любят умные слова! Играйте в словесную игру и пополните словарь экспедиции.","mafia":"В лагерь пробрались хитрые ящерки-сладкоежки: по ночам они таскают бананы. Днём экспедиция выясняет, кто это!"},"pre_finale":"Все {fragments} собраны! Сложите их по порядку — и Палеорадар покажет код гнезда. Введите его, и Тяпа откроет свой тайник!","finale":{"young":"Р-р-ри! Вот оно, гнездо Тяпы! Тяпа так рада, что вы её нашли! Трицератопс Бодя и птерозавр Пик тоже машут вам. В гнезде лежит подарок. Профессор Окаменелкин сейчас скажет, где оно спрятано. Топ-топ-топ — бегом!","older":"Эврика! Код верный, Палеорадар запел, а из укрытия с радостным «р-р-ри!» выглянула Тяпа. Она признаётся, что пряталась нарочно: хотела проверить, кто в этом доме самые лучшие исследователи. Теперь сомнений нет! Трицератопс Бодя аплодирует хвостом, птерозавр Пик делает круг почёта, а вулкан Пых пускает праздничный пар. Гнездо с сюрпризом ждёт. Профессор Окаменелкин сейчас назовёт место!"},"treasure_ideas":["Шоколадное яйцо «динозавра» в гнезде из пледа","Игрушечный динозавр или наклейки с динозаврами","Любимый ужин Тяпы: огуречные и морковные палочки с соусом","Право выбрать мультфильм про динозавров на вечер","Купон «Раскопки в тазике с крупой» на завтра"],"passwords":["ЛЕС","ЗУБ","ЛАПА","ЯЙЦО","ХВОСТ","КОСТЬ","ВУЛКАН","ГНЕЗДО","ДЖУНГЛИ","ЯЩЕРИЦА","ДИНОЗАВР","ДИПЛОДОК","РАСКОПКИ","ДИНОЗАВРЫ","ПТЕРОЗАВР","ДИНОЗАВРИК","ПАПОРОТНИК","ЭКСПЕДИЦИЯ"],"certificate":{"title":"Диплом палеонтолога","text":"Диплом выдан: {name}. Звание: «{title}». За смелость, зоркость и открытие тайного гнезда динозаврика Тяпы. Профессор Окаменелкин, руководитель экспедиции."}},{"id":"heroes","title":"Отряд «Молния» против Скукотрона","tagline":"Робот Скукотрон украл у города веселье — пора спасать улыбки!","emoji":"⚡","bands":["b3","b6","b10"],"palette":{"bg":"#0E1A3D","surface":"#1B2B5E","ink":"#F2F5FF","accent":"#FFCC2E","accent2":"#FF5D6C"},"artifact":"Пульт штаба","fragment":{"one":"энергокристалл","many":"энергокристаллы","gen":"энергокристаллов"},"parent_role":{"name":"Наставник Супер-Тапок","how":"Говорите бодро, как спортивный тренер, а перед каждым заданием вставайте в «позу героя» — руки в боки, подбородок вверх. Коронная фраза: «Отряд, в позу героя — раз!» Реквизит — полотенце-плащ на прищепках и домашний тапок вместо рации."},"kid_titles":["Супер-Молния","Гроза Скукотрона","Мастер суперсил","Звезда отряда","Ас скорости","Чемпион по смеху","Щит Улыбинска","Сердце команды","Капитан Вспышка","Гений супер-идей"],"room_names":{"living":"Главная площадь","kids":"Тренировочный зал","kitchen":"Энергостанция","bedroom":"Тихий квартал","hall":"Супер-магистраль","bath":"Водная база","study":"Штаб"},"costumes":[{"who":"kids","name":"Супер-плащ","how":"Полотенце или наволочку прикрепите двумя прищепками к футболке на плечах — ничего не завязывайте на шее. Плащ развевается, когда бежишь!","minutes":2,"min_band":"b3"},{"who":"kids","name":"Маска героя","how":"Вырежьте из плотной бумаги полоску с прорезями для глаз и приклейте скотчем к ободку для волос — надевается и снимается за секунду.","minutes":4,"min_band":"b3"},{"who":"kids","name":"Эмблема-молния","how":"Вырежьте молнию из жёлтой бумаги и приклейте на грудь футболки малярным скотчем.","minutes":2,"min_band":"b1"},{"who":"kids","name":"Супер-браслеты","how":"Разрежьте вдоль втулки от туалетной бумаги, обклейте фольгой или цветным скотчем и наденьте на запястья.","minutes":4,"min_band":"b3"},{"who":"kids","name":"Пояс героя","how":"Обвяжите талию шарфом, а спереди заткните за него картонный круг с буквой «М» — пряжку отряда.","minutes":3,"min_band":"b3"},{"who":"parent","name":"Наставник в форме","how":"Плед или полотенце на прищепках вместо плаща, на шею ничего не нужно — зато в руке тапок-рация, в которую вы говорите «Приём!».","minutes":1,"min_band":"b1"},{"who":"props","name":"Портрет Скукотрона","how":"Нарисуйте на коробке или листе квадратного робота с сонными глазами и зевающим ртом и поставьте на видное место — в финале его можно перевернуть: на обороте он улыбается.","minutes":4,"min_band":"b1"}],"atmosphere":["Включите бодрую оркестровую или электронную музыку «как в кино про героев» — ищите по запросу «эпическая музыка для детей».","Сделайте «сигнал тревоги»: мигайте фонариком и гудите «у-у-у!» перед каждым этапом.","Встречайте каждую победу «супер-хлопком» — все одновременно хлопают и кричат «Молния!»","Если есть цветная гирлянда, включите её — это мигают огни штаба."],"intro":{"b1":"Ура! {kids}, вы маленькие супергерои! Робот Скукотрон спрятал веселье. Давайте найдём все {fragments}! Тогда снова будет весело и появится подарок. Встанем в позу героя: руки в бока — полетели!","b3":"Внимание, внимание! {kids}, на связи Наставник Супер-Тапок из штаба отряда «Молния»! В наш город Улыбинск прикатил робот Скукотрон. Он не злой, просто ужасно занудный: хочет, чтобы все вокруг зевали и скучали. Он спрятал энергокристаллы, на которых работает Генератор Веселья! Пройдём супер-испытания и соберём все {fragments}. Тогда Генератор заработает, и веселье вернётся! Отряд, в позу героя — раз!","b6":"Тревога в штабе! {kids}, говорит Наставник Супер-Тапок. Пока весь город Улыбинск отдыхал, робот Скукотрон тихонько пробрался к Генератору Веселья и вынул из него все энергокристаллы. Теперь в городе скучно: мороженое не тает, качели не качаются, а коты даже не мурлычут. Скукотрон спрятал кристаллы по разным уголкам и поставил возле каждого испытание — ему кажется, что никто не справится. Но он ещё не встречал отряд «Молния»! Соберите все {fragments}, сложите код и введите его в Пульт штаба. Отряд, в позу героя — раз!","b10":"Внимание, отряд «Молния»! Это Наставник Супер-Тапок, ваш тренер, координатор и по совместительству главный по печенькам. {kids}, у нас ЧП. Робот Скукотрон — самая занудная машина во вселенной — отключил Генератор Веселья города Улыбинска. Он вынул энергокристаллы, разложил их по укромным уголкам и у каждого поставил испытание: на силу, скорость, смекалку и, что для него страшнее всего, на чувство юмора. Его помощники-зевунчики уже патрулируют комнаты и заразительно зевают. Соберите все {fragments}, сложите код и введите его в Пульт штаба. Город ждёт своих героев!"},"beats":["Отряд, на выход! Первое место, где Скукотрон спрятал энергию, — {room}. Тут уже зевают даже стены! Пройдите испытание и верните этому месту веселье!","Тревога! Зевунчики — маленькие серые роботы Скукотрона — патрулируют местность, и их база здесь: {room}. Зевунчиков побеждают только смехом и ловкостью — испытание ждёт!","На связи кошка-героиня Искра: «Мяу, вижу кристалл! Он светится вот где: {room}!» Но Скукотрон окружил его занудным полем. Пройдите испытание, чтобы его отключить!","Летающий пылесос Вжух примчался со скоростью ветра и доложил: «Вжжж! Нашёл след!» След ведёт сюда: {room}. Супер-испытание — вперёд!","Скукотрон включил Зевательный луч! Все вокруг начали зевать… а-а-а… Но настоящих героев так просто не усыпишь! Мы прорвались: {room}. Пройдите испытание и выключите луч!","Изобретатель Шестерёнкин передал новый прибор — Кристаллоискатель. Он мигает зелёным и показывает: {room}. Проверим прибор в деле — испытание ждёт!","Отряд «Молния» на марше! Горожане выглядывают из окон и машут вам. Следующая точка — {room}. Покажите всем, что такое настоящая суперсила!","Скукотрон прислал сообщение: «Дальше вам не пройти, тут скука непробиваемая!» Ха! Отряд уже на месте: {room}. Докажем роботу, что он ошибается, — испытание!","Генератор Веселья почти заряжен — слышно, как он хихикает! Ещё одна точка — {room}. Испытание здесь хитрое, но для отряда «Молния» нет невозможного!","Финальный рывок! {room} — место, где Скукотрон спрятал самый большой кристалл и сам сидит рядом, скрестив железные руки. Покажите ему лучшее испытание в его жизни!"],"trial_success":["Супер! Генератор Веселья мигнул и хихикнул. Наставник передаёт подсказку — слушайте, где прячется {fragment}.","Вот это суперсила! Даже зевунчики перестали зевать и захлопали. Держите подсказку, где искать {fragment}.","Испытание пройдено! Кошка Искра мурлычет на всю улицу. Внимание, подсказка — {fragment} рядом!","Молния бьёт без промаха! Пульт штаба получил новые координаты — слушайте подсказку.","Ура героям! Скукотрон в растерянности почесал антенну. А вот и подсказка к тайнику!","Великолепно, отряд! Город Улыбинск снова улыбается. Слушайте, где вас ждёт {fragment}."],"found":["Есть {fragment}! Энергия веселья растёт!","Нашли! Генератор Веселья радостно гудит!","Ура! Ещё один энергокристалл в штабе!","Вот это супер-зрение! Скукотрон в шоке!","Отлично! Город становится всё веселее!","Бз-з-з! Кристалл светится — мы на верном пути!"],"game_flavor":{"bowling":"Зевунчики выстроились в ряд! Сбейте их супер-мячом — они не обидятся, просто проснутся.","swamp":"Скукотрон разлил клей-тянучку! Переберитесь по безопасным плиткам и не прилипните.","magicbag":"В сейфе Скукотрона — непонятные предметы. Определите на ощупь, что там, с помощью супер-осязания!","cinderella":"Скукотрон перемешал все вещи в городе! Разложите их по местам, чтобы вернуть порядок.","repeat":"Тренировка героев! Повторяйте за Наставником супер-движения — точь-в-точь и с героическим лицом.","lava":"Скукотрон превратил пол в скучную тянучку! Когда Наставник крикнет «Скука!», прыгайте на островки — кто останется на полу, тот зевнёт.","twister":"Супер-растяжка героев: руки и ноги на нужные цвета — и держитесь, как настоящие акробаты!","drawdesc":"Горожане описывают нового героя, который им приснился. Нарисуйте его точно по описанию!","whatmissing":"Скукотрон стащил одну вещь со склада штаба! Посмотрите внимательно и скажите, чего не хватает.","chepuha":"Сочиняем комикс об отряде «Молния» по кусочку, не подглядывая. Чем смешнее — тем сильнее Генератор Веселья!","crocodile":"Зевательный луч отключил голос! Покажите слово жестами, чтобы команда угадала.","puppet":"Устройте спектакль о том, как отряд «Молния» развеселил Скукотрона. Пусть игрушки станут героями!","jenga":"Это блоки защитной стены штаба. Вынимайте по одному так, чтобы стена устояла!","scrabble":"Скукотрон зашифровал сообщение, перемешав буквы. Соберите из них слова и раскройте его план!","memory":"Энергокарты работают парами! Найдите все совпадения, чтобы зарядить штаб.","imaginarium":"В архиве штаба — загадочные снимки. Угадайте, какую картинку загадал рассказчик.","detective":"Из штаба пропал супер-бутерброд Наставника! Изучите улики и выясните, кто его взял.","danetki":"Наставник расскажет странный случай с прошлого задания. Разгадайте его, задавая вопросы, на которые он ответит только «да» или «нет».","kosoykozel":"Супер-скороговорки! Произнесите их быстро и без запинки — так герои тренируют реакцию.","musicpass":"Передавайте по кругу энергокристалл, пока играет музыка. Музыка стихла — у кого кристалл, тот выполняет супер-задание!","puzzle":"Карта города разорвана на кусочки! Соберите её и узнайте, куда лететь дальше.","tower":"Постройте супер-башню штаба — чем выше, тем дальше видно Скукотрона!","quiz":"Экзамен для героев! Ответьте на вопросы о сказках и мультиках — там ведь тоже полно героев.","wordgame":"Слова — тоже суперсила! Играйте в словесную игру и зарядите Генератор Веселья.","mafia":"Среди героев затесались переодетые зевунчики — по ночам они усыпляют всех скучными историями. Днём отряд вычисляет, кто они!"},"pre_finale":"Все {fragments} собраны! Сложите их по порядку — и узнаете код запуска Генератора Веселья. Введите его в Пульт штаба!","finale":{"young":"Ура! Генератор Веселья заработал! Скукотрон засмеялся первый раз в жизни и теперь хочет дружить. Город Улыбинск снова улыбается, а кошка Искра мурлычет песенку! А для самых смелых героев приготовлен подарок. Наставник Супер-Тапок сейчас скажет, где он!","older":"Код принят — Генератор Веселья запущен! По всему Улыбинску закачались качели, замурлыкали коты, а мороженое снова начало таять, как положено. И тут случилось невероятное: Скукотрон хихикнул. Потом рассмеялся. А потом попросился в отряд «Молния» младшим помощником по веселью. Зевунчики разучили танец. Город спасён, и героев ждёт награда. Наставник Супер-Тапок сейчас назовёт место!"},"treasure_ideas":["Коробка маленьких сладостей — «энергия для героев»","Супер-завтрак завтра: блины или сырники со смайликом из ягод","Право выбрать фильм или мультфильм на вечер","Наклейки-молнии и самодельные медали из картона","Купон «Вечер настольных игр всей семьёй»"],"passwords":["УРА","ЩИТ","ПЛАЩ","СИЛА","ГЕРОЙ","МАСКА","МОЛНИЯ","ПОБЕДА","ОТВАГА","КОМАНДА","ЭНЕРГИЯ","СКОРОСТЬ","СМЕЛОСТЬ","СУПЕРСИЛА","СПАСАТЕЛЬ","НЕВИДИМКА","СУПЕРГЕРОЙ","КРИСТАЛЛИК"],"certificate":{"title":"Удостоверение супергероя","text":"Удостоверение выдано: {name}. Звание: «{title}». За смелость, скорость и возвращение веселья в город Улыбинск. Наставник Супер-Тапок, штаб отряда «Молния»."}},{"id":"fairy","title":"Волшебный сад феи Незабудки","tagline":"Шмель чихнул — и лепестки Радужного цветка разлетелись по дому!","emoji":"🌸","bands":["b1","b3","b6","b10"],"palette":{"bg":"#2A1030","surface":"#3F1A47","ink":"#FFF0F6","accent":"#FF8FC7","accent2":"#9EE6A8"},"artifact":"Волшебное зеркальце","fragment":{"one":"лепесток","many":"лепестки","gen":"лепестков"},"parent_role":{"name":"Хранитель сада Лютик","how":"Говорите мягко и певуче, ходите на цыпочках, будто боитесь спугнуть бабочку, и иногда прикладывайте ладонь к уху — «прислушиваетесь к саду». Коронная фраза: «Тише-тише, слышите? Сад нам шепчет!» Реквизит — лёгкий шарф на плечах и цветок или веточка в руке."},"kid_titles":["Звезда волшебного сада","Друг всех бабочек","Мастер цветочных чудес","Искорка сада","Добрая Душа леса","Знаток лесных тайн","Сердце волшебного сада","Лучик радуги","Светлячок-проводник","Гений добрых дел"],"room_names":{"living":"Цветочная поляна","kids":"Домик гномиков","kitchen":"Медовая кухня","bedroom":"Сонный луг","hall":"Тропинка светлячков","bath":"Родник","study":"Тихая беседка"},"costumes":[{"who":"kids","name":"Крылышки","how":"Два листа цветной бумаги или фольги сложите гармошкой, скрепите посередине скотчем — получится бантик-крылья. Прикрепите прищепкой к спине футболки между лопатками.","minutes":4,"min_band":"b3"},{"who":"kids","name":"Цветочный венок","how":"Полоску бумаги отмерьте по голове, склейте кольцом и наклейте на неё бумажные цветы и листики. Надевается сверху, как корона.","minutes":5,"min_band":"b1"},{"who":"kids","name":"Палочка-цветок","how":"К коктейльной трубочке или свёрнутому листу приклейте скотчем цветок, вырезанный из бумаги или салфетки.","minutes":2,"min_band":"b1"},{"who":"kids","name":"Пояс из листьев","how":"Полоску бумаги длиной с талию обклейте бумажными листиками и закрепите на поясе скотчем поверх одежды — подойдёт и феям, и лесным эльфам.","minutes":4,"min_band":"b3"},{"who":"kids","name":"Усики шмеля","how":"К ободку для волос примотайте скотчем две полоски свёрнутой бумаги с бумажными шариками на концах — и жужжите!","minutes":3,"min_band":"b3"},{"who":"parent","name":"Наряд Хранителя","how":"Лёгкий шарф или тюль на плечи, за ухо — цветок или веточка, в руку — палочка-цветок.","minutes":1,"min_band":"b1"},{"who":"props","name":"Радужный цветок","how":"Нарисуйте на листе серединку цветка без лепестков и повесьте на стену. Каждый найденный лепесток дети приклеивают скотчем вокруг серединки.","minutes":3,"min_band":"b1"}],"atmosphere":["Включите гирлянду или ночник с тёплым светом — это «светлячки» волшебного сада.","Поставьте тихие звуки природы: пение птиц, журчание ручья — ищите по запросу «звуки леса».","Говорите шёпотом в самых «волшебных» местах — дети сразу начинают прислушиваться.","Перед каждым этапом все вместе «нюхают цветок» и «задувают свечку» — глубокий вдох и выдох, чтобы успокоиться."],"intro":{"b1":"Тише-тише! {kids}, это волшебный сад. Здесь живёт фея Незабудка. Ветерок рассыпал лепесточки её цветка. Давайте найдём все {fragments}! Тогда цветок раскроется, а в нём — подарок. Полетели, как бабочки!","b3":"Тише-тише, слышите? Сад нам шепчет! {kids}, здравствуйте, я Хранитель сада Лютик. В нашем доме растёт волшебный сад феи Незабудки, а в самом его сердце — Радужный цветок. Сегодня утром шмель Жужа так громко чихнул, что все лепестки разлетелись по дому! Без них цветок не может раскрыться. Пройдём весёлые испытания и соберём все {fragments}. Тогда цветок распустится, и внутри будет сюрприз!","b6":"Тише-тише, друзья! {kids}, я Хранитель сада Лютик, и сегодня нам нужна ваша помощь. В нашем доме спрятан волшебный сад феи Незабудки. Каждый год в нём расцветает Радужный цветок, а внутри него фея оставляет подарок для самых добрых и смелых. Но утром шмель Жужа понюхал пыльцу и чихнул так, что лепестки разлетелись во все стороны! Теперь их охраняют жители сада, и каждый приготовил своё испытание. Соберите все {fragments}, сложите волшебное слово и введите его в Волшебное зеркальце — и цветок распустится!","b10":"Тише-тише… Слышите, как шуршат листья? {kids}, добро пожаловать в волшебный сад феи Незабудки. Я Хранитель сада Лютик: отвечаю за полив, порядок и за то, чтобы улитки не устраивали гонок по клумбам. Сегодня у нас происшествие. Шмель Жужа, известный аллергик, понюхал пыльцу Радужного цветка и чихнул так, что лепестки разлетелись по всему дому. А цветок особенный: он распускается только целым и только для тех, кто прошёл испытания сада. Светлячок Огонёк, улитка Тихоня и сам Жужа уже придумали задания. Соберите все {fragments}, сложите волшебное слово и введите его в Волшебное зеркальце. Сад верит в вас!"},"beats":["Тише-тише, входим в сад! Первая тропинка ведёт сюда: {room}. Ветерок уронил здесь лепесток, но сад отдаст его только тем, кто пройдёт испытание. Начинаем!","Ж-ж-ж! Это шмель Жужа, он очень извиняется за свой чих. Жужа покажет, куда улетели лепестки, а летит он сюда: {room}. Но сначала — испытание!","Светлячок Огонёк зажёг фонарик и освещает путь: {room}. Он говорит, что лепесток где-то рядом, но волшебство просит сначала пройти испытание!","Улитка Тихоня ползёт ме-е-едленно, зато всё замечает. Она шепчет, что видела блеск лепестка, и вот {room}. Пройдите испытание — Тихоня будет болеть за вас!","Бабочки закружились хороводом и опустились здесь: {room}. Это знак — тут спрятано волшебство! Порадуйте бабочек и пройдите испытание.","Ой, капелька росы упала Хранителю прямо на нос! Это сад подаёт знак: следующая остановка — {room}. Сад приготовил новое испытание — вперёд!","Лягушонок Квакс прыгает с листка на листок и квакает: «Ква! Кто справится — тот получит подсказку!» Мы на месте: {room}. Испытание ждёт!","В саду запахло мёдом и земляникой — Радужный цветок оживает! Чтобы продолжить, идём сюда: {room}. Покажите саду, какие вы ловкие и добрые!","Цветок уже почти раскрылся, не хватает совсем немного! Ветерок нашёптывает дорогу: {room}. Испытание хитрое, но вы уже настоящие друзья сада!","Самое сердце сада — {room}. Здесь фея Незабудка приготовила последнее испытание, чтобы цветок раскрылся для самых добрых и смелых. Вперёд, друзья!"],"trial_success":["Как чудесно! Сад зашелестел от радости. Слушайте подсказку — она расскажет, где прячется {fragment}.","Ура! Шмель Жужа сделал три круга почёта. Держите подсказку, где искать {fragment}.","Вы справились! Светлячок Огонёк засиял ярче всех звёзд. Слушайте подсказку!","Великолепно! Бабочки аплодируют крылышками. Где же {fragment}? Слушайте внимательно.","Испытание пройдено! Даже улитка Тихоня от восторга разогналась до двух сантиметров в минуту. Вот подсказка!","Браво, друзья сада! Цветы поворачиваются к вам, как к солнышку. Подсказка уже в Волшебном зеркальце — {fragment} рядом."],"found":["Есть {fragment}! Какой красивый!","Нашли! Радужный цветок становится ярче!","Ура! Ещё один лепесток вернулся домой!","Вот это глазки! Ни один лепесток от вас не спрячется!","Чудесно! Сад шепчет: «Спасибо!»","Отлично! Шмель Жужа счастливо жужжит!"],"game_flavor":{"bowling":"На тропинке выросли сорняки-колючки! Сбейте их мячиком-росинкой, чтобы цветам было где расти.","swamp":"Перед нами ручеёк. Переберитесь по листьям кувшинок и не намочите ножки!","magicbag":"В корзинке у Хранителя — подарки леса. Угадайте на ощупь, что там лежит!","cinderella":"Фея Незабудка просит помочь: разложите семена и ягоды по корзинкам, как трудолюбивые гномики.","repeat":"Танец лесных жителей! Повторяйте за Хранителем: порхайте, как бабочки, прыгайте, как лягушата, качайтесь, как цветы.","lava":"Ручей разлился! Когда Хранитель скажет «Вода!», перебирайтесь на листья-островки.","twister":"Цветочная гимнастика: руки и ноги на нужные цвета — и держитесь, как цветы на ветру!","drawdesc":"Фея Незабудка описывает цветок, которого никто никогда не видел. Нарисуйте его точно по описанию!","whatmissing":"Сорока-шалунья утащила из сада одну вещицу! Посмотрите внимательно и скажите, чего не хватает.","chepuha":"Сочиняем сказку о волшебном саде по кусочку, не подглядывая. Фея обожает смешные истории!","crocodile":"Жители сада разговаривают без слов! Покажите слово жестами, чтобы друзья угадали.","puppet":"Кукольный спектакль в саду: разыграйте, как шмель Жужа чихнул и что было дальше.","jenga":"Это домик для жучков из веточек. Вынимайте по одной так, чтобы домик не развалился!","scrabble":"Ветерок перепутал буквы в письме феи. Соберите из них слова и прочитайте послание!","memory":"Цветы в саду растут парами. Найдите все пары — и сад засияет!","imaginarium":"Фея показывает картинки из своих снов. Угадайте, какую из них загадал рассказчик.","detective":"С Медовой кухни пропала баночка мёда! Изучите улики и выясните, кто тут сладкоежка.","danetki":"Хранитель расскажет загадочную историю из жизни сада. Разгадайте её, задавая вопросы, на которые он ответит только «да» или «нет».","kosoykozel":"Шмелиные скороговорки! Повторите их быстро и без запинки, а то шмель Жужа опять чихнёт.","musicpass":"Передавайте по кругу волшебный цветок, пока играет музыка. Музыка стихла — у кого цветок, тот выполняет задание феи!","puzzle":"Картина волшебного сада рассыпалась! Соберите её, чтобы узнать, куда идти.","tower":"Постройте башенку для светлячков повыше — чтобы их свет было видно во всём саду!","quiz":"Сказочная викторина феи Незабудки! Ответьте на вопросы о сказках и мультиках.","wordgame":"В саду растут волшебные слова. Играйте в словесную игру и сплетите самый длинный венок из слов!","mafia":"В сад пробрались озорные гусенички-сладкоежки: по ночам они грызут листики. Днём жители сада выясняют, кто это!"},"pre_finale":"Все {fragments} собраны! Сложите их по порядку — и получится волшебное слово. Введите его в Волшебное зеркальце, и Радужный цветок распустится!","finale":{"young":"Ура! Радужный цветок распустился! Он сияет всеми цветами, а бабочки танцуют вокруг. Фея Незабудка говорит вам спасибо и дарит подарок. Хранитель сада Лютик сейчас скажет, где он спрятан. Бегите скорее!","older":"Чудо свершилось! Лепестки встали на место, и Радужный цветок медленно раскрылся, засияв всеми семью цветами. В саду зазвенели колокольчики, светлячок Огонёк устроил салют, а шмель Жужа дал честное шмелиное слово больше никогда не чихать на клумбы. Фея Незабудка шепчет, что такой доброй и смелой команды в её саду ещё не было. Подарок ждёт. Хранитель Лютик сейчас подскажет, где его искать!"},"treasure_ideas":["Чаепитие в саду: чай с мёдом или вареньем и печенье","Наклейки или раскраски с цветами и бабочками","Право выбрать сказку на ночь","Посадить вместе семечко в стаканчик — свой волшебный цветок","Фруктовый «букет» из ягод и фруктов"],"passwords":["МАК","ЛУГ","ФЕЯ","РОСА","ЛИСТ","РОЗА","ЛИЛИЯ","ПЧЕЛА","ВЕНОК","РАДУГА","ЦВЕТОК","РОМАШКА","БАБОЧКА","ТЮЛЬПАН","ЛЕПЕСТОК","СТРЕКОЗА","ОДУВАНЧИК","НЕЗАБУДКА","СВЕТЛЯЧОК","ПОДСНЕЖНИК","МАРГАРИТКА"],"certificate":{"title":"Грамота друга волшебного сада","text":"Грамота вручается: {name}. Звание: «{title}». За доброе сердце, смелость и спасение Радужного цветка. Фея Незабудка и Хранитель сада Лютик."}},{"id":"spies","title":"Операция «Секретный рецепт»","tagline":"Рецепт оладушков зашифрован — агентам «Тихого Ёжика» срочно на задание!","emoji":"🕶️","bands":["b3","b6","b10","b13"],"palette":{"bg":"#0E1416","surface":"#1A2528","ink":"#E6F2EE","accent":"#39E6A0","accent2":"#FF6B6B"},"artifact":"Шпионский коммуникатор","fragment":{"one":"шифровка","many":"шифровки","gen":"шифровок"},"parent_role":{"name":"Шеф Ноль","how":"Говорите таинственным шёпотом, перед каждой фразой оглядывайтесь по сторонам и прикладывайте палец к губам. Коронная фраза: «Задание понятно? Тогда — ни звука!» Реквизит — тёмные очки (даже в темноте), поднятый воротник и газета с дыркой для подглядывания."},"kid_titles":["Агент Невидимка","Мастер маскировки","Гроза шифров","Ас тайных операций","Звезда разведки","Знаток кодов","Чемпион бесшумного шага","Мозговой Центр агентства","Мастер секретных рукопожатий","Агент Ноль-Ноль-Плюс"],"room_names":{"living":"Главный штаб","kids":"Тренировочная база","kitchen":"Секретная лаборатория","bedroom":"Тайное убежище","hall":"Зона наблюдения","bath":"Подводная база","study":"Архив разведки"},"costumes":[{"who":"kids","name":"Тёмные очки агента","how":"Подойдут любые солнечные очки. Если их нет — вырежьте из картона оправу с большими прорезями для глаз (без «стёкол», чтобы всё было видно) и приклейте дужки-полоски. Во время беготни очки лучше поднять на лоб.","minutes":4,"min_band":"b3"},{"who":"kids","name":"Удостоверение агента","how":"На картонной карточке нарисуйте свой портрет, впишите кодовое имя и номер, положите в нагрудный карман или приклейте малярным скотчем к кофте.","minutes":4,"min_band":"b3"},{"who":"kids","name":"Наушник связи","how":"Кусочек коктейльной трубочки заложите за ухо, как будто от него идёт провод к рации. Говорите в рукав: «Приём, база!»","minutes":1,"min_band":"b3"},{"who":"kids","name":"Маскировка","how":"Тёмная кофта с капюшоном, надетая задом наперёд или наизнанку, и кепка козырьком назад — никто не узнает!","minutes":2,"min_band":"b3"},{"who":"kids","name":"Шифровальный круг","how":"Вырежьте из картона два круга разного размера, по краю каждого напишите алфавит и скрепите в центре скрепкой-бабочкой или пластилином — повернул круг, и буквы сдвинулись.","minutes":5,"min_band":"b10"},{"who":"parent","name":"Образ Шефа","how":"Тёмные очки, поднятый воротник рубашки или куртки и свёрнутая газета под мышкой — в ней можно проделать дырочку для наблюдения.","minutes":1,"min_band":"b1"},{"who":"props","name":"Лазерная ловушка","how":"Наклейте на пол в коридоре зигзагом полоски малярного скотча — это «лучи». Наступать на них нельзя, переступать и проползать между ними — можно.","minutes":4,"min_band":"b3"}],"atmosphere":["Приглушите свет и выдайте агентам фонарики — операции проходят в полумраке, но пол и пороги должны быть хорошо видны.","Включите негромкую напряжённую «шпионскую» музыку с басом — ищите по запросу «шпионская музыка для детей».","Придумайте с детьми секретное рукопожатие и проверяйте его перед каждым этапом.","Объявите режим «радиомолчания»: между этапами передвигаться бесшумно, общаться жестами."],"intro":{"b1":"Тс-с-с! {kids}, вы мои маленькие тайные агенты! Кто-то спрятал секретный рецепт оладушков. Давайте найдём все {fragments}! Тогда узнаем рецепт и получим подарок. На цыпочках — пошли! Тс-с-с!","b3":"Тс-с-с, агенты, говорим шёпотом! {kids}, на связи Шеф Ноль из секретного агентства «Тихий Ёжик». У нас важное задание. Бабушка Пышка изобрела самый вкусный рецепт оладушков на свете. Чтобы рецепт никто не утащил, его разделили на кусочки и спрятали по всему дому. Наша задача — пройти секретные испытания и собрать все {fragments}. Тогда мы узнаем рецепт и получим награду! Задание понятно? На цыпочках — вперёд!","b6":"Внимание, агенты! Это Шеф Ноль, агентство «Тихий Ёжик». {kids}, вам поручается операция «Секретный рецепт». Бабушка Пышка, лучший кулинар страны, изобрела рецепт оладушков, от которых все улыбаются. Чтобы его не выведал хитрый агент Сахарная Вата из конкурирующего агентства «Хрустики», рецепт зашифровали и разделили на части. Шифровки спрятаны в разных уголках дома, и каждую охраняет испытание на ловкость, внимание и смекалку. Соберите все {fragments}, сложите пароль и введите его в Шпионский коммуникатор. Сахарная Вата уже рядом, так что действуйте тихо и быстро. Ни звука!","b10":"Совершенно секретно. Читать вслух шёпотом. {kids}, говорит Шеф Ноль, руководитель агентства «Тихий Ёжик», мастер маскировки и обладатель самых бесшумных тапочек в городе. Начинаем операцию «Секретный рецепт». Объект — рецепт оладушков бабушки Пышки, проверенный на трёх поколениях сладкоежек. Рецепт зашифрован и разбит на части, чтобы до него не добрался агент Сахарная Вата из агентства «Хрустики». Сахарная Вата хитёр, но липок: везде оставляет следы. Шифровки спрятаны по объектам, каждую охраняет испытание. Соберите все {fragments}, сложите пароль и введите его в Шпионский коммуникатор. Это сообщение не самоуничтожится, но лучше его запомнить."},"beats":["Операция начинается. Первая точка — {room}. По данным разведки, здесь спрятана шифровка, но доступ получат только агенты, прошедшие проверку. Испытание — вперёд, тихо!","Тс-с-с! Замрите! Кажется, мимо прошёл агент Сахарная Вата… Нет, показалось, это была наша собственная тень. Продвигаемся дальше: {room}. Пройдите испытание, пока путь свободен!","Сообщение из штаба: «Ёжик видит, ёжик знает». На языке агентов это значит, что следующая точка — {room}! Чтобы получить доступ, пройдите испытание.","Внимание: впереди невидимые лазерные лучи! К счастью, агенты «Тихого Ёжика» проходят где угодно. Объект перед нами: {room}. Пройдите испытание, и лучи отключатся!","Агент Сахарная Вата оставил липкий след — он тоже ищет рецепт! Но мы на шаг впереди: {room}. Быстрее пройдите испытание, пока он отряхивается от сахара!","Связной передал записку под видом обычного фантика. В ней написано: «{room}». Значит, нам туда! Но сначала — проверка, что вы настоящие агенты.","Шпионский коммуникатор пискнул: «Сигнал шифровки обнаружен!» Источник сигнала — {room}. Для доступа к тайнику нужно пройти испытание. Агенты, приготовиться!","Смена маскировки! Агенты притворяются обычными детьми, которые просто гуляют по дому. Гуляем-гуляем… и оказываемся здесь: {room}. Ловко! Теперь — испытание.","Операция почти завершена — рецепт бабушки Пышки уже пахнет оладушками! Следующий объект — {room}. Испытание непростое, но вы лучшие агенты «Тихого Ёжика»!","Финальная точка операции — {room}. Здесь хранится последняя шифровка, и охраняет её самое хитрое испытание агентства. Соберите всю шпионскую смекалку — вперёд!"],"trial_success":["Проверка пройдена! Шеф Ноль одобрительно кивает (очень тихо). Принимайте подсказку — вот где спрятана {fragment}.","Отличная работа, агенты! Штаб передаёт: «Ёжик доволен». Слушайте подсказку к тайнику.","Чисто сработано! Сахарная Вата даже ничего не заметил. Вот подсказка, где лежит {fragment}.","Испытание пройдено! Шпионский коммуникатор расшифровал подсказку — слушайте внимательно.","Блестяще! Агентство «Хрустики» о такой команде может только мечтать. Держите подсказку — {fragment} уже близко.","Доступ получен! Шеф Ноль от удивления даже снял тёмные очки. Подсказка: где-то рядом ждёт {fragment}."],"found":["Есть {fragment}! Прячьте её понадёжнее!","Объект найден! Сахарная Вата снова опоздал!","Отлично! Ещё одна шифровка у «Тихого Ёжика»!","Вот это глаз агента! Тайник раскрыт!","Тс-с-с… Ура! Только шёпотом!","Есть! Рецепт всё ближе!"],"game_flavor":{"bowling":"Отключите камеры наблюдения агентства «Хрустики»: сбейте их все мячом — и путь свободен!","swamp":"Пол под сигнализацией! Перебирайтесь только по безопасным плиткам, чтобы не поднять тревогу.","magicbag":"В чемоданчике связного — шпионские предметы. Определите на ощупь, что там, не подглядывая!","cinderella":"Секретные материалы перемешались! Рассортируйте их по папкам, иначе штаб запутается.","repeat":"Тайный язык жестов агентства! Повторяйте за Шефом знаки точь-в-точь — так агенты переговариваются без слов.","lava":"Сработала сигнализация! Когда Шеф скажет «Тревога!», замрите на безопасных островках — на полу вас засекут лучи.","twister":"Лазерный лабиринт: руки и ноги ставьте только на нужные цвета — там нет лучей. Держитесь!","drawdesc":"Связной описывает внешность агента Сахарная Вата. Нарисуйте его портрет точно по описанию!","whatmissing":"Кто-то побывал на базе и унёс одну вещь! Посмотрите внимательно и скажите, чего не хватает.","chepuha":"Сочиняем донесение в штаб по кусочку, не подглядывая. Даже если выйдет чепуха — это просто очень хитрый шифр!","crocodile":"Радиомолчание! Передайте слово только жестами, чтобы агент Сахарная Вата не подслушал.","puppet":"Разыграйте с игрушками, как агенты «Тихого Ёжика» перехитрили агента Сахарная Вата.","jenga":"Это ящики с секретными документами. Вынимайте по одному так, чтобы склад не рухнул и не наделал шума!","scrabble":"Перехвачено сообщение с перепутанными буквами. Соберите из них слова и расшифруйте его!","memory":"Шпионские карточки-двойники! Найдите все пары, чтобы вычислить связных.","imaginarium":"Разведка прислала загадочные фотографии. Угадайте, какую из них описал рассказчик.","detective":"С базы пропал бутерброд Шефа! Изучите улики и вычислите, кто его съел.","danetki":"Шеф расскажет загадочный случай из архива. Раскройте его, задавая вопросы, на которые он отвечает только «да» или «нет».","kosoykozel":"Пароль-скороговорка! Агент должен произнести её быстро и без запинки — иначе дверь не откроется.","musicpass":"Передавайте по кругу «секретный чемоданчик», пока играет музыка. Музыка стихла — у кого чемоданчик, тот получает задание от Шефа!","puzzle":"Секретная карта разорвана на части! Соберите её, чтобы узнать маршрут.","tower":"Постройте антенну связи со штабом — чем выше, тем чище сигнал!","quiz":"Экзамен на звание агента! Ответьте на вопросы о сказках и мультиках — агент должен знать всё.","wordgame":"Агенты общаются кодовыми словами. Играйте в словесную игру и не выдайте себя ни одной ошибкой!","mafia":"В агентство пробрались двойные агенты «Хрустиков»: по ночам они перекладывают чужие тапки. Днём «Тихие Ёжики» вычисляют, кто они!"},"pre_finale":"Все {fragments} собраны! Сложите их по порядку — получится секретный пароль. Введите его в Шпионский коммуникатор, и рецепт будет раскрыт!","finale":{"young":"Ура, агенты! Пароль верный! Рецепт бабушки Пышки спасён, а агент Сахарная Вата убежал отряхиваться от сахара. Вы настоящие тайные агенты! Шеф Ноль сейчас шёпотом скажет, где спрятана награда. Тс-с-с… бегом!","older":"Пароль принят. Операция «Секретный рецепт» завершена успешно! Рецепт оладушков бабушки Пышки в безопасности, а агент Сахарная Вата в очередной раз прилип к собственному следу и отправился домой пить чай. Агентство «Хрустики» даже прислало поздравительную открытку (липкую). Шеф Ноль присваивает вам высшую степень секретности и вручает награду. Где она? Шеф сейчас скажет. Только тихо — кругом уши!"},"treasure_ideas":["Оладьи по «секретному рецепту» — испеките их вместе","Шпионский набор: фонарик, блокнот и ручка","Право выбрать фильм на вечер","Купон «Секретная вылазка за мороженым»","Коробочка с конфетами, которая открывается только после секретного рукопожатия"],"passwords":["КОД","ЛУЧ","ШИФР","КЛЮЧ","ЗНАК","АГЕНТ","ТАЙНА","РАДАР","ПАРОЛЬ","МИССИЯ","РЕЦЕПТ","ЗАДАНИЕ","ШПИОНАЖ","ОПЕРАЦИЯ","РАЗВЕДКА","ШИФРОВКА","НЕВИДИМКА","РАЗВЕДЧИК","МАСКИРОВКА","НАБЛЮДЕНИЕ"],"certificate":{"title":"Удостоверение тайного агента","text":"Удостоверение выдано: {name}. Кодовое звание: «{title}». За ловкость, бесшумность и спасение секретного рецепта бабушки Пышки. Шеф Ноль, агентство «Тихий Ёжик»."}}],"spots":{"rooms":[{"id":"living","name":"Гостиная","emoji":"🛋️","safety":"Не прячьте у телевизора, розеток и проводов, на высоких полках и рядом с хрупкими вазами, стеклом и комнатными растениями."},{"id":"kids","name":"Детская","emoji":"🧸","safety":"Не прячьте на верхних полках и шкафах, куда тянет залезть, на втором ярусе кровати и в коробках с мелкими деталями, если играют малыши до 3 лет."},{"id":"kitchen","name":"Кухня","emoji":"🍳","safety":"Плита, духовка, микроволновка, чайник, ножи, шкаф под раковиной и еда — вне игры: тайники только на столе, табуретках и дверце холодильника."},{"id":"bedroom","name":"Спальня","emoji":"🛏️","safety":"Не прячьте в прикроватных тумбочках и косметичках — там часто лекарства и косметика, — и не выше роста ребёнка; комод должен быть устойчивым или прикреплён к стене."},{"id":"hall","name":"Коридор","emoji":"🚪","safety":"Входная дверь, электрощиток и верхние полки с шапками — вне игры: всё должно лежать на уровне детских глаз, а дверь на лестницу — закрыта."},{"id":"bath","name":"Ванная","emoji":"🛁","safety":"Только сухие и мягкие места — корзина для белья, полотенца, коврик, тазик; никакой воды в ванне, никакого унитаза, стиральной машины, шкафчика с химией и аптечки."},{"id":"study","name":"Кабинет","emoji":"📚","safety":"Не прячьте у компьютера, удлинителей и принтера, а ножницы, канцелярский нож и степлер заранее уберите со стола."}],"spots":[{"id":"living_sofa","room":"living","place":"Между сиденьем и спинкой дивана, уголок записки (или игрушки-находки для малышей) чуть торчит наружу","keyword":"ДИВАН","emoji":"🛋️","min_band":"b1","toddler":"Пойдём к дивану! Посмотрим, что спряталось между подушками?","simple":"Я большой и мягкий,\nСядь ко мне скорей!\nЯ вмещаю папу,\nМаму и детей.","riddle":"Он широкий, мягкий, гладкий,\nСпинка есть и две руки.\nВ нём теряются тетрадки,\nПульт и папины очки.","teen":"Главный пожиратель пультов, мелочи и носков в этом доме. Загляните ему в пасть — между спинкой и сиденьем."},{"id":"living_plaid","room":"living","place":"В складках пледа, сложенного на диване или в кресле (для малышей — игрушка-находка внутри)","keyword":"ПЛЕД","emoji":"🧣","min_band":"b1","toddler":"Где наш мягкий плед? Давай развернём его и посмотрим, что внутри!","simple":"Тёплый, мягкий, в клетку,\nНа диване свёрнут.\nУкрывает деток,\nЕсли вдруг замёрзнут.","riddle":"Он не шарф и не пальто,\nНо согреет, как никто:\nВ клетку, мягкий и пушистый,\nС бахромою золотистой.","teen":"Тканевая система обогрева гостиной: без батареек, с бахромой, лучше всего работает в паре с какао. Проверьте её складки."},{"id":"living_armchair","room":"living","place":"Под подушкой сиденья кресла или между сиденьем и подлокотником","keyword":"КРЕСЛО","emoji":"💺","min_band":"b3","toddler":"Идём к креслу! Поднимем подушку — что там?","simple":"Как диван, но для одного,\nМягкое — садись в него!\nРучки есть, а рук-то нет —\nВот и весь его секрет!","riddle":"Две руки, а пальцев нет,\nСпинка есть — а где хребет?\nНе диван, а брат его:\nМесто в нём для одного.","teen":"Младший брат дивана, рассчитанный ровно на одного. Поднимите его мягкое сиденье — он кое-что под собой прячет."},{"id":"living_rug","room":"living","place":"Под углом ковра в гостиной, вдали от проводов (край ковра плотно лежит на полу, чтобы никто не споткнулся)","keyword":"КОВЕР","emoji":"🧶","min_band":"b3","toddler":"Давай приподнимем уголок ковра! Кто там спрятался?","simple":"На полу лежит узорный,\nМягкий, тёплый и просторный.\nПо нему гуляют ножки —\nИ мои, и лапки кошки.","riddle":"В сказке — по небу летает,\nДома — тихо он лежит,\nНожки в тапочках встречает,\nПылесос над ним жужжит.","teen":"В восточных сказках он летает, а здесь давно заземлён и хранит под собой крошки и секреты. Загляните под его угол."},{"id":"living_coffeetable","room":"living","place":"Скотчем к нижней стороне журнального столика, у края (не у розеток и не у телевизора)","keyword":"СТОЛИК","emoji":"📰","min_band":"b6","toddler":"Идём к маленькому столику! Заглянем под него — что там приклеено?","simple":"Он стола меньшой братишка,\nНожки — как у коротышки,\nНа нём пульт, журнал и книжка.","riddle":"Ног четыре — не шагает,\nУ дивана отдыхает.\nНа обед не приглашён —\nЧай с журналом держит он.","teen":"Журнальный, но ничего не читает; на четырёх ногах, но никуда не ходит. Ответ приклеен к его нижней стороне."},{"id":"living_remote","room":"living","place":"Записку свернуть и прикрепить резинкой к пульту; пульт положить на журнальный столик или диван — не у телевизора и не у розеток","keyword":"ПУЛЬТ","emoji":"📺","min_band":"b6","toddler":"Где пульт от телевизора? Давай найдём его — на нём что-то есть!","simple":"С кнопками, маленький,\nВечно теряется.\nНажмёшь на кнопочку —\nМультик включается!","riddle":"Он командует экраном,\nНо без рук и без лица.\nПрячется он постоянно\nВ щель дивана без конца.","teen":"Маленький диктатор телевизора: из-за него в семье спорят чаще всего, а сам он вечно пропадает. Сегодня он нашёлся — проверьте его."},{"id":"living_book","room":"living","place":"Между страницами толстой книги на нижней полке стеллажа (книгу чуть выдвинуть корешком вперёд)","keyword":"КНИГА","emoji":"📖","min_band":"b10","toddler":"Пойдём к книжкам! Какая книжка выглядывает с полки?","simple":"Есть страницы и обложка,\nВ ней живут и лис, и кошка,\nИ Кощей, и Колобок —\nОткрывай её, дружок!","riddle":"Сто листочков — а не ветка,\nКорешок — а не растёт,\nХоть молчит она, но, детка,\nВ сказку за руку ведёт.","teen":"Бумажный носитель информации без батареек и вайфая; у него есть корешок, но он не растёт. Ищите между страниц самого толстого экземпляра на нижней полке."},{"id":"kids_bear","room":"kids","place":"В лапах любимого плюшевого мишки (или под ним), посаженного на кровать или на пол; для малышей — игрушка-находка рядом с мишкой","keyword":"МИШКА","emoji":"🧸","min_band":"b1","toddler":"Где наш мишка? Пойдём к мишке — что он держит в лапках?","simple":"Косолапый, плюшевый,\nМёд на завтрак кушает.\nСпит со мной в кроватке —\nВот и вся отгадка!","riddle":"Брат его в лесу дремучем\nСпит в берлоге до весны,\nА вот этот — самый лучший,\nОхраняет наши сны.","teen":"Его дикий родственник весит под полтонны и спит всю зиму, а этот набит синтепоном и дежурит на кровати. Проверьте, что у него в лапах."},{"id":"kids_bed","room":"kids","place":"Под одеялом в ногах детской кровати (только нижний ярус или обычная низкая кровать)","keyword":"КРОВАТЬ","emoji":"🛏️","min_band":"b1","toddler":"Пойдём к твоей кроватке! Что там прячется под одеялом?","simple":"Ночью в ней я сладко сплю,\nПо утрам её стелю.\nТам подушка, одеяло\nИ игрушек — ой, немало!","riddle":"Ночью — лодка в царство снов,\nДнём — батут для шалунов.\nТолько мама говорит:\n«Не скачи — она скрипит!»","teen":"Ночью — станция загрузки снов, днём — нелегальный батут. Ответ ждёт в её ногах, под одеялом."},{"id":"kids_blocks","room":"kids","place":"В коробке или ведёрке с крупными кубиками, под верхними кубиками","keyword":"КУБИКИ","emoji":"🧱","min_band":"b3","toddler":"Где твои кубики? Давай построим башню — а что лежит в коробке?","simple":"Красный, жёлтый, синий — в ряд,\nКаждый бок у них — квадрат.\nЯ из них построю дом,\nБашню, мост, гараж потом!","riddle":"Все бока у них квадратны,\nИз них — замки и мосты.\nБашню выстроишь — понятно:\nКот обрушит с высоты!","teen":"Шестигранные строительные модули: из них возводят башни, а младшие братья и коты их сносят. Загляните туда, где они хранятся."},{"id":"kids_truck","room":"kids","place":"В кузове игрушечного грузовика или самосвала, стоящего на полу","keyword":"ГРУЗОВИК","emoji":"🚚","min_band":"b3","toddler":"Где твой грузовик? Давай посмотрим, что он привёз в кузове!","simple":"Есть колёса, есть кабина,\nКузов сзади — как корзина.\nВозит кубики, песок\nИ гудит: «Би-би, дружок!»","riddle":"Он по стройкам ездит лихо,\nВозит камни и песок.\nМой же — маленький — так тихо\nВозит в кузове носок.","teen":"Тяжеловес игрушечного автопарка: кабина спереди, кузов сзади, грузоподъёмность — примерно три кубика. Проверьте груз."},{"id":"kids_backpack","room":"kids","place":"В переднем кармане рюкзака или портфеля, стоящего на полу","keyword":"РЮКЗАК","emoji":"🎒","min_band":"b6","toddler":"Где твой рюкзачок? Откроем кармашек — что там?","simple":"На спине его ношу,\nВ нём тетрадки и пенал.\nС ним хожу я на прогулку,\nИ в походы, и в спортзал.","riddle":"Как улитка — домик свой,\nЯ его ношу с собой.\nВ нём учебник, сок, пенал,\nМятый фантик, что пропал.","teen":"Переносной склад на двух лямках: учебники, пенал и забытый с прошлой четверти бутерброд. Проверьте его передний карман."},{"id":"kids_socks","room":"kids","place":"Внутри свёрнутой пары носков в нижнем ящике комода (комод устойчивый или прикреплён к стене)","keyword":"НОСКИ","emoji":"🧦","min_band":"b6","toddler":"Давай найдём носочки! Откроем нижний ящик — что спряталось в носочке?","simple":"Их всегда бывает пара,\nИх на ножки надевают.\nНо один — вот это чудо! —\nПостоянно пропадает.","riddle":"Близнецы живут в комоде,\nПо утрам — бегом на ножки.\nНо один из них уходит\nБез следа… А может, к кошке?","teen":"Парные изделия, известные тем, что один из пары регулярно исчезает в параллельное измерение. Ищите внутри свёрнутой пары в нижнем ящике."},{"id":"kids_album","room":"kids","place":"Между страницами альбома для рисования или раскраски на столе или нижней полке","keyword":"АЛЬБОМ","emoji":"🎨","min_band":"b10","toddler":"Где твой альбом для рисования? Давай полистаем — что там между страничками?","simple":"В нём листочки белые,\nЖдут меня, несмелые.\nВозьму карандаш —\nБудет домик наш!","riddle":"В нём страницы — словно снег,\nЖдут гуашь и карандаш.\nНарисую в нём для всех\nКосмолёт и Эрмитаж!","teen":"Склад чистых листов, где рождаются будущие шедевры (а пока — каракули). Ответ спрятан между его страницами."},{"id":"kitchen_fridge","room":"kitchen","place":"Под магнитом на дверце холодильника, на высоте роста ребёнка (не внутри); для малышей — яркая картинка или игрушка на магните","keyword":"ХОЛОДИЛЬНИК","emoji":"🧊","min_band":"b1","toddler":"Пойдём к холодильнику! Что там висит на дверце под магнитиком?","simple":"Белый шкаф на кухне,\nХолодно внутри.\nМолоко и сырники\nВ нём лежат, смотри!","riddle":"Летом в нём живёт зима,\nНочью он гудит — не спит.\nСыр, пломбир, кефир, хурма —\nВсё он холодом хранит.","teen":"Единственное место в квартире, где круглый год стоит зима, — а его дверца служит семейной доской объявлений. Ищите под магнитами."},{"id":"kitchen_cup","room":"kitchen","place":"В пустой чистой пластиковой детской кружке на обеденном столе, подальше от края (для малышей — игрушка-находка в кружке)","keyword":"КРУЖКА","emoji":"☕","min_band":"b1","toddler":"Где твоя кружечка? Пойдём к столу — что лежит в кружке?","simple":"У неё одно ушко,\nВ ней — какао, молоко,\nЧай, компот и даже сок —\nПей до донышка, дружок!","riddle":"Ухо есть — а глуховата,\nНе болтает, не поёт.\nС ней какао пьют ребята,\nС ней и мама чай свой пьёт.","teen":"Ёмкость с одним ухом, которое ничего не слышит. Ответ ждёт на её дне — на обеденном столе."},{"id":"kitchen_stool","room":"kitchen","place":"На сиденье табуретки, задвинутой под обеденный стол: записку видно, если выдвинуть табуретку (вставать на неё не нужно)","keyword":"ТАБУРЕТКА","emoji":"🪑","min_band":"b3","toddler":"Давай выдвинем табуретку из-под стола! Что на ней лежит?","simple":"Ножки есть, а спинки нету,\nСяду на неё к обеду.\nСтула младшая сестричка,\nКухонная невеличка.","riddle":"Это стул, да не совсем:\nСпинки нет — и нет проблем!\nПод столом её ищи,\nКак запахнет борщ и щи.","teen":"Мебельный минималист: отказался от спинки ради компактности и живёт под обеденным столом. Выдвиньте — и посмотрите сверху."},{"id":"kitchen_pot","room":"kitchen","place":"Внутри пустой холодной кастрюли с крышкой, которую заранее поставили на обеденный стол или на пол — НЕ на плиту","keyword":"КАСТРЮЛЯ","emoji":"🍲","min_band":"b3","toddler":"Смотри, кастрюля! Давай поднимем крышку — что там сварилось?","simple":"Два ушка и крышка-шапка,\nВ ней — компот, и суп, и кашка.","riddle":"Есть два уха — но не слышит,\nКрышку носит, как берет.\nВ ней пыхтит, бурлит и дышит —\nЧерез час у нас обед!","teen":"Двухухая металлическая ёмкость в берете, где обычно рождается суп. Сегодня она пустая и холодная — и прячет кое-что под крышкой."},{"id":"kitchen_napkins","room":"kitchen","place":"Между салфетками в салфетнице на обеденном столе","keyword":"САЛФЕТНИЦА","emoji":"🧻","min_band":"b6","toddler":"Где салфеточки? Давай достанем одну — ой, а что там ещё?","simple":"Я стою на столе,\nЛистики держу.\nВытри ротик — тебе\nЛистик подарю!","riddle":"На столе раскрылся веер\nИз бумажных лепестков.\nВытри рот — и ты, поверь мне,\nСтанешь чище всех котов!\nКто же веер тот хранит,\nНа столе весь день стоит?","teen":"Держатель одноразовых бумажных лепестков, спасающий скатерть после пиццы. Ответ спрятан среди её содержимого."},{"id":"kitchen_apron","room":"kitchen","place":"В кармане фартука, повешенного на спинку кухонного стула (не на крючок у плиты)","keyword":"ФАРТУК","emoji":"🧑‍🍳","min_band":"b6","toddler":"Где фартук? Давай заглянем в кармашек!","simple":"Мама в нём печёт оладьи,\nЧтоб мукой не пачкать платье.\nСпереди — карман большой,\nСзади — бантик озорной!","riddle":"Не рубашка, не жилет —\nСзади бантик, спинки нет.\nОт муки, от брызг, от теста\nБережёт он маму, честно!","teen":"Кухонные доспехи: спереди защита от муки и брызг, сзади — только бантик. Загляните в его карман."},{"id":"kitchen_table","room":"kitchen","place":"Скотчем к нижней стороне столешницы обеденного стола, у края со стороны стульев (не у плиты)","keyword":"СТОЛ","emoji":"🍽️","min_band":"b10","toddler":"Давай заглянем под стол! Что там приклеилось?","simple":"Есть четыре ножки,\nСверху — миски, ложки.\nСобирается за ним\nВся семья — и мы едим!","riddle":"Носит скатерть, как наряд,\nЖдёт тарелки и ребят.\nЛишь позвали на обед —\nВсе за ним! Свободных нет.","teen":"Главная мебель кухни: на нём едят, за ним спорят, под него роняют вилки. Ответ у него снизу — придётся нырнуть."},{"id":"bedroom_pillow","room":"bedroom","place":"Под подушкой на родительской кровати (для малышей — игрушка-находка)","keyword":"ПОДУШКА","emoji":"💤","min_band":"b1","toddler":"Пойдём к большой кровати! Поднимем подушку — что там?","simple":"Мягкая, пухлая,\nНа кровати лежу.\nПоложи щёчку —\nСны тебе покажу!","riddle":"Ночью — под щекой лежит,\nСны цветные сторожит.\nДнём — в бою летит в сестрицу,\nТолько перья — как от птицы!","teen":"Хранитель снов и главное оружие семейных боёв; иногда под ней зубная фея оставляет монетки. Сегодня оставили кое-что другое."},{"id":"bedroom_blanket","room":"bedroom","place":"Под краем одеяла в ногах родительской кровати, уголок записки (или игрушки) торчит","keyword":"ОДЕЯЛО","emoji":"🛌","min_band":"b1","toddler":"Где большое одеяло? Давай заглянем под него — кто там прячется?","simple":"Мягкое, большое,\nТёплое такое.\nЛягу — им укроюсь\nИ глаза закрою.","riddle":"Как письмо, в конверт одето,\nНо не носят по домам.\nНочью — тёплое, как лето,\nУкрывает пап и мам.","teen":"Каждую ночь его кладут в тканевый конверт, но так и не отправляют по почте. Загляните под его край у изножья."},{"id":"bedroom_pajamas","room":"bedroom","place":"В кармане или рукаве пижамы, сложенной на кровати","keyword":"ПИЖАМА","emoji":"👕","min_band":"b3","toddler":"Где пижамка? Давай поищем в рукавчике!","simple":"Мягкие штанишки,\nКофта со зверушкой —\nНадеваю на ночь,\nОбниму подушку.","riddle":"Это форма — но не школьная,\nИ костюм — да не для бала.\nНадеваешь — и, довольный,\nЕдешь в сны под одеялом.","teen":"Единственная форма одежды, в которой официально разрешено ничего не делать — только спать. Проверьте её карманы и рукава."},{"id":"bedroom_robe","room":"bedroom","place":"В кармане халата, разложенного на кровати или висящего на спинке стула","keyword":"ХАЛАТ","emoji":"👘","min_band":"b3","toddler":"Где мягкий халат? Давай заглянем в кармашек!","simple":"Длинный, мягкий, с пояском,\nПосле ванны в нём бегом!\nТёплый, как у мишки мех,\nВытрет капельки у всех.","riddle":"Не пальто — а с пояском,\nНе для улицы — для дома.\nПосле ванны прямиком\nЛезь в него, как в норку гнома!","teen":"Домашняя версия пальто: с поясом, без пуговиц и с правом ходить в нём весь выходной. Проверьте его карманы."},{"id":"bedroom_dresser","room":"bedroom","place":"В нижнем ящике комода, поверх сложенной одежды (комод устойчивый или прикреплён к стене; верхние ящики не трогать)","keyword":"КОМОД","emoji":"🗄️","min_band":"b6","toddler":"Давай откроем нижний ящик комода — что там лежит сверху?","simple":"В нём ящики-кармашки,\nА в них — носки, рубашки.\nОткрой нижний ящик —\nНайдёшь секрет настоящий!","riddle":"Он не шкаф, но у него\nЯщик, ящик… Ого-го!\nВ каждом — майки и носки,\nСвитера и пояски.","teen":"Многоэтажное общежитие для свитеров и маек, где у каждого жильца свой выдвижной этаж. Ответ — на самом нижнем."},{"id":"bedroom_wardrobe","room":"bedroom","place":"На дне платяного шкафа, сразу за дверцей: в обувной коробке или в кармане одежды на нижней вешалке (дверцу за ребёнком не закрывать)","keyword":"ШКАФ","emoji":"🚪","min_band":"b6","toddler":"Откроем дверцу шкафа! Посмотри внизу — что там?","simple":"Он большой, с двумя дверями,\nА внутри — открой, взгляни:\nПлатья, брюки с пиджаками\nСпят на плечиках они.","riddle":"Великан в углу стоит,\nНи о чём не говорит.\nА внутри него — вот так! —\nСпят пальто, рубашки, фрак.","teen":"Вертикальный отель для одежды: номера на плечиках, вместо ресепшена — две скрипучие дверцы. Ищите внизу, у самого входа."},{"id":"bedroom_suitcase","room":"bedroom","place":"Внутри пустого чемодана, лежащего на полу у шкафа или под кроватью (чемодан не запирать на замок)","keyword":"ЧЕМОДАН","emoji":"🧳","min_band":"b10","toddler":"Смотри, чемодан! Давай откроем — может, он куда-то собрался?","simple":"С ручкой и колёсами,\nЕдет он в поход.\nВ нём панамки, шорты —\nМоре нас зовёт!","riddle":"Он летал на самолёте,\nВ поезде катил на юг,\nА сейчас лежит в дремоте:\nОтпуск снится — море, луг.","teen":"Опытный путешественник на колёсиках: летал, ездил в поездах, а сейчас скучает в ожидании отпуска. Загляните к нему внутрь."},{"id":"hall_slippers","room":"hall","place":"Внутри тапочка, стоящего на коврике в прихожей (для малышей — маленькая мягкая игрушка)","keyword":"ТАПОЧКИ","emoji":"🥿","min_band":"b1","toddler":"Где твои тапочки? Давай заглянем в тапочек — что там?","simple":"Мягкие, домашние,\nНожкам — в самый раз.\nШлёп-шлёп по квартире —\nЦелый день у нас!","riddle":"Не ботинки, не сапожки,\nНо по дому носят ножки.\nШлёп да шлёп — у нас с утра\nЗвук их знает детвора.","teen":"Домашняя обувь, которую по утрам слышно раньше, чем видно: шлёп-шлёп. Загляните внутрь одного из пары."},{"id":"hall_hat","room":"hall","place":"Внутри шапки, положенной на нижнюю обувную полку или на пуфик (не на верхнюю полку)","keyword":"ШАПКА","emoji":"🧢","min_band":"b1","toddler":"Где твоя шапочка? Давай заглянем в шапку — что там?","simple":"Надеваю на макушку,\nЧтобы не замёрзли ушки.","riddle":"Не корона, не панама,\nА зимою всем нужна.\nБез неё ругает мама:\n«Уши мёрзнут! Где она?»","teen":"Головной убор с помпоном, о котором мама вспоминает первой при минус пяти. Проверьте, что у неё внутри."},{"id":"hall_boot","room":"hall","place":"Внутри чистого сухого резинового сапога, стоящего на коврике в прихожей (входная дверь закрыта)","keyword":"САПОГ","emoji":"👢","min_band":"b3","toddler":"Где сапожки? Давай заглянем в сапожок!","simple":"Резиновый, высокий,\nВ нём по лужам — скок!\nВсе ботинки мокнут,\nА он сухой, дружок!","riddle":"Для него любая лужа —\nЭто море по колено.\nДождик, слякоть, осень, стужа —\nОн шагает в них степенно.","teen":"Резиновый специалист по лужам: ему любая из них по колено. Загляните в его голенище."},{"id":"hall_mirror","room":"hall","place":"Скотчем к нижнему краю зеркала в прихожей, на уровне глаз ребёнка (зеркало надёжно закреплено на стене)","keyword":"ЗЕРКАЛО","emoji":"🪞","min_band":"b3","toddler":"Пойдём к зеркалу! Кто там? А что приклеено внизу?","simple":"Загляну в него — и вот:\nТам малыш такой живёт!\nЯ моргну — моргнёт и он,\nЯ — поклон, и он — поклон!","riddle":"Не окно — а ты в нём сам,\nПравду скажет по утрам:\nГде вихор торчит, как ёжик,\nГде на щёчке джем от ложек.","teen":"Единственный предмет в доме, который всегда показывает вас — но наоборот, справа налево. Проверьте его нижний край."},{"id":"hall_mitten","room":"hall","place":"Внутри варежки, положенной на нижнюю обувную полку или в корзину для шапок на уровне ребёнка","keyword":"ВАРЕЖКА","emoji":"🧤","min_band":"b6","toddler":"Где варежки? Давай засунем ручку в варежку — что там?","simple":"Тут четыре пальца вместе,\nА большой — на своём месте.\nРучкам в ней тепло зимой,\nНе теряй её, родной!","riddle":"Пять братишек — в тёплой хате:\nЧетверо — в одной кровати,\nА большой — в своей каморке.\nПотеряешь — будет горько!","teen":"Зимнее жилище на пять пальцев: четверо делят общую комнату, а большой живёт отдельно. Загляните внутрь — и не перепутайте с соседкой по паре."},{"id":"hall_jacket","room":"hall","place":"В кармане куртки, висящей на нижнем крючке вешалки (на уровне груди ребёнка)","keyword":"КУРТКА","emoji":"🧥","min_band":"b6","toddler":"Где твоя курточка? Давай заглянем в кармашек!","simple":"С капюшоном и на молнии,\nДва кармана, рукава.\nНадеваю на прогулку,\nЧтоб не мёрзла голова!","riddle":"Рукава — без рук, обидно!\nКапюшон — а не монах.\nНа крючке висит солидно\nФантик прячет в закромах.","teen":"У неё есть рукава без рук и капюшон без монаха, а в карманах обычно живут фантики. Проверьте, кто поселился там сегодня."},{"id":"hall_bag","room":"hall","place":"В пустой хозяйственной сумке или шопере на нижнем крючке или на полу (без документов, ключей и лекарств)","keyword":"СУМКА","emoji":"👜","min_band":"b10","toddler":"Где сумка? Давай заглянем внутрь — что мы купили?","simple":"Две ручки — а хлопать не умеет,\nСходит в магазин — и потяжелеет!","riddle":"Ручки есть, а хлопать нечем,\nРот на молнии — молчит.\nС рынка тащится под вечер\nТолстая — едва стоит!","teen":"Имеет две ручки, но ни разу никому не аплодировала; рот на молнии, а внутри — эхо прошлых походов в магазин. Ищите в ней."},{"id":"bath_towel","room":"bath","place":"В складках сухого полотенца на нижнем крючке или сложенного на низкой полке (не на стиральной машине)","keyword":"ПОЛОТЕНЦЕ","emoji":"🧖","min_band":"b1","toddler":"Где наше полотенце? Давай развернём — что там внутри?","simple":"Мягкое, пушистое,\nПосле ванны ждёт:\nВытрет щёчки чистые,\nКапли соберёт.","riddle":"Я не плаваю, не мою,\nНо из ванны каждый раз\nВсех встречаю, всех укрою,\nКапли вытру с рук и глаз.","teen":"Висит сухое, а работает только тогда, когда вы мокрые. Разверните его — ответ в складках."},{"id":"bath_duck","room":"bath","place":"Под резиновой уточкой на сухом коврике или низкой полке (ванна пустая, в неё не залезать)","keyword":"УТОЧКА","emoji":"🦆","min_band":"b1","toddler":"Где наша уточка? Кря-кря! Пойдём найдём уточку — что под ней?","simple":"Жёлтая, резиновая,\nПлавает со мной.\nКрякает весёлая\nВ ванночке большой.","riddle":"Клюв — а зёрнышек не просит,\nПлавает — да не в пруду:\nВ ванне с пеной гордо носит\nЖёлтый хвостик на виду.","teen":"Единственная птица в квартире, которая плавает только в пене и пищит, если её обнять. Проверьте, что под ней."},{"id":"bath_mat","room":"bath","place":"Под краем сухого коврика на полу ванной (коврик на нескользящей основе)","keyword":"КОВРИК","emoji":"🟦","min_band":"b3","toddler":"Давай приподнимем коврик! Что там под ним?","simple":"Я лежу у ванны,\nНожки вытираю.\nЧтобы не скользили,\nПол я согреваю.","riddle":"Как щенок, лежит у ванны,\nЖдёт тебя он постоянно.\nВстанешь мокрыми ногами —\nНе скользят: ведь он под вами!","teen":"Верный страж мокрых пяток: всю жизнь лежит у ванны и не даёт полу стать катком. Приподнимите его край."},{"id":"bath_boat","room":"bath","place":"В игрушечном кораблике или в корзинке с игрушками для купания на сухом полу (в ванну не класть)","keyword":"КОРАБЛИК","emoji":"⛵","min_band":"b3","toddler":"Где кораблик? Ту-ту! Поплыли искать — что он везёт?","simple":"По воде плывёт,\nПарус поднимает.\nВ ванне он живёт,\nВолны рассекает.","riddle":"Мачта есть, и есть корма,\nНо не ходит в океаны:\nМоре — пена, как зима,\nВ берегах из белой ванны.","teen":"Флагман банного флота: мачта есть, а ни одного океана за плечами — только пенные моря. Проверьте его трюм."},{"id":"bath_basin","room":"bath","place":"Под перевёрнутым пустым сухим тазиком на полу ванной","keyword":"ТАЗИК","emoji":"🪣","min_band":"b6","toddler":"Смотри, тазик! Давай поднимем — кто под ним прячется?","simple":"Как большая миска,\nТолько не для супа:\nВ нём стирают носки\nИ купают пупса.","riddle":"Как тарелка-великан,\nТолько суп в нём не варили.\nПеревернёшь — барабан!\nВ нём носки мы как-то мыли.","teen":"Круглая пластиковая ёмкость: тарелка для великана, барабан для малыша и бассейн для пупсов. Ответ спрятан под ней."},{"id":"bath_laundry","room":"bath","place":"В корзине для белья, поверх белья у стенки (корзина стоит на полу, далеко от бытовой химии)","keyword":"КОРЗИНА","emoji":"🧺","min_band":"b6","toddler":"Давай заглянем в корзину! Что там среди одёжек?","simple":"Я плетёная, с крышкой,\nСобираю бельё:\nКофты, носки, штанишки —\nСкладывай всё!","riddle":"Ест носки, футболки, брюки —\nИ голодная опять.\nВсё, что сбросят наши руки,\nБудет вечером жевать.","teen":"Вечно голодное существо, питающееся грязными носками; кормят его все, а опустошает только стирка. Загляните в его пасть."},{"id":"bath_sponge","room":"bath","place":"Внутри сухой мочалки-рукавички или под мочалкой на нижнем крючке (не рядом с шампунями и бытовой химией)","keyword":"МОЧАЛКА","emoji":"🧽","min_band":"b10","toddler":"Где мочалка? Давай пощупаем — что в ней спряталось?","simple":"Трёт мне спинку и ладошки,\nВ мыльной пене — как в снегу.\nСтану чище нашей кошки —\nБез неё я не могу!","riddle":"Я шершавая подружка,\nПену взбить — моя игра.\nОтотру и спинку, ушки —\nВыйдешь — ахнет детвора!","teen":"Шершавая напарница мыла и главный враг грязных пяток. Если она рукавичка — загляните внутрь, если нет — под неё."},{"id":"study_box","room":"study","place":"В открытой картонной коробке на полу у письменного стола (в коробке ничего, кроме записки или игрушки-находки)","keyword":"КОРОБКА","emoji":"📦","min_band":"b1","toddler":"Смотри, коробка! Давай заглянем внутрь — что там?","simple":"Из картона я, с углами,\nКот в меня залез — и спит!\nЧто внутри? Смотрите сами,\nКто же там у вас сидит?","riddle":"Почтальон её приносит,\nКот в ней спит, как в теремке.\nИз картона, крышку носит,\nЧто-то прячет в уголке.","teen":"Картонный куб, который люди считают упаковкой, а коты — недвижимостью премиум-класса. Загляните внутрь."},{"id":"study_chair","room":"study","place":"На сиденье рабочего стула, задвинутого под стол: записку видно стоя, залезать не нужно (если стул на колёсиках — отодвиньте его от проводов)","keyword":"СТУЛ","emoji":"🪑","min_band":"b1","toddler":"Пойдём к большому стулу! Что лежит на сиденье?","simple":"Есть спинка и ножки,\nНо не ходит он.\nСядь на него немножко —\nУдобно, как трон!","riddle":"Спинка есть — а не болит,\nНоги есть — да не бегут.\nЗа столом весь день стоит,\nЖдёт, когда за стол придут.","teen":"У него есть спинка, которая никогда не болит, и ноги, которые никогда не устают. Сегодня у него на сиденье кое-что для вас."},{"id":"study_pencil","room":"study","place":"Свёрнутая трубочкой записка в стакане с карандашами (заранее уберите оттуда ножницы, нож и циркуль)","keyword":"КАРАНДАШ","emoji":"✏️","min_band":"b3","toddler":"Где карандаши? Давай посмотрим в стаканчике — что там?","simple":"Острый носик, сам он тонкий,\nНарисует всё подряд:\nСолнце, домик и котёнка,\nИ цветы, и детский сад!","riddle":"Деревянная рубашка,\nНос — точёный, чёрный, длинный.\nПоведёт им по бумажке —\nБудут горы и долины!","teen":"Деревянный инструмент с графитовым сердцем: чем больше работает, тем короче становится. Ответ — среди его собратьев в стаканчике."},{"id":"study_globe","room":"study","place":"Скотчем к подставке глобуса снизу; глобус стоит на столе или на полу, не на высокой полке","keyword":"ГЛОБУС","emoji":"🌍","min_band":"b3","toddler":"Смотри, шарик-земля! Давай покрутим глобус — что у него снизу?","simple":"Шар на ножке крутится,\nНа нём — моря, леса.\nПальцем ткнёшь — и чудится:\nТам Африка! Чудеса!","riddle":"Он — Земля, но очень мал,\nНа подставке он вертится.\nЯ Австралию искал —\nПалец в Африку стремится!","teen":"Модель планеты в масштабе примерно 1:40 000 000, которая вращается от одного пальца. Ответ у неё под ногами — на подставке."},{"id":"study_folder","room":"study","place":"Внутри пустой папки на краю письменного стола (документы из неё заранее уберите)","keyword":"ПАПКА","emoji":"📁","min_band":"b6","toddler":"Смотри, папка! Давай откроем — что там лежит?","simple":"Две обложки — как у книжки,\nА внутри — листы-малышки.","riddle":"Звать её — почти как папу,\nТолько с буквой «К» внутри.\nУ неё бумаг охапка —\nНу-ка, в гости загляни!","teen":"Звучит почти как один из родителей, отличается одной согласной и хранит важные бумаги. Ответ — между её обложками."},{"id":"study_calendar","room":"study","place":"Под настольным календарём или между его листами; настенный — только если висит на уровне глаз ребёнка","keyword":"КАЛЕНДАРЬ","emoji":"📅","min_band":"b6","toddler":"Смотри, календарь! Давай полистаем — что там спряталось?","simple":"В нём живут все дни недели,\nМесяцы и праздники.\nДень рожденья — неужели?\nСкоро торт и шарики!","riddle":"В нём двенадцать братьев-месяцев,\nДни бегут, как стайка птиц.\nПраздник ищешь — сразу встретится\nСредь его цветных страниц.","teen":"Двенадцать братьев, триста шестьдесят пять дней и вечный вопрос «сколько до каникул?». Проверьте, что под ним или между его листов."},{"id":"study_dictionary","room":"study","place":"Между страницами толстого словаря на нижней полке","keyword":"СЛОВАРЬ","emoji":"📕","min_band":"b10","toddler":"Где большая толстая книга? Давай полистаем — что там между страничками?","simple":"В толстой книге все слова\nВстали в ряд от «А» до «Я».","riddle":"Все слова от А до Я\nВ нём стоят рядком, друзья.\nСлово трудное найдёшь —\nСмысл его сейчас поймёшь.","teen":"Толстый том, где все слова выстроены строго по алфавиту — от «аиста» до «ящерицы». Ответ спрятан между его страниц."}]},"games":[{"id":"bowling","title":"Мини-боулинг","bands":["b1","b3","b6"],"activity":"Движение; меткость; координация","props":"HOME","needs_src":"Кубики/пустые пластиковые бутылки и мягкий мяч","buy":"Нет, можно заменить домашними предметами","min_players":1,"zones":["hall","living"],"duration":[3,7],"noise":"active","safety":"Убрать хрупкие предметы; использовать мягкий мяч","quest_use":"Попасть по мишеням; сбить препятствие; открыть подсказку","stage":true,"short":"Сбей мягким мячом кегли из бутылок — и тайник откроется","needs":[{"item":"Пустые пластиковые бутылки","qty":"6 шт","alt":"рулоны туалетной бумаги или кубики"},{"item":"Мягкий мяч","qty":"1 шт","alt":"носок, свёрнутый в клубок"},{"item":"Малярный скотч для линии броска","qty":"1 рулон","alt":"тапок или шнурок на полу"}],"prep":"Убери из коридора всё хрупкое, поставь 6 буты а описать тремя словами, потом назвать."},"solo":"Ребёнок и родитель угадывают по очереди, а потом ребёнок сам собирает мешочек для родителя.","tool":"magicbag_items","timer_sec":0},{"id":"cinderella","title":"Золушка (сортировка)","bands":["b1","b3","b6"],"activity":"Сортировка; логика; внимание","props":"HOME","needs_src":"Крупные предметы разных цветов/форм, 2 ёмкости","buy":"Нет","min_players":1,"zones":["kids","kitchen","living"],"duration":[3,8],"noise":"quiet","safety":"Для малышей не использовать мелкие детали, фасоль или монеты","quest_use":"Разделить находки по признаку; собрать код","stage":true,"short":"Помоги Золушке разобрать перепутанные вещи до полуночи","needs":[{"item":"Крупные предметы двух-трёх цветов","qty":"10–20 шт","alt":"кубики, мячики, носки, крышки от банок"},{"item":"Ёмкости","qty":"2–3 шт","alt":"кастрюли, коробки, тазики"}],"prep":"Перемешай 10–20 предметов на ковре, рядом поставь 2–3 пустые ёмкости.","prep_min":2,"howto":["Для малышей бери только крупные вещи — никакой фасоли, бусин и монет.","Открой задание в приложении: по какому признаку сортируем (цвет, форма, мягкое и твёрдое).","Запусти таймер на 2 минуты — «пока часы не пробили полночь».","Все разбирают вместе, ты только подсказываешь, а не исправляешь.","Проверьте ёмкости: если что-то попало не туда, пусть дети сами найдут «чужака».","С 6+ посчитайте предметы в каждой ёмкости — числа и будут кодом."],"win":"Этап пройден, когда всё разложено по своим местам. Не успели до полуночи — фея дарит ещё минуту.","adapt":{"b1":"2 ёмкости и один простой признак: мячики сюда, кубики туда.","b3":"Сортировка по цвету или форме в 3 ёмкости.","b6":"Двойной признак (красное и мягкое) или по первой букве названия, плюс подсчёт для кода."},"solo":"Родитель помогает и нарочно ошибается, а ребёнок ловит ошибки и исправляет.","tool":"sort_tasks","timer_sec":120},{"id":"repeat","title":"Повтори","bands":["b1","b3","b6"],"activity":"Подражание; память; движение","props":"NONE","needs_src":"Ничего; при act":"Полное название сказки очень длинное — в нём упомянуты и князь Гвидон, и царевна Лебедь."},{"q":"Кто написал сказку «Конёк-Горбунок»?","options":["Пётр Ершов","Александр Пушкин","Лев Толстой","Иван Крылов"],"a":0,"fact":"Ершов написал «Конька-Горбунка» совсем молодым — ещё студентом."},{"q":"С какого раза старик поймал золотую рыбку?","options":["С первого","Со второго","С третьего","С пятого"],"a":2,"fact":"Сначала невод пришёл с одной тиной, потом с травой морской, а в третий раз — с рыбкой."},{"q":"Сколько лет старик со старухой жили у синего моря?","options":["Десять лет","Тридцать лет и три года","Сто лет","Семь лет"],"a":1,"fact":"Жили они в ветхой землянке: старик ловил неводом рыбу, а старуха пряла пряжу."},{"q":"Какую плату попросил Балда у попа за свою службу?","options":["Мешок золота","Корову","Новую избу","Три щелчка по лбу в год"],"a":3,"fact":"Поп призадумался, но согласился — понадеялся на русский «авось»."},{"q":"Кто «идёт направо — песнь заводит, налево — сказку говорит»?","options":["Пёс верный","Конь ретивый","Кот учёный","Ворон мудрый"],"a":2,"fact":"Эти строки — из вступления к поэме Пушкина «Руслан и Людмила»."},{"q":"Сколько богатырей выходили из моря в «Сказке о царе Салтане»?","options":["Семь","Двенадцать","Тридцать три","Сорок"],"a":2,"fact":"С богатырями из моря выходил их дядька Черномор."},{"q":"В какой стране жил сказочник Ганс Христиан Андерсен?","options":["В Германии","В Швеции","В Дании","В Норвегии"],"a":2,"fact":"В Копенгагене, столице Дании, стоит знаменитый памятник Русалочке."},{"q":"Сколько тюфяков положили на горошину в сказке «Принцесса на горошине»?","options":["Три","Двадцать","Семь","Сто"],"a":1,"fact":"Поверх тюфяков положили ещё двадцать перин, а горошину потом отдали в кунсткамеру."},{"q":"Сколько собак охраняли сокровища в сказке Андерсена «Огниво»?","options":["Одна","Две","Семь","Три"],"a":3,"fact":"У последней собаки глаза были величиной с Круглую башню."},{"q":"Из какой страны был сказочник Шарль Перро?","options":["Из Англии","Из Франции","Из Италии","Из Германии"],"a":1,"fact":"Перро записал «Золушку», «Кота в сапогах» и «Спящую красавицу»."},{"q":"В кого фея превратила мышей в сказке Перро «Золушка»?","options":["В собак","В птиц","В лошадей","В пажей"],"a":2,"fact":"Тыква стала каретой, крыса — кучером, а ящерицы — лакеями."},{"q":"Какой титул Кот в сапогах придумал своему хозяину?","options":["Граф Монте-Кристо","Маркиз де Карабас","Барон Мюнхгаузен","Герцог Бекингем"],"a":1,"fact":"Хитрый кот так ловко всё устроил, что хозяин женился на принцессе."},{"q":"Что несла бабушке Красная Шапочка в сказке Шарля Перро?","options":["Пирожок и горшочек масла","Корзинку яблок","Банку мёда","Кувшин молока"],"a":0,"fact":"Красную шапочку, за которую девочку так прозвали, ей подарила бабушка."},{"q":"Как звали братьев Гримм?","options":["Ганс и Христиан","Якоб и Вильгельм","Шарль и Пьер","Карл и Фридрих"],"a":1,"fact":"Братья Гримм были учёными-языковедами и собирали народные сказки Германии."},{"q":"Куда направлялись Бременские музыканты в сказке братьев Гримм?","options":["В Бремен","В Берлин","В Мюнхен","В Гамбург"],"a":0,"fact":"В сказке звери так и не дошли до Бремена — остались жить в лесном домике."},{"q":"Кто проглотил солнце в сказке Чуковского «Краденое солнце»?","options":["Крокодил","Медведь","Волк","Тигр"],"a":0,"fact":"Медведь заставил Крокодила вернуть солнце, и на небе снова стало светло."},{"q":"Кто победил Тараканище в сказке Чуковского?","options":["Кот","Ёж","Воробей","Лягушка"],"a":2,"fact":"Перед Тараканищем дрожали даже большие звери, а маленький воробей не испугался."},{"q":"Кого с большим трудом тащили из болота в стихотворении Чуковского «Телефон»?","options":["Слона","Бегемота","Крокодила","Медведя"],"a":1,"fact":"«Ох, нелёгкая это работа — из болота тащить бегемота!»"},{"q":"Кто написал книги про Чебурашку и про дядю Фёдора?","options":["Эдуард Успенский","Самуил Маршак","Сергей Михалков","Николай Носов"],"a":0,"fact":"Ещё Успенский придумал старуху Шапокляк и почтальона Печкина."},{"q":"Кто автор оригинальной книги о Винни-Пухе?","options":["Борис Заходер","Астрид Линдгрен","Алан Милн","Льюис Кэрролл"],"a":2,"fact":"На русский язык книгу пересказал поэт Борис Заходер."},{"q":"Кто написал книгу про Малыша и Карлсона?","options":["Астрид Линдгрен","Ганс Христиан Андерсен","Алан Милн","Туве Янссон"],"a":0,"fact":"Шведская писательница Линдгрен придумала также Пеппи Длинныйчулок."},{"q":"Кто озвучил Волка в мультфильме «Ну, погоди!»?","options":["Юрий Никулин","Евгений Леонов","Олег Табаков","Анатолий Папанов"],"a":3,"fact":"Евгений Леонов озвучил другого любимого героя — Винни-Пуха."},{"q":"Что означает «Хакуна матата» из «Короля Льва»?","options":["«Привет, друг»","«Вперёд, к победе»","«Я король»","«Нет забот»"],"a":3,"fact":"Это выражение на языке суахили, на котором говорят в Восточной Африке."},{"q":"Как называется королевство Эльзы и Анны в «Холодном сердце»?","options":["Эренделл","Нарния","Тридевятое царство","Корона"],"a":0,"fact":"Королевство Корона — родина Рапунцель из мультфильма «Рапунцель: Запутанная история»."},{"q":"Чем знаменита «История игрушек» 1995 года?","options":["Первый цветной мультфильм","Первый полнометражный мультфильм, целиком созданный на компьютере","Первый мультфильм со звуком","Первый мультфильм о космосе"],"a":1,"fact":"Мультфильм сняла студия Pixar."},{"q":"По какой книге создан мультфильм «Фиксики»?","options":["«Гарантийные человечки» Эдуарда Успенского","«Незнайка» Николая Носова","«Карлсон» Астрид Линдгрен","«Буратино» Алексея Толстого"],"a":0,"fact":"В книге крошечные человечки жили внутри бытовых приборов и чинили их."},{"q":"Кто написал «Денискины рассказы»?","options":["Виктор Драгунский","Николай Носов","Эдуард Успенский","Валентин Катаев"],"a":0,"fact":"Главного героя, Дениску Кораблёва, писатель списал со своего сына Дениса."},{"q":"Какая речка спрятала сестрицу в сказке «Гуси-лебеди»?","options":["Медовая речка, сахарные берега","Хрустальная речка, серебряные берег
