      d.rounds = [3, 4, 5].map(L => sample(r, B.repeat[band], L));
    }
    return d;
  }

  /* ---------- пароль ---------- */
  function choosePassword(r, th, N) {
    const words = th.passwords.filter(w => /^[А-Я]+$/.test(w));
    let fit = words.filter(w => w.length >= N);
    if (!fit.length) fit = words.slice().sort((a, b) => b.length - a.length).slice(0, 1);
    const minLen = Math.min(...fit.map(w => w.length));
    const word = pick(r, fit.filter(w => w.length === minLen));
    const idx = word.split('').map((_, i) => i);
    const hidden = word.length <= N ? idx : sample(r, idx, N).sort((a, b) => a - b);
    return { word, hidden }; // hidden — позиции, буквы которых спрятаны в записках
  }

  /* ---------- главный генератор ---------- */
  function generate(rec) {
    const params = rec.params;
    const seed = rec.seed;
    const ov = rec.overrides || {};
    const prof = profile(params);
    const th = themeForHost(theme(params.theme), params.host);
    const rooms = (params.rooms && params.rooms.length ? params.rooms : ['living', 'kids', 'kitchen']).slice().sort((a, b) => ROOM_ORDER.indexOf(a) - ROOM_ORDER.indexOf(b));
    const N = Math.max(3, Math.min(maxStages(prof, rooms.length), Number(params.stages) || defaultStages(prof.ages)));

    // маршрут: N комнат этапов + комната финала
    const rr = rng(seed + ':route');
    const order = shuffle(rr, rooms);
    const route = [];
    for (let i = 0; i <= N; i++) route.push(order[i % order.length]);

    // тайники
    const rs = rng(seed + ':spots');
    const usedSpots = new Set();
    // тайники по силам: малышам — самые простые; с малышом в группе — не сложнее дошкольных; иначе ищут старшие
    const spotLimit = prof.mode === 'toddler' ? 0 : (prof.bY === 'b1' ? 1 : bi(prof.bO));
    const spotOk = s => bi(s.min_band) <= spotLimit;
    function chooseSpot(roomId, forced) {
      if (forced) { const f = QD.spots.spots.find(s => s.id === forced); if (f) { usedSpots.add(f.id); return f; } }
      let pool = QD.spots.spots.filter(s => s.room === roomId && !usedSpots.has(s.id) && spotOk(s));
      if (!pool.length) pool = QD.spots.spots.filter(s => s.room === roomId && !usedSpots.has(s.id) && bi(s.min_band) <= Math.max(1, spotLimit));
      if (!pool.length) pool = QD.spots.spots.filter(s => s.room === roomId && !usedSpots.has(s.id));
      if (!pool.length) pool = QD.spots.spots.filter(s => s.room === roomId && spotOk(s));
      if (!pool.length) pool = QD.spots.spots.filter(s => !usedSpots.has(s.id));
      const s = pick(rs, pool);
      usedSpots.add(s.id);
      return s;
    }
    // сначала фиксированные тайники из правок, чтобы не заняли
    Object.keys(ov).forEach(k => { if (ov[k] && ov[k].spot) usedSpots.add(ov[k].spot); });
    const spots = [];
    for (let i = 0; i < N; i++) {
      const forced = ov[i] && ov[i].spot;
      if (forced) usedSpots.delete(forced);
      spots.push(chooseSpot(route[i + 1], forced));
    }
    const tForced = ov.treasure && ov.treasure.spot;
    if (tForced) usedSpots.delete(tForced);
    const treasureSpot = chooseSpot(route[N], tForced);

    // игры
    const rg = rng(seed + ':games');
    const usedGames = [], usedTools = [];
    const games = [];
    for (let i = 0; i < N; i++) {
      const roomId = route[i];
      let g = null;
      if (ov[i] && ov[i].game) {
        const forced = game(ov[i].game);
        if (forced && gameFits(forced, roomId, prof, params, true).ok) g = forced;
      }
      if (!g) {
        let pool = QD.games.filter(x => !usedGames.includes(x.id) && gameFits(x, roomId, prof, params).ok);
        if (games.some(x => x.id === 'detective')) pool = pool.filter(x => x.id !== 'detective');
        if (!pool.length) pool = QD.games.filter(x => !usedGames.includes(x.id) && gameFits(x, roomId, prof, params, true).ok);
        // повтор игры (с другим наполнением) лучше, чем игра не к месту
        if (!pool.length) pool = QD.games.filter(x => x.id !== (games[i - 1] || {}).id && x.id !== 'detective' && gameFits(x, roomId, prof, params).ok);
        if (!pool.length) pool = QD.games.filter(x => x.id !== (games[i - 1] || {}).id && x.id !== 'detective' && gameFits(x, roomId, prof, params, true).ok);
        if (!pool.length) pool = QD.games.filter(x => gameFits(x, roomId, prof, params, true).ok);
        if (!pool.length) pool = QD.games.filter(x => x.id === 'repeat' || x.id === 'magicbag');
        const prev = games[i - 1];
        const ctx = { prof, params, r: rg, idx: i, prev, usedTools };
        pool = pool.map(x => ({ x, s: scoreGame(x, ctx) })).sort((a, b) => b.s - a.s);
        g = pool[0].x;
      }
      usedGames.push(g.id); usedTools.push(g.tool);
      games.push(g);
    }

    // пароль / символы
    const rp = rng(seed + ':pass');
    let password = null, symbols = null;
    const fragments = [];
    if (prof.mode === 'letters') {
      password = choosePassword(rp, th, N);
      const letters = password.hidden.map(i => ({ pos: i, letter: password.word[i] }));
      const assigned = shuffle(rp, letters);
      for (let i = 0; i < N; i++) fragments.push(assigned[i] || { pos: -1, letter: '★' });
    } else if (prof.mode === 'symbols') {
      symbols = sample(rp, SYMBOLS, N);
      for (let i = 0; i < N; i++) fragments.push({ symbol: symbols[i].id, name: symbols[i].name });
    } else {
      for (let i = 0; i < N; i++) fragments.push({ toy: true });
    }

    // этапы
    const used = {};
    const rc = rng(seed + ':content');
    const address = kidsAddress(params);
    const roomName = id => (th.room_names && th.room_names[id]) || (room(id) || {}).name || id;
    const capAddr = address.charAt(0).toUpperCase() + address.slice(1);
    const fill = (txt, extra) => String(txt || '')
      .replace(/(^|[.!?…]\s+|«)\{kids\}/g, (m, p) => p + capAddr)
      .replace(/\{kids\}/g, address)
      .replace(/\{fragments\}/g, th.fragment.many)
      .replace(/\{fragment\}/g, th.fragment.one)
      .replace(/\{total\}/g, N)
      .replace(/\{room\}/g, extra && extra.room ? extra.room : '')
      .replace(/\{n\}/g, extra && extra.n ? extra.n : '');
    const stages = games.map((g, i) => {
      const rCont = rng(seed + ':c' + i + ':' + g.id);
      const content = toolContent(g, prof, params, rCont, used);
      const clue = makeClue(rng(seed + ':clue' + i + ':' + spots[i].id), spots[i], prof, g.id);
      return {
        n: i + 1,
        room: route[i],
        roomName: roomName(route[i]),
        roomReal: (room(route[i]) || {}).name,
        beat: fill(th.beats[i % th.beats.length], { room: roomName(route[i]), n: i + 1 }),
        game: g,
        flavor: fill((th.game_flavor || {})[g.id] || ''),
        adapt: g.adapt ? (g.adapt[prof.bD] || g.adapt[prof.bY] || '') : '',
        content,
        clue,
        nextRoom: route[i + 1],
        nextRoomName: roomName(route[i + 1]),
        nextRoomReal: (room(route[i + 1]) || {}).name,
        success: fill(th.trial_success[i % th.trial_success.length]),
        found: fill(th.found[i % th.found.length]),
        fragment: fragments[i]
      };
    });

    const treasure = {
      spot: treasureSpot,
      clue: makeClue(rng(seed + ':treasure'), treasureSpot, prof, null)
    };

    // титулы
    const rt = rng(seed + ':titles');
    const titles = shuffle(rt, th.kid_titles);
    const kids = params.kids.map((k, i) => ({ name: (k.name || '').trim() || ('Участник ' + (i + 1)), age: k.age, title: titles[i % titles.length] }));

    // подготовка
    const prep = buildPrep({ stages, prof, th, password, fragments, treasure, params, N });

    const intro = fill(th.intro[prof.bD === 'b13' ? 'b10' : prof.bD] || th.intro.b6);
    const playMin = stages.reduce((s, st) => s + avg(st.game.duration) + (prof.mode === 'toddler' ? 2 : 3), 0) + 6;

    return {
      id: rec.id, seed, params, prof, theme: th, N, route, stages, treasure, password, symbols, fragments, kids,
      address, intro,
      preFinale: prof.mode === 'letters' ? fill(th.pre_finale)
        : prof.mode === 'symbols' ? 'Все ' + th.fragment.many + ' собраны! Разложите найденные картинки по порядку — какая нашлась первой, какая второй… Правильный порядок откроет замок!'
        : 'Все ' + th.fragment.many + ' собраны! Остался последний шаг — открыть сундук. Постучим по нему все вместе?',
      finale: fill(prof.mode === 'toddler' || prof.mode === 'symbols' ? th.finale.young : th.finale.older),

  }

  const avg = d => (d && d.length ? (d[0] + (d[1] || d[0])) / 2 : 5);

  function buildPrep({ stages, prof, th, password, fragments, treasure, params, N }) {
    const items = []; // {id, group, title, detail}
    const add = (group, id, title, detail) => items.push({ group, id, title, detail: detail || '' });

    // 1. Записки / находки
    if (prof.mode === 'toddler') {
      add('hide', 'paper', 'Приготовьте ' + N + ' ' + plural(N, 'игрушку-находку', 'игрушки-находки', 'игрушек-находок'), 'Любые знакомые малышу игрушки или яркие предметы крупнее кулака взрослого. Каждую положите в тайник ниже.');
    } else {
      add('hide', 'paper', N + ' ' + plural(N, 'листочек', 'листочка', 'листочков') + ' бумаги и фломастер', 'Это ' + th.fragment.many + '. Можно сложить каждый вчетверо или свернуть трубочкой.');
    }
    stages.forEach((st, i) => {
      const f = fragments[i];
      let what;
      if (prof.mode === 'letters') what = 'Напишите крупно букву «' + f.letter + '»';
      else if (prof.mode === 'symbols') what = 'Нарисуйте крупно: ' + f.name;
      else what = 'Положите игрушку-находку';
      add('hide', 'frag' + i, (st.nextRoomReal || '') + ': ' + st.clue.place, what + '. Это ' + th.fragment.one + ' №' + (i + 1) + '. Дети найдут его после испытания этапа ' + (i + 1) + '.');
    });

    // главный приз — настоящий подарок
    const prizeBand = prof.bD === 'b13' ? 'b13' : prof.bD;
    const PRIZES = {
      b1: 'мягкая игрушка, книжка с плотными страницами, мыльные пузыри, любимое детское печенье',
      b3: 'небольшая игрушка (фигурка, машинка, кукла), набор наклеек, пластилин или раскраска, шоколадное яйцо или любимые сладости',
      b6: 'фигурка или небольшой конструктор, набор для творчества, светящиеся браслеты, сладости',
      b10: 'головоломка или небольшая настольная игра, скетчбук с маркерами, сладости, вечер с фильмом на выбор',
      b13: 'то, что ребёнок выбрал бы сам: значки, брелок, книга, любимые сладости, поход в кино или пицца на выбор'
    };
    add('hide', 'treasure', 'Главный приз — ' + (treasure.spot.place.charAt(0).toLowerCase() + treasure.spot.place.slice(1)),
      'Комната: ' + ((room(treasure.spot.room) || {}).name || '') + '.\n' +
      'Дети больше всего ждут настоящий подарок: ' + PRIZES[prizeBand] + '.\n' +
      (prof.count > 1 ? 'Приготовьте приз каждому — одинаковый или равноценный, чтобы никто не расстроился.\n' : '') +
      'Сложите всё в коробку-«сундук» и добавьте что-то по сюжету: ' + th.treasure_ideas.slice(0, 2).join('; ') + '.');

    // 2. Испытания: что нужно и как разложить — одним пунктом на этап
    stages.forEach((st, i) => {
      const g = st.game;
      const lines = [];
      if ((g.needs || []).length) {
        lines.push('Понадобится:\n' + g.needs.map(n => '• ' + n.item.charAt(0).toLowerCase() + n.item.slice(1) + (n.qty && !/^1 шт/.test(n.qty) ? ' (' + n.qty + ')' : '') + (n.alt ? ' — или ' + n.alt : '')).join('\n'));
      }
      if (g.prep && g.id !== 'puzzle' && g.id !== 'scrabble') lines.push('Заранее: ' + g.prep.charAt(0).toLowerCase() + g.prep.slice(1));
      if (g.id === 'scrabble') lines.push('Заранее: напишите на отдельных бумажках буквы: ' + st.clue.letters.join(' ') + '. Отдайте их детям во время испытания.');
      if (g.id === 'puzzle') lines.push('Заранее: нарисуйте на листе место тайника — «' + st.clue.place + '» — и разрежьте на ' + ({ b1: 3, b3: 4, b6: 8, b10: 12, b13: 12 }[prof.bD]) + ' частей.');
      if (g.id === 'detective' && st.content.case) {
        const c = st.content.case;
        lines.push('Подозреваемые — игрушки: ' + c.suspects.map(x => x.name).join(', ') + '. Напишите ' + c.clues.length + ' записки-улики (тексты — в этапе ' + st.n + ') и разложите по местам.');
      }
      if (g.id === 'jenga') lines.push('Нарисуйте на 4–5 блоках символ ' + th.emoji + ' — кто вытащит такой блок, выполняет мини-задание.');
      if (!lines.length) return;
      add('stage', 'st' + i, 'Этап ' + st.n + ' · ' + st.roomReal + ': ' + g.title, lines.join('\n'));
    });

    // 3. Костюмы
    const costAll = (th.costumes || []).filter(c => bi(c.min_band || 'b1') <= bi(prof.bY) + (prof.bY === 'b1' ? 0 : 1));
    const cost = costAll.filter(c => c.who === 'kids').slice(0, 2).concat(costAll.filter(c => c.who === 'parent').slice(0, 1), costAll.filter(c => c.who === 'props').slice(0, 1));
    cost.forEach((c, i) => add('costume', 'cos' + i, c.name + (c.who === 'parent' ? ' (для вас)' : c.who === 'props' ? ' (реквизит)' : ''), c.how + (c.minutes ? ' ~' + c.minutes + ' мин.' : '')));

    // 4. Атмосфера
    (th.atmosphere || []).slice(0, 2).forEach((a, i) => add('mood', 'mood' + i, a, ''));

    // безопасность
    const safety = [];
    stages.forEach(st => { if (st.game.safety && !safety.includes(st.game.safety)) safety.push(st.game.safety); });
    [...new Set(stages.map(s => s.room).concat(stages.map(s => s.nextRoom)))].forEach(id => { const r = room(id); if (r && r.safety && !safety.includes(r.safety)) safety.push(r.safety); });

    // костюмы — по желанию, в оценку не входят
    const minutes = Math.round((N * 1.2 + stages.reduce((s, st) => s + Math.min(5, st.game.prep_min || 0), 0) + 2) / 5) * 5;
    return { items, safety, minutes: Math.max(10, minutes) };
  }

  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }

  root.Engine = {
    BANDS, BAND_LABEL, bandOf, profile, defaultStages, maxStages, generate, eligibleGames, gameFits,
    rng, shuffle, sample, pick, plural, themeForHost, SYMBOLS, ALPHA, ROOM_ORDER, game, theme, room, caesar, atbash
  };
})(typeof window !== 'undefined' ? window : globalThis);

  /* ---------- утилиты ---------- */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  }
  function hexToRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function mix(a, b, t) { const A = hexToRgb(a), B = hexToRgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }

  /* ---------- маршрут (змейка как в настольной игре) ---------- */
  function routeSVG(stops, cur) {
    const W = 340, cols = 3, rowH = 104, xs = [56, 170, 284], top = 42;
    const pts = stops.map((s, i) => {
      const row = Math.floor(i / cols), col = i % cols;

        labelLines(s.label).map((ln, k) => '<text class="l" x="' + p.x + '" y="' + (p.y + 44 + k * 15) + '">' + esc(ln) + '</text>').join('') + '</g>';
    });

  const HOME_ICON = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg>';

  }

  function go(screen, opts) {
    if (opts && opts.replace !== true && S.screen !== screen) S.history.push(S.screen);
    S.screen = screen;
    render();
    window.scrollTo(0, 0);
  }
  function back() {
    stopAudio();
    if (closeSheet()) return;
    if (S.screen === 'wizard' && S.wiz && S.wiz.step > 0) { S.wiz.step--; render(); window.scrollTo(0, 0); return; }
    if (S.screen === 'play') { S.screen = 'overview'; render(); window.scrollTo(0, 0); return; }
    S.screen = 'home'; S.history = []; render(); window.scrollTo(0, 0);
  }
  if (inTG) { try { TG.BackButton.onClick(back); } catch (e) {} }

  function render() {
    stopTimer();
    const fn = { home: renderHome, wizard: renderWizard, overview: renderOverview, play: renderPlay }[S.screen];
    fn();
    if (inTG) { try { if (S.screen === 'home') TG.BackButton.hide(); else TG.BackButton.show(); } catch (e) {} }
    if (S.screen === 'play') { requestWake(); try { if (tgv('6.2')) TG.enableClosingConfirmation(); } catch (e) {} }
    else { releaseWake(); try { if (tgv('6.2')) TG.disableClosingConfirmation(); } catch (e) {} }
    const themed = (S.screen === 'overview' || S.screen === 'play') && S.q;
    paintChrome(themed ? S.q.theme.palette.bg : null);
  }

  /* ---------- экран: главная ---------- */
  async function renderHome() {
    const ids = await loadIndex();
    const recs = (await Promise.all(ids.map(loadRec))).filter(Boolean);
    const nm = userName();
    const demo = [{ emoji: '🛋️', label: 'Гостиная', n: 1 }, { emoji: '🍳', label: 'Кухня', n: 2 }, { emoji: '🧸', label: 'Детская', n: 3 }, { emoji: '🛏️', label: 'Спальня', n: 4 }, { emoji: '🚪', label: 'Коридор', n: 5 }, { emoji: '🎁', label: 'Сокровище', fin: true }];
    let saved = '';
    if (recs.length) {
      saved = '<div class="section-title"><h2>Ваши квесты</h2></div><div class="saved">' + recs.map(r => {
        const th = E.themeForHost(E.theme(r.params.theme), r.params.host);
        const pr = r.progress || {};
        const N = r.N || r.params.stages;
        const st = pr.done ? 'Пройден 🎉' : (pr.stage != null && pr.started ? 'Этап ' + (Math.min(pr.stage, N - 1) + 1) + ' из ' + N : 'Не начат');
        const names = r.params.kids.map(k => k.name).filter(Boolean).join(', ');
        return '<div class="row"><button class="saved-item grow" data-open="' + r.id + '"><span class="emo" style="background:' + th.palette.bg + '">' + th.emoji + '</span><span class="grow"><span class="t">' + esc(th.title) + '</span><br><span class="s">' + esc(names ? names + ' · ' : '') + st + '</span></span></button>' +
          '<button class="del" data-del="' + r.id + '" aria-label="Удалить квест">✕</button></div>';
      }).join('') + '</div>';
    }
    $app.innerHTML = '<div class="wrap">' +
      '<section class="hero"><h1>Домашний квест</h1>' +
      '<p class="lead">' + (nm ? esc(nm) + ', превратите' : 'Превратите') + ' квартиру в настоящее приключение. Всё для подготовки уже есть у вас дома.</p></section>' +
      '<div class="track-hero" style="' + themeVars({ palette: shellPalette() }) + '">' + routeSVG(demo, 2) + '</div>' +
      saved +
      '<div class="section-title"><h2>Как это работает</h2></div>' +
      '<ol class="howto-list">' +
      '<li><b>Расскажите о детях и доме</b><span class="muted">Возраст, имена, какие комнаты можно использовать.</span></li>' +
      '<li><b>Выберите сюжет</b><span class="muted">Пираты, космос, детективы, волшебная школа — восемь историй.</span></li>' +
      '<li><b>Подготовьтесь по списку</b><span class="muted">Приложение скажет, где спрятать записки, что написать и какой реквизит собрать.</span></li>' +
      '<li><b>Ведите игру с телефона</b><span class="muted">Тексты для чтения вслух, таймеры, карточки, загадки и финальный замок с паролем.</span></li>' +
      '</ol>' +
      '</div>' +
      '<div class="bar"><div class="inner"><button class="btn" id="new">Собрать квест</button></div></div>';
    $app.querySelector('#new').onclick = () => { S.wiz = newWizard(); go('wizard'); };
    $app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openQuest(b.dataset.open));
    $app.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      const ok = await confirmBox('Удалить этот квест?');
      if (ok) { await delRec(b.dataset.del); renderHome(); }
    });
  }
  function shellPalette() {
    const cs = getComputedStyle(document.documentElement);
    const v = n => cs.getPropertyValue(n).trim() || '#000000';
    return { bg: v('--bg'), surface: v('--surface'), ink: v('--ink'), accent: v('--primary'), accent2: v('--sun') };
  }
  function confirmBox(msg) {
    return new Promise(res => {
      if (inTG && tgv('6.2')) { try { TG.showConfirm(msg, ok => res(!!ok)); return; } catch (e) {} }
      // своё окно подтверждения: в некоторых браузерах confirm() заблокирован
      let done = false;
      const finish = v => { if (done) return; done = true; closeSheet(); res(v); };
      sheet('<h2 style="font-size:19px;line-height:1.35">' + esc(msg) + '</h2><div class="row" style="margin-top:16px"><button class="btn ghost grow" id="cf-no">Отмена</button><button class="btn grow" id="cf-yes">Да</button></div>', root => {
        root.querySelector('#cf-yes').onclick = () => finish(true);
        root.querySelector('#cf-no').onclick = () => finish(false);
        root.querySelector('#sheet-close').classList.add('hidden');
        root.querySelector('.sheet-back').onclick = () => finish(false);
      });
    });
  }

  async function openQuest(id) {
    const rec = await loadRec(id);
    if (!rec) { toast('Квест не найден'); return; }
    S.rec = rec; S.q = E.generate(rec); S.tab = 'stages';
    go('overview');
  }

  /* ---------- экран: мастер ---------- */
  const WSTEPS = ['Дети', 'Комнаты', 'Сюжет', 'Настройки'];
  function renderWizard() {
    const w = S.wiz;
    const head = (title, sub) => '<div class="topline">' + homeBtn() + '<div class="steps">' + WSTEPS.map((_, i) => '<i class="' + (i <= w.step ? 'on' : '') + '"></i>').join('') + '</div></div>' +
      '<div class="step-head"><div class="k">Шаг ' + (w.step + 1) + ' из ' + WSTEPS.length + '</div><h1>' + title + '</h1>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>';
    let body = '', canNext = true, nextLabel = 'Дальше';
    const prof = E.profile({ kids: w.kids });

    if (w.step === 0) {
      body = head('Кто будет играть?', 'Имена появятся в сюжете и в грамотах. Можно не заполнять.') +
        '<div class="stack">' + w.kids.map((k, i) => '<div class="kid">' +
          '<input type="text" maxlength="20" placeholder="Имя ребёнка" value="' + esc(k.name) + '" data-name="' + i + '" autocomplete="off">' +
          '<div class="agebox"><div class="stepper"><button data-age="' + i + '" data-d="-1" aria-label="Меньше">−</button><output>' + k.age + '</output><button data-age="' + i + '" data-d="1" aria-label="Больше">+</button></div></div>' +
          '<div class="meta"><span>' + k.age + ' ' + P(k.age, 'год', 'года', 'лет') + ' · ' + E.BAND_LABEL[E.bandOf(k.age)] + '</span>' + (w.kids.length > 1 ? '<button class="rm" data-rm="' + i + '">Убрать</button>' : '') + '</div>' +
          '</div>').join('') +
        (w.kids.length < 8 ? '<button class="add-kid" id="addkid">+ Добавить ребёнка</button>' : '') +
        '<div class="setting"><div class="h">Кто проводит квест</div><div class="s">Тексты для чтения вслух будут в мужском или женском роде</div>' +
        '<div class="seg" role="radiogroup" aria-label="Кто проводит квест"><button role="radio" aria-checked="' + (w.host !== 'f') + '" data-host="m">Ведущий</button><button role="radio" aria-checked="' + (w.host === 'f') + '" data-host="f">Ведущая</button></div></div>' +
        '</div>';
    } else if (w.step === 1) {
      body = head('Где будет квест?', 'Отметьте комнаты, по которым можно ходить. Чем больше комнат, тем интереснее маршрут.') +
        '<div class="rooms">' + QD.spots.rooms.map(r => '<button class="room-tg" aria-pressed="' + w.rooms.includes(r.id) + '" data-room="' + r.id + '"><span class="e">' + r.emoji + '</span>' + esc(r.name) + '</button>').join('') + '</div>' +
        '<p class="muted small" style="margin-top:14px">Балкон и лестничная клетка не используются — это небезопасно.</p>';
      canNext = w.rooms.length > 0;
    } else if (w.step === 2) {
      const allFit = QD.themes.every(t => t.bands.includes(prof.bD));
      const sorted = QD.themes.map(t => E.themeForHost(t, w.host)).sort((a, b) => (b.bands.includes(prof.bD) ? 1 : 0) - (a.bands.includes(prof.bD) ? 1 : 0));
      body = head('Выберите сюжет', 'Сюжет задаёт историю, костюмы и пароль. Игры внутри подстроятся под возраст.') +
        '<div class="themes">' + sorted.map(t => {
          const p = t.palette, fits = t.bands.includes(prof.bD);
          return '<button class="theme-card" aria-pressed="' + (w.theme === t.id) + '" data-theme="' + t.id + '" style="background:' + p.bg + ';color:' + p.ink + '">' +
            '<span class="e">' + t.emoji + '</span><span class="t">' + esc(t.title) + '</span><span class="d">' + esc(t.tagline) +
            (fits && !allFit ? '<span class="fit" style="background:' + p.accent + ';color:' + onColor(p.accent) + '">лучше всего по возрасту</span>' : '') + '</span></button>';
        }).join('') + '</div>';
      canNext = !!w.theme;
    } else {
      const maxS = E.maxStages(prof, w.rooms.length);
      if (w.stages == null) w.stages = Math.min(maxS, E.defaultStages(w.kids.map(k => k.age)));
      w.stages = Math.max(3, Math.min(maxS, w.stages));
      const tmp = E.generate({ id: 'tmp', seed: 'preview', params: paramsFromWiz() });
      body = head('Последние штрихи', '') +
        '<div class="stack">' +
        '<div class="setting"><div class="row"><div><div class="h">Сколько этапов</div><div class="s">Каждый этап — испытание и поиск тайника</div></div>' +
        '<div class="stepper"><button data-st="-1" aria-label="Меньше">−</button><output>' + w.stages + '</output><button data-st="1" aria-label="Больше">+</button></div></div></div>' +
        '<div class="setting"><div class="row"><div class="grow"><div class="h">Тихий режим</div><div class="s">Без бега и прыжков — если соседи снизу или кто-то спит</div></div>' +
        '<button class="switch" role="switch" aria-checked="' + w.quiet + '" id="quiet" aria-label="Тихий режим"></button></div></div>' +
        '<div class="setting"><div class="h">Есть дома</div><div class="s">Необязательно — без них тоже всё сработает</div><div class="chips">' +
        [['jenga', 'Дженга'], ['puzzle', 'Пазлы'], ['imaginarium', 'Имаджинариум']].map(([id, n]) => '<button class="chip" aria-pressed="' + w.owned.includes(id) + '" data-own="' + id + '">' + n + '</button>').join('') +
        '</div></div>' +
        '<div class="summary"><div><b>~' + tmp.est.play + '</b><span>минут игры</span></div><div><b>~' + tmp.est.prep + '</b><span>минут подготовки</span></div><div><b>' + w.stages + '</b><span>' + P(w.stages, 'этап', 'этапа', 'этапов') + '</span></div></div>' +
        '<p class="muted small">' + modeText(prof) + '</p>' +
        '</div>';
      nextLabel = 'Собрать квест';
    }
    $app.innerHTML = '<div class="wrap">' + body + '</div>' +
      '<div class="bar"><div class="inner">' + (w.step > 0 ? '<button class="btn ghost" id="prev" aria-label="Назад">←</button>' : '') +
      '<button class="btn" id="next" ' + (canNext ? '' : 'disabled') + '>' + nextLabel + '</button></div></div>';

    // события
    const q = s => $app.querySelectorAll(s);
    q('[data-name]').forEach(inp => inp.oninput = () => { w.kids[+inp.dataset.name].name = inp.value; });
    q('[data-age]').forEach(b => b.onclick = () => { const k = w.kids[+b.dataset.age]; k.age = Math.max(1, Math.min(16, k.age + (+b.dataset.d))); w.stages = null; renderWizard(); });
    q('[data-rm]').forEach(b => b.onclick = () => { w.kids.splice(+b.dataset.rm, 1); w.stages = null; renderWizard(); });
    q('[data-host]').forEach(b => b.onclick = () => { w.host = b.dataset.host; haptic('light'); renderWizard(); });
    const add = $app.querySelector('#addkid'); if (add) add.onclick = () => { w.kids.push({ name: '', age: w.kids[w.kids.length - 1].age }); w.stages = null; renderWizard(); };
    q('[data-room]').forEach(b => b.onclick = () => { const id = b.dataset.room; w.rooms = w.rooms.includes(id) ? w.rooms.filter(x => x !== id) : w.rooms.concat(id); haptic('light'); renderWizard(); });
    q('[data-theme]').forEach(b => b.onclick = () => { w.theme = b.dataset.theme; haptic('light'); renderWizard(); });
    q('[data-st]').forEach(b => b.onclick = () => { w.stages += +b.dataset.st; renderWizard(); });
    const qt = $app.querySelector('#quiet'); if (qt) qt.onclick = () => { w.quiet = !w.quiet; renderWizard(); };
    q('[data-own]').forEach(b => b.onclick = () => { const id = b.dataset.own; w.owned = w.owned.includes(id) ? w.owned.filter(x => x !== id) : w.owned.concat(id); renderWizard(); });
    const prev = $app.querySelector('#prev'); if (prev) prev.onclick = () => { w.step--; renderWizard(); window.scrollTo(0, 0); };
    $app.querySelector('#next').onclick = async () => {
      if (w.step < 3) { w.step++; renderWizard(); window.scrollTo(0, 0); return; }
      const rec = { id: S.rec && S.wiz.editing ? S.rec.id : uid(), created: Date.now(), seed: uid(), params: paramsFromWiz(), overrides: {}, progress: { stage: 0, phase: 'intro', checked: [] } };
      const q2 = E.generate(rec);
      rec.N = q2.N;
      await saveRec(rec);
      S.rec = rec; S.q = q2; S.tab = 'stages'; S.history = ['home'];
      haptic('success');
      go('overview', { replace: true });
    };
  }
  function paramsFromWiz() {
    const w = S.wiz;
    return { kids: w.kids.map(k => ({ name: (k.name || '').trim(), age: k.age })), host: w.host || 'm', rooms: w.rooms.slice(), theme: w.theme || 'pirates', stages: w.stages, quiet: w.quiet, owned: w.owned.slice() };
  }
  function modeText(prof) {
    if (prof.mode === 'toddler') return 'Режим для малышей: без записок и загадок — вы ведёте малыша к тайникам и прячете игрушки-находки.';
    if (prof.mode === 'symbols') return 'Для дошкольников: на записках — простые картинки (звезда, сердце…), загадки короткие, финальный замок открывается картинками.';
    if (prof.bD === 'b6') return 'Загадки в стихах, на записках — буквы. Из букв в финале собирается пароль.';
    return 'Для старших: подсказки зашифрованы (шифр сдвига, номера букв, зеркальный алфавит), на записках — буквы пароля.';
  }

  /* ---------- экран: обзор квеста ---------- */
  function renderOverview() {
    const q = S.q, rec = S.rec, th = q.theme, pr = rec.progress || {};
    const checked = new Set(pr.checked || []);
    const names = q.kids.map(k => k.name).join(', ');
    let body = '<div class="wrap">' +
      '<header class="q-head"><div class="topline">' + homeBtn() + '<div class="emo">' + th.emoji + '</div></div><h1>' + esc(th.title) + '</h1>' +
      '<div class="q-meta"><span><b>' + q.N + '</b> ' + P(q.N, 'этап', 'этапа', 'этапов') + '</span><span>игра <b>~' + q.est.play + ' мин</b></span><span>подготовка <b>~' + q.est.prep + ' мин</b></span></div>' +
      '<div class="q-meta">' + esc(names) + '</div>' +
      '<div class="q-meta"><span>' + (rec.params.host === 'f' ? 'Ведущая' : 'Ведущий') + ': <b>' + esc(th.parent_role.name) + '</b></span><button class="link" id="hostsw">' + (rec.params.host === 'f' ? 'сменить на ведущего' : 'сменить на ведущую') + '</button></div></header>' +
      '<div style="margin-top:14px">' + routeSVG(questStops(q), pr.done ? q.N + 1 : (pr.started ? pr.stage : null)) + '</div>' +
      '<div class="tabs" role="tablist"><button role="tab" aria-selected="' + (S.tab === 'stages') + '" data-tab="stages">1. Этапы</button><button role="tab" aria-selected="' + (S.tab === 'prep') + '" data-tab="prep">2. Подготовка</button></div>';

    if (S.tab === 'prep') {
      const groups = [
        ['hide', 'Спрячьте до начала', q.prof.mode === 'toddler' ? 'Пока малыш не видит. Прячьте на виду и низко.' : 'Пока дети не видят. Записки сложите, чтобы букву не было видно сразу.'],
        ['stage', 'Испытания: что нужно и как разложить', 'Всё из того, что есть дома. Этапы без реквизита сюда не попали.'],
        ['costume', 'Костюмы из подручного', 'По желанию, но с ними в разы веселее.'],
        ['mood', 'Атмосфера', '']
      ];
      const total = q.prep.items.length, done = q.prep.items.filter(it => checked.has(it.id)).length;
      if (q.password) {
        body += '<div class="note pw"><div><div class="small muted">Пароль финала — не показывайте детям</div><div class="w" id="pw">' + '•'.repeat(q.password.word.length) + '</div></div><button class="btn sm ghost" id="pwshow">Показать</button></div>';
      }
      body += '<p class="muted small" style="margin-top:12px">Готово ' + done + ' из ' + total + '</p>';
      groups.forEach(([gid, title, desc]) => {
        const items = q.prep.items.filter(it => it.group === gid);
        if (!items.length) return;
        body += '<section class="group"><h2>' + title + '</h2>' + (desc ? '<div class="gd">' + desc + '</div>' : '') +
          items.map(it => '<button class="check" role="checkbox" aria-checked="' + checked.has(it.id) + '" data-check="' + it.id + '"><span class="box">' + (checked.has(it.id) ? '✓' : '') + '</span><span class="ct"><b>' + esc(it.title) + '</b>' + (it.detail ? '<span>' + esc(it.detail) + '</span>' : '') + '</span></button>').join('') +
          '</section>';
      });
      if (q.prep.safety.length) body += '<section class="group"><h2>Безопасность</h2><div class="gd">Пробегитесь глазами перед стартом.</div><div class="reveal"><button data-rev="safety">Показать ' + q.prep.safety.length + ' ' + P(q.prep.safety.length, 'пункт', 'пункта', 'пунктов') + '</button><ul class="safety body hidden" id="rev-safety">' + q.prep.safety.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul></div></section>';
    } else {
      const clueKind = st => st.game.id === 'puzzle' ? 'картинка-пазл' : ({ toddler: 'вы ведёте малыша к тайнику', simple: 'простая загадка', riddle: 'загадка в стихах', cipher: 'шифровка', anagram: 'слово из букв' }[st.clue.kind] || 'загадка');
      body += '<div class="note">' + (pr.started ? 'План квеста. Замены сразу появятся в игре.' : 'Посмотрите, что будет на каждом этапе. Не нравится испытание или тайник — замените. Потом переходите к подготовке.') + '</div>' +
        q.stages.map((st, i) => {
          const g = st.game;
          const needs = (g.needs || []).map((n, k) => k ? n.item.charAt(0).toLowerCase() + n.item.slice(1) : n.item).join(', ');
          return '<div class="stage-row"><div class="num">' + st.n + '</div><div class="grow"><div class="r">' + esc(st.roomReal) + ' · ' + esc(st.roomName) + '</div><div class="g">' + esc(g.title) + '</div>' +
          '<div class="muted small">' + esc(g.short) + ' · ' + g.duration.join('–') + ' мин</div>' +
          '<dl class="facts">' +
          (needs ? '<dt>Понадобится</dt><dd>' + esc(needs) + '</dd>' : '<dt>Понадобится</dt><dd>ничего, всё в телефоне</dd>') +
          '<dt>Награда</dt><dd>' + esc(clueKind(st)) + ' → ' + esc(th.fragment.one) + ' в комнате «' + esc(st.nextRoomReal) + '»</dd>' +
          '<dt>Тайник</dt><dd>' + esc(st.clue.place) + '</dd></dl>' +
          '<div class="reveal"><button data-rev="hw' + i + '">Как пройдёт испытание</button><div class="body hidden" id="rev-hw' + i + '"><ol style="margin:0;padding-left:20px">' + g.howto.map(h => '<li>' + esc(fillTxt(h)) + '</li>').join('') + '</ol></div></div>' +
          '<div class="acts"><button data-swap="' + i + '">Заменить испытание</button><button data-spot="' + i + '">Выбрать тайник</button></div></div></div>';
        }).join('') +
        '<div class="stage-row"><div class="num">🎁</div><div><div class="r">Финал · ' + esc((E.room(q.treasure.spot.room) || {}).name) + '</div><div class="g">' + (q.password ? 'Пароль и сокровище' : q.symbols ? 'Замок из картинок и сокровище' : 'Сундук с сокровищем') + '</div><div class="muted small">Сокровище: ' + esc(q.treasure.spot.place) + '</div>' +
        '<div class="acts"><button data-spot="treasure">Выбрать место</button></div></div></div>' +
        '<div class="row" style="margin-top:18px;gap:8px;flex-wrap:wrap"><button class="btn sm line" id="regen">Пересобрать всё</button><button class="btn sm line" id="edit">Изменить настройки</button></div>';
    }
    const startLabel = pr.done ? 'Пройти ещё раз' : pr.started ? 'Продолжить: этап ' + (Math.min(pr.stage, q.N - 1) + 1) : 'Начать квест';
    const toPrep = S.tab === 'stages' && !pr.started && !pr.done;
    body += '</div><div class="bar"><div class="inner">' + (toPrep ? '<button class="btn" id="toprep">Всё устраивает → к подготовке</button>' : '<button class="btn" id="start">' + startLabel + '</button>') + '</div></div>';
    $app.innerHTML = '<div class="themed" style="' + themeVars(th) + '">' + body + '</div>';
    document.body.style.background = th.palette.bg;

    const qa = s => $app.querySelectorAll(s);
    qa('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; renderOverview(); window.scrollTo(0, 0); });
    qa('[data-check]').forEach(b => b.onclick = () => {
      const id = b.dataset.check, set = new Set(rec.progress.checked || []);
      set.has(id) ? set.delete(id) : set.add(id);
      rec.progress.checked = [...set]; saveRec(rec); haptic('light');
      const y = window.scrollY; renderOverview(); window.scrollTo(0, y);
    });
    qa('[data-rev]').forEach(b => b.onclick = () => { const el = $app.querySelector('#rev-' + b.dataset.rev); if (el) el.classList.toggle('hidden'); });
    const pw = $app.querySelector('#pwshow');
    if (pw) pw.onclick = () => { const el = $app.querySelector('#pw'); const shown = el.textContent === q.password.word; el.textContent = shown ? '•'.repeat(q.password.word.length) : q.password.word; pw.textContent = shown ? 'Показать' : 'Скрыть'; };
    qa('[data-swap]').forEach(b => b.onclick = () => openSwap(+b.dataset.swap));
    qa('[data-spot]').forEach(b => b.onclick = () => nextSpot(b.dataset.spot));
    const rg = $app.querySelector('#regen');
    if (rg) rg.onclick = async () => {
      if (rec.progress.started && !(await confirmBox('Пересобрать квест? Прогресс игры сбросится.'))) return;
      rec.seed = uid(); rec.overrides = {}; rec.progress = { stage: 0, phase: 'intro', checked: [] };
      S.q = E.generate(rec); rec.N = S.q.N; await saveRec(rec); haptic('success'); toast('Готов новый вариант'); renderOverview();
    };
    const ed = $app.querySelector('#edit');
    if (ed) ed.onclick = () => { S.wiz = newWizard(rec.params); S.wiz.editing = true; S.wiz.step = 0; go('wizard'); };
    const hs = $app.querySelector('#hostsw');
    if (hs) hs.onclick = async () => {
      rec.params.host = rec.params.host === 'f' ? 'm' : 'f';
      S.q = E.generate(rec); await saveRec(rec); haptic('light');
      toast('Квест ведёт: ' + S.q.theme.parent_role.name);
      const y = window.scrollY; renderOverview(); window.scrollTo(0, y);
    };
    const tp = $app.querySelector('#toprep');
    if (tp) tp.onclick = () => { S.tab = 'prep'; renderOverview(); window.scrollTo(0, 0); };
    const stBtn = $app.querySelector('#start');
    if (stBtn) stBtn.onclick = async () => {
      if (pr.done) { rec.progress = { stage: 0, phase: 'intro', checked: rec.progress.checked || [] }; }
      const hideIds = q.prep.items.filter(it => it.group === 'hide').map(it => it.id);
      const notHidden = hideIds.filter(id => !(rec.progress.checked || []).includes(id)).length;
      if (!rec.progress.started && notHidden > 0) {
        const ok = await confirmBox('Не отмечено, что ' + P(notHidden, 'спрятана', 'спрятаны', 'спрятано') + ' ' + notHidden + ' ' + P(notHidden, 'вещь', 'вещи', 'вещей') + ' из списка «Спрячьте до начала». Всё равно начать?');
        if (!ok) { S.tab = 'prep'; renderOverview(); return; }
      }
      rec.progress.started = true; await saveRec(rec);
      go('play');
    };
  }

  function openSwap(i) {
    const q = S.q, st = q.stages[i];
    const list = E.eligibleGames(st.room, q.prof, q.params);
    sheet('<h2>Испытание для этапа ' + st.n + '</h2><p class="muted small">Подходят по возрасту, числу игроков и комнате «' + esc(st.roomReal) + '».</p><div class="pick-list">' +
      list.map(g => '<button class="' + (g.id === st.game.id ? 'cur' : '') + '" data-g="' + g.id + '"><b>' + esc(g.title) + '</b><span>' + esc(g.short) + ' · ' + g.duration.join('–') + ' мин</span></button>').join('') + '</div>', root => {
      root.querySelectorAll('[data-g]').forEach(b => b.onclick = async () => {
        S.rec.overrides = S.rec.overrides || {};
        S.rec.overrides[i] = Object.assign({}, S.rec.overrides[i], { game: b.dataset.g });
        S.q = E.generate(S.rec); await saveRec(S.rec); closeSheet(); toast('Испытание заменено'); renderOverview();
      });
    });
  }
  function nextSpot(key) {
    const q = S.q, isT = key === 'treasure';
    const roomId = isT ? q.treasure.spot.room : q.stages[+key].nextRoom;
    const curId = isT ? q.treasure.spot.id : q.stages[+key].clue.spotId;
    const takenBy = {};
    q.stages.forEach(s => { takenBy[s.clue.spotId] = 'этап ' + s.n; });
    takenBy[q.treasure.spot.id] = 'главный приз';
    const B = E.BANDS.indexOf.bind(E.BANDS);
    const limit = Math.max(1, q.prof.mode === 'toddler' ? 0 : (q.prof.bY === 'b1' ? 1 : B(q.prof.bO)));
    const pool = QD.spots.spots.filter(s => s.room === roomId && B(s.min_band) <= limit);
    const roomName = (E.room(roomId) || {}).name || '';
    const title = isT ? 'Где спрятать главный приз' : 'Тайник для фрагмента №' + (+key + 1);
    sheet('<h2>' + title + '</h2><p class="muted small">Комната: ' + esc(roomName) + '. Все места безопасные и подходят по возрасту.</p><div class="pick-list">' +
      pool.map(sp => {
        const busy = sp.id !== curId && takenBy[sp.id];
        return '<button class="' + (sp.id === curId ? 'cur' : '') + '" data-sp="' + sp.id + '"' + (busy ? ' disabled' : '') + '><b>' + sp.emoji + ' ' + esc(sp.place) + '</b>' +
          (sp.id === curId ? '<span>Выбрано сейчас</span>' : busy ? '<span>Уже занят: ' + esc(takenBy[sp.id]) + '</span>' : '') + '</button>';
      }).join('') + '</div>', root => {
      root.querySelectorAll('[data-sp]').forEach(b => b.onclick = async () => {
        if (b.dataset.sp === curId) { closeSheet(); return; }
        S.rec.overrides = S.rec.overrides || {};
        const k = isT ? 'treasure' : +key;
        S.rec.overrides[k] = Object.assign({}, S.rec.overrides[k], { spot: b.dataset.sp });
        S.q = E.generate(S.rec); await saveRec(S.rec); closeSheet(); haptic('light'); toast('Тайник выбран');
        const y = window.scrollY; renderOverview(); window.scrollTo(0, y);
      });
    });
  }

  /* ---------- экран: игра ---------- */
  function fillTxt(s) {
    const q = S.q;
    return String(s || '').replace(/\{fragment\}/g, q.theme.fragment.one).replace(/\{fragments\}/g, q.theme.fragment.many).replace(/\{kids\}/g, q.address);
  }
  function para(s) { return String(s || '').split(/\n+/).filter(Boolean).map(x => '<p>' + esc(x) + '</p>').join(''); }

  function slotsHTML(foundCount, popIdx) {
    const q = S.q;
    if (q.prof.mode === 'toddler') {
      return '<div class="slots">' + q.stages.map((_, i) => '<span class="slot ' + (i < foundCount ? 'got' : '') + (i === popIdx ? ' pop' : '') + '">' + (i < foundCount ? '🧸' : '') + '</span>').join('') + '</div>';
    }
    if (q.prof.mode === 'symbols') {
      return '<div class="slots">' + q.stages.map((st, i) => '<span class="slot ' + (i < foundCount ? 'got' : '') + (i === popIdx ? ' pop' : '') + '">' + (i < foundCount ? sym(st.fragment.symbol) : '') + '</span>').join('') + '</div>';
    }
    // буквы: показываем найденные буквы в порядке нахождения
    return '<div class="slots">' + q.stages.map((st, i) => '<span class="slot ' + (i < foundCount ? 'got' : '') + (i === popIdx ? ' pop' : '') + '">' + (i < foundCount ? esc(st.fragment.letter) : '') + '</span>').join('') + '</div>';
  }

  function renderPlay() {
    const q = S.q, rec = S.rec, pr = rec.progress, th = q.theme;
    if (pr.stage >= q.N && !['lock', 'treasure', 'done'].includes(pr.phase)) pr.phase = 'lock';
    const i = Math.min(pr.stage, q.N - 1), st = q.stages[i];
    const finalPart = ['lock', 'treasure', 'done'].includes(pr.phase);
    const found = finalPart ? q.N : (pr.phase === 'found' ? i + 1 : i);
    const top = '<div class="play-top"><div class="inner"><div class="where">' + homeBtn() + '<b class="grow">' + (finalPart ? 'Финал' : 'Этап ' + st.n + ' из ' + q.N + ' · ' + esc(st.roomName)) + '</b><span>' + esc(finalPart ? (E.room(q.treasure.spot.room) || {}).name : st.roomReal) + '</span></div>' +
      '<div class="dots">' + q.stages.map((_, k) => '<i class="' + (k < found ? 'done' : (k === i && !finalPart ? 'cur' : '')) + '"></i>').join('') + '</div>' +
      slotsHTML(found, pr.phase === 'found' && pr._pop ? i : -1) + '</div></div>';
    pr._pop = false;
    let body = '', bar = '';
    const say = (who, html) => '<div class="say"><span class="who">' + who + '</span>' + html + '</div>';

    if (pr.phase === 'intro') {
      body = '<p class="muted small" style="margin:0">Сначала прочитайте про себя, детям — только блоки «Читайте вслух».</p>' +
        '<div class="note"><b>Ваша роль — ' + esc(th.parent_role.name) + '.</b> ' + esc(th.parent_role.how) + '</div>' +
        '<div class="note"><b>Как идёт игра.</b> ' + (q.prof.mode === 'toddler'
          ? 'На каждом этапе — простая игра. Потом вы вместе с малышом идёте к тайнику и находите игрушку. Нажмите «Нашли» — откроется следующий этап.'
          : 'На каждом этапе: читаете сюжет → проводите испытание по инструкции → жмёте «Испытание пройдено» и читаете подсказку → дети ищут ' + esc(th.fragment.one) + ' в другой комнате → жмёте «Нашли». Если дети застряли, есть «Подсказка» и «Ответ для взрослого».') + '</div>' +
        say('Читайте вслух', para(q.intro));
      bar = '<button class="btn" data-act="toStage">Поехали!</button>';
    } else if (pr.phase === 'stage') {
      const g = st.game;
      body = say('Читайте вслух', '<p>' + esc(st.beat) + '</p>' + (st.flavor ? '<p>' + esc(st.flavor) + '</p>' : '')) +
        '<section class="trial"><div class="muted small">Испытание · ' + g.duration.join('–') + ' мин</div><h2>' + esc(g.title) + '</h2><div class="sh">' + esc(g.short) + '</div>' +
        toolButtons(st) +
        '<ol>' + g.howto.map(h => '<li>' + esc(fillTxt(h)) + '</li>').join('') + '</ol>' +
        toolInline(st) +
        (st.adapt ? '<div class="tip"><b>Под ваш возраст:</b> ' + esc(st.adapt) + '</div>' : '') +
        (q.prof.count === 1 && g.solo ? '<div class="tip"><b>Если ребёнок один:</b> ' + esc(g.solo) + '</div>' : '') +
        '<div class="tip"><b>Когда засчитать:</b> ' + esc(g.win) + '</div>' +
        '</section>';
      bar = '<button class="btn" data-act="passed">Испытание пройдено</button>';
    } else if (pr.phase === 'clue') {
      body = say('Читайте вслух', '<p>' + esc(st.success) + '</p>') + clueHTML(st.clue, st.game.id === 'puzzle') +
        '<div class="reveal"><button data-rev="ans">Ответ для взрослого</button><div class="body hidden" id="rev-ans">' +
        (st.clue.kind === 'toddler' ? '' : 'Ответ: <b>' + esc(st.clue.answer) + '</b><br>') + 'Где лежит: ' + esc(st.nextRoomReal) + ' — ' + esc(st.clue.place) + '</div></div>';
      bar = '<button class="btn" data-act="found">Нашли ' + esc(th.fragment.one) + '!</button>';
    } else if (pr.phase === 'found') {
      const f = st.fragment;
      const big = q.prof.mode === 'letters' ? esc(f.letter) : q.prof.mode === 'symbols' ? sym(f.symbol) : '🧸';
      body = '<div class="found-card"><div class="muted small">' + esc(th.fragment.one[0].toUpperCase() + th.fragment.one.slice(1)) + ' №' + st.n + '</div><div class="big">' + big + '</div>' +
        '<p style="font-size:19px;font-weight:700;margin-top:14px">' + esc(st.found) + '</p>' +
        (q.prof.mode === 'letters' ? '<p class="muted small">Пусть дети запомнят букву или положат записку к остальным — в финале она понадобится.</p>' : q.prof.mode === 'symbols' ? '<p class="muted small">Сохраните картинку — в финале они откроют замок.</p>' : '') + '</div>';
      bar = '<button class="btn" data-act="next">' + (i + 1 >= q.N ? 'К финалу!' : 'Дальше: ' + esc(q.stages[i + 1].roomName)) + '</button>';
    } else if (pr.phase === 'lock') {
      body = say('Читайте вслух', '<p>' + esc(q.preFinale) + '</p>') + lockHTML();
      bar = '';
    } else if (pr.phase === 'treasure') {
      body = say('Читайте вслух', para(q.finale)) + clueHTML(q.treasure.clue, false, true) +
        '<div class="reveal"><button data-rev="ans">Где сокровище (для взрослого)</button><div class="body hidden" id="rev-ans">' + esc((E.room(q.treasure.spot.room) || {}).name) + ' — ' + esc(q.treasure.spot.place) + '</div></div>';
      bar = '<button class="btn" data-act="treasure">Сокровище найдено!</button>';
    } else if (pr.phase === 'done') {
      const date = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
      body = '<h1 style="text-align:center;margin:6px 0 4px">Квест пройден!</h1><p class="muted" style="text-align:center">Покажите детям их грамоты — можно сделать скриншот на память.</p>' +
        q.kids.map(k => '<div class="cert"><div class="e">' + th.emoji + '</div><div class="ct">' + esc(th.certificate.title) + '</div><div class="nm">' + esc(k.name) + '</div><div class="ti">' + esc(k.title) + '</div><div class="tx">' + esc(th.certificate.text.replace(/\{name\}/g, k.name).replace(/\{title\}/g, k.title.toLowerCase())) + '</div><div class="dt">' + date + '</div></div>').join('');
      bar = '<button class="btn" data-act="finish">Завершить</button>';
    }
    $app.innerHTML = '<div class="themed" style="' + themeVars(th) + '">' + top + '<div class="wrap stack">' + body + '</div>' + (bar ? '<div class="bar"><div class="inner">' + bar + '</div></div>' : '') + '</div>';
    document.body.style.background = th.palette.bg;
    bindPlay();
    if (pr.phase === 'lock') bindLock();
    if (pr.phase === 'done' && !pr._confetti) { pr._confetti = true; confetti(th); }
  }

  async function setPhase(phase, extra) {
    const pr = S.rec.progress;
    pr.phase = phase; Object.assign(pr, extra || {});
    await saveRec(S.rec);
    renderPlay(); window.scrollTo(0, 0);
  }

  function bindPlay() {
    const q = S.q, pr = S.rec.progress, st = q.stages[Math.min(pr.stage, q.N - 1)];
    $app.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
      const a = b.dataset.act;
      stopAudio();
      if (a === 'toStage') setPhase('stage');
      else if (a === 'passed') { haptic('success'); setPhase('clue'); }
      else if (a === 'found') { haptic('success'); pr._pop = true; setPhase('found'); }
      else if (a === 'next') { const n = pr.stage + 1; if (n >= q.N) setPhase('lock', { stage: n }); else setPhase('stage', { stage: n }); }
      else if (a === 'treasure') { haptic('success'); setPhase('done', { done: true }); }
      else if (a === 'finish') { S.rec.progress.done = true; await saveRec(S.rec); S.screen = 'overview'; render(); window.scrollTo(0, 0); }
    });
    $app.querySelectorAll('[data-rev]').forEach(b => b.onclick = () => { const el = $app.querySelector('#rev-' + b.dataset.rev); if (el) el.classList.toggle('hidden'); });
    $app.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => openTool(b.dataset.tool, st));
    $app.querySelectorAll('[data-kid]').forEach(b => b.onclick = () => kidView(b.dataset.kid === 'treasure' ? q.treasure.clue : st.clue));
    $app.querySelectorAll('.qz .opts button').forEach(b => b.onclick = () => {
      const box = b.closest('.qz'); const a = +box.dataset.a;
      box.querySelectorAll('.opts button').forEach((x, k) => { x.classList.add(k === a ? 'ok' : 'no'); x.disabled = true; });
      box.querySelector('.fact').classList.remove('hidden');
      haptic(+b.dataset.i === a ? 'success' : 'warning');
    });
  }

  /* ---------- подсказки-тайники ---------- */
  function clueHTML(c, isPuzzle, isTreasure) {
    let inner = '';
    const lbl = isTreasure ? 'Где сокровище' : (c.kind === 'toddler' ? 'Ведите малыша' : 'Подсказка для детей');
    if (c.kind === 'toddler') inner = '<div class="big-emo">' + c.emoji + '</div><div class="txt">' + esc(c.text) + '</div>';
    else if (c.kind === 'simple') inner = '<div class="txt">' + esc(c.text) + '</div>';
    else if (c.kind === 'riddle') inner = '<div class="txt">' + esc(c.text) + '</div>';
    else if (c.kind === 'anagram') inner = '<div class="txt">' + esc(c.text) + '</div><div class="letters">' + c.letters.map(l => '<span>' + esc(l) + '</span>').join('') + '</div>';
    else if (c.kind === 'cipher') {
      inner = '<div class="txt" style="font-size:18px">' + esc(c.text) + '</div><div class="code">' + esc(c.cipher.encoded) + '</div><div class="key">' + esc(c.cipher.key) + '</div>' +
        (c.cipher.alphabet ? '<div class="alpha">' + E.ALPHA.split('').map((ch, k) => '<span><b>' + ch + '</b>' + (k + 1) + '</span>').join('') + '</div>' : '');
    }
    if (isPuzzle && !isTreasure) inner = '<div class="txt">Посмотрите на собранную картинку — там и ищите!</div>' + '<div class="key" style="margin-top:10px">Не догадались? Тогда загадка:</div>' + inner;
    const acts = '<div class="clue-acts"><button class="btn sm ghost" data-kid="' + (isTreasure ? 'treasure' : 'stage') + '">Показать детям крупно</button>' +
      (c.kind !== 'toddler' ? '<button class="btn sm ghost" data-rev="hint">Подсказка</button>' : '') + '</div>' +
      (c.kind !== 'toddler' ? '<div class="reveal" style="margin-top:0"><div class="body hidden" id="rev-hint" style="background:rgba(255,255,255,.15);box-shadow:none;color:inherit">' + hintText(c) + '</div></div>' : '');
    return '<div class="clue"><div class="lbl">' + lbl + '</div>' + inner + acts + '</div>';
  }
  function hintText(c) {
    const sp = QD.spots.spots.find(s => s.id === c.spotId) || {};
    const room = (E.room(c.room) || {}).name || '';
    const parts = ['Комната: ' + room + ' ' + (c.emoji || '')];
    if (c.kind === 'cipher' && c.backup) parts.push('Загадка-подсказка: ' + c.backup);
    else if (c.kind === 'anagram' && c.backup) parts.push(c.backup);
    else if (sp.keyword) parts.push('Слово начинается на «' + sp.keyword[0] + '», в нём ' + sp.keyword.length + ' ' + P(sp.keyword.length, 'буква', 'буквы', 'букв'));
    return parts.map(esc).join('<br>');
  }
  function kidView(c) {
    const el = document.createElement('div'); el.className = 'kidview';
    let inner = '';
    if (c.kind === 'toddler') inner = '<div class="emo">' + c.emoji + '</div>';
    else if (c.kind === 'cipher') inner = '<div class="code">' + esc(c.cipher.encoded) + '</div><p style="margin-top:18px;font-size:18px">' + esc(c.cipher.key) + '</p>';
    else if (c.kind === 'anagram') inner = '<div class="code">' + esc(c.letters.join(' ')) + '</div>';
    else inner = '<div class="txt">' + esc(c.text) + '</div>';
    el.innerHTML = '<button class="close">Закрыть</button><div class="in">' + inner + '</div>';
    el.setAttribute('style', themeVars(S.q.theme)); el.classList.add('themed');
    el.onclick = () => el.remove();
    document.body.appendChild(el);
  }

  /* ---------- финальный замок ---------- */
  const LOCK = { filled: [], used: [] };
  function lockHTML() {
    const q = S.q;
    if (q.prof.mode === 'toddler') {
      LOCK.taps = 0;
      return '<div class="lock"><div class="chest" id="chest">🧰</div><p style="font-weight:800;font-size:19px">Сундук закрыт! Постучите по нему пять раз все вместе!</p><button class="btn" id="tap" style="margin-top:10px">Тук!</button></div>';
    }
    if (q.prof.mode === 'symbols') {
      LOCK.filled = []; LOCK.used = [];
      const decoys = E.sample(E.rng(q.seed + ':decoy'), E.SYMBOLS.filter(s => !q.symbols.some(x => x.id === s.id)), Math.min(3, 12 - q.N));
      LOCK.pool = E.shuffle(E.rng(q.seed + ':pool'), q.symbols.concat(decoys));
      return '<div class="lock" id="lock"><p style="font-weight:700">Положите картинки по порядку: сначала ту, что нашли первой.</p><div class="word" id="word"></div><div class="pool" id="pool"></div>' +
        '<div class="row" style="justify-content:center;margin-top:14px"><button class="btn sm ghost" id="clr">Стереть</button><button class="btn sm ghost" id="lhint">Подсказка</button></div></div>';
    }
    LOCK.filled = []; LOCK.used = [];
    const letters = q.password.hidden.map(k => q.password.word[k]);
    LOCK.pool = E.shuffle(E.rng(q.seed + ':pool'), letters.map((l, k) => ({ l, k })));
    return '<div class="lock" id="lock"><p style="font-weight:700">Расставьте найденные буквы и откройте замок!' + (q.password.word.length > q.N ? ' Серые буквы уже на месте.' : '') + '</p><div class="word" id="word"></div><div class="pool" id="pool"></div>' +
      '<div class="row" style="justify-content:center;margin-top:14px"><button class="btn sm ghost" id="clr">Стереть</button><button class="btn sm ghost" id="lhint">Подсказка</button></div></div>';
  }
  function bindLock() {
    const q = S.q;
    if (q.prof.mode === 'toddler') {
      const chest = $app.querySelector('#chest');
      $app.querySelector('#tap').onclick = () => {
        LOCK.taps++; haptic('light'); chest.classList.add('tap'); setTimeout(() => chest.classList.remove('tap'), 140);
        tone(440 + LOCK.taps * 80, .12);
        if (LOCK.taps >= 5) { chest.textContent = '🎁'; haptic('success'); fanfare(); setTimeout(() => setPhase('treasure'), 900); }
      };
      return;
    }
    const wordEl = $app.querySelector('#word'), poolEl = $app.querySelector('#pool'), lockEl = $app.querySelector('#lock');
    const isSym = q.prof.mode === 'symbols';
    const slotsN = isSym ? q.N : q.password.word.length;
    const draw = () => {
      let html = '', fi = 0;
      for (let k = 0; k < slotsN; k++) {
        if (!isSym && !q.password.hidden.includes(k)) { html += '<span class="cell fixed">' + esc(q.password.word[k]) + '</span>'; continue; }
        const v = LOCK.filled[fi];
        const isNext = fi === LOCK.filled.length;
        html += '<span class="cell ' + (v != null ? 'filled' : (isNext ? 'next' : '')) + '">' + (v != null ? (isSym ? sym(LOCK.pool[v].id) : esc(LOCK.pool[v].l)) : '') +
          '</span>';
        fi++;
      }
      wordEl.innerHTML = html;
      if (isSym) wordEl.innerHTML = wordEl.innerHTML; // без подписей
      poolEl.innerHTML = LOCK.pool.map((p, k) => '<button data-p="' + k + '" ' + (LOCK.used.includes(k) ? 'disabled' : '') + ' aria-label="' + (isSym ? p.name : p.l) + '">' + (isSym ? sym(p.id) : esc(p.l)) + '</button>').join('');
      poolEl.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
        const k = +b.dataset.p; LOCK.filled.push(k); LOCK.used.push(k); haptic('light'); tone(520 + LOCK.filled.length * 40, .07);
        draw(); check();
      });
    };
    const need = isSym ? q.N : q.password.hidden.length;
    const check = () => {
      if (LOCK.filled.length < need) return;
      let ok;
      if (isSym) ok = LOCK.filled.every((v, k) => LOCK.pool[v].id === q.symbols[k].id);
      else {
        const arr = q.password.word.split('');
        let fi = 0; q.password.hidden.forEach(k => { arr[k] = LOCK.pool[LOCK.filled[fi++]].l; });
        ok = arr.join('') === q.password.word;
      }
      if (ok) {
        haptic('success'); fanfare();
        lockEl.insertAdjacentHTML('beforeend', '<p style="font-family:var(--font-d);font-size:22px;margin-top:16px;color:var(--t-accent2)">Замок открыт!</p>');
        setTimeout(() => setPhase('treasure'), 1300);
      } else {
        haptic('error'); tone(180, .3);
        lockEl.classList.add('shake'); setTimeout(() => { lockEl.classList.remove('shake'); LOCK.filled = []; LOCK.used = []; draw(); }, 600);
        toast('Не подходит — попробуйте ещё раз');
      }
    };
    $app.querySelector('#clr').onclick = () => { LOCK.filled.pop(); LOCK.used.pop(); draw(); };
    $app.querySelector('#lhint').onclick = () => {
      // ставит следующую правильную букву/картинку
      const pos = LOCK.filled.length;
      let target;
      if (isSym) target = q.symbols[pos] && q.symbols[pos].id;
      else target = q.password.word[q.password.hidden[pos]];
      const k = LOCK.pool.findIndex((p, idx) => !LOCK.used.includes(idx) && (isSym ? p.id === target : p.l === target));
      if (k >= 0) { LOCK.filled.push(k); LOCK.used.push(k); draw(); check(); }
    };
    draw();
  }

  /* косой козёл: склонение */
  function numWords(n) {
    const u = ['', 'один', 'два', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять'];
    const t1 = ['десять', 'одиннадцать', 'двенадцать', 'тринадцать', 'четырнадцать', 'пятнадцать', 'шестнадцать', 'семнадцать', 'восемнадцать', 'девятнадцать'];
    const t = ['', '', 'двадцать', 'тридцать', 'сорок', 'пятьдесят', 'шестьдесят', 'семьдесят', 'восемьдесят', 'девяносто'];
    const h = ['', 'сто', 'двести', 'триста', 'четыреста', 'пятьсот', 'шестьсот', 'семьсот', 'восемьсот', 'девятьсот'];
    const out = [];
    out.push(h[Math.floor(n / 100)]);
    const r = n % 100;
    if (r >= 10 && r < 20) out.push(t1[r - 10]); else { out.push(t[Math.floor(r / 10)]); out.push(u[r % 10]); }
    return out.filter(Boolean).join(' ');
  }
  function kozel(n, hard) {
    const m10 = n % 10, m100 = n % 100;
    const adj = hard ? ' бородат' : '';
    let tail;
    if (m10 === 1 && m100 !== 11) tail = 'косой' + (hard ? ' бородатый' : '') + ' козёл';
    else if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) tail = 'косых' + (adj ? adj + 'ых' : '') + ' козла';
    else tail = 'косых' + (adj ? adj + 'ых' : '') + ' козлов';
    return numWords(n) + ' ' + tail;
  }

  /* ---------- звук (WebAudio, без файлов) ---------- */
  const AUD = { ctx: null, playing: false, timers: [] };
  function unlockAudio() { try { if (!AUD.ctx) AUD.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (AUD.ctx.state === 'suspended') AUD.ctx.resume(); } catch (e) {} }
  function tone(f, d, when, type) {
    try {
      unlockAudio(); const ctx = AUD.ctx; if (!ctx) return;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || 'triangle'; o.frequency.value = f;
      const t0 = ctx.currentTime + (when || 0);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0 + d + 0.02);
    } catch (e) {}
  }
  function fanfare() { [523, 659, 784, 1047].forEach((f, k) => tone(f, .25, k * .12)); }
  function playMelody(seconds, onStop) {
    unlockAudio(); AUD.playing = true;
    const scale = [392, 440, 523, 587, 659, 784, 880];
    const step = 0.2; let tt = 0, k = 0;
    const loop = () => {
      if (!AUD.playing) return;
      const f = scale[(k * 3 + (k % 4 === 0 ? 2 : 0)) % scale.length]; tone(f, .18, 0, 'square'); if (k % 2 === 0) tone(f / 2, .18, 0, 'triangle');
      k++; tt += step;
      if (tt >= seconds) { AUD.playing = false; tone(196, .5, 0.05, 'sawtooth'); onStop && onStop(); return; }
      AUD.timers.push(setTimeout(loop, step * 1000));
    };
    loop();
  }
  function stopAudio() { AUD.playing = false; AUD.timers.forEach(clearTimeout); AUD.timers = []; }

  /* ---------- экран не гаснет во время игры ---------- */
  let wake = null;
  async function requestWake() { try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {} }
  function releaseWake() { try { if (wake) { wake.release(); wake = null; } } catch (e) {} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.screen === 'play') requestWake(); });

  /* ---------- конфетти ---------- */
  function confetti(th) {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cv = document.createElement('canvas'); cv.className = 'confetti'; document.body.appendChild(cv);
    const dpr = window.devicePixelRatio || 1; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
    const cols = [th.palette.accent, th.palette.accent2, th.palette.ink, '#FFD23F'];
    const ps = Array.from({ length: 140 }, () => ({ x: innerWidth / 2, y: innerHeight / 3, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, s: 5 + Math.random() * 7, c: cols[Math.floor(Math.random() * cols.length)], r: Math.random() * 6, vr: (Math.random() - .5) * .4 }));
    let f = 0;
    const loop = () => {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ps.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
      if (++f < 160) requestAnimationFrame(loop); else cv.remove();
    };
    loop(); fanfare();
  }

  /* ---------- старт ---------- */
  window.__KQ = { S, Store, render, go };
  // ссылка вида ?startapp / start_param — пока не используется, но можно открыть квест по id
  render();
})();
