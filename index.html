а","Золотая речка, янтарные берега","Молочная речка, кисельные берега"],"a":3,"fact":"Ещё сестрице помогли печка с ржаным пирожком и яблонька с лесным яблочком."},{"q":"Что сделал Иван-царевич с лягушачьей кожей Василисы?","options":["Спрятал в сундук","Бросил в реку","Закопал в саду","Сжёг в печи"],"a":3,"fact":"Из-за этого Василисе пришлось улететь, и Иван отправился её искать."}]},"danetki":[{"band":"b6","story":"На улице лил сильный дождь. Ваня пришёл в гости к Пете без зонта и без капюшона, а сам был совершенно сухой.","answer":"Ваня и Петя живут в одном доме — Ваня просто спустился по лестнице в соседнюю квартиру.","hints":["Ваня совсем не выходил на улицу.","Ваня и Петя — соседи."]},{"band":"b6","story":"По пустой загородной дороге ехала машина с выключенными фарами. Фонари вдоль дороги не горели, луны на небе не было. Чёрная кошка выбежала на дорогу, но водитель сразу её заметил и остановился.","answer":"Был ясный день — светило солнце, поэтому ни фары, ни фонари, ни луна были не нужны.","hints":["Подумайте, правда ли было темно, когда выбежала кошка.","Солнце помогло водителю."]},{"band":"b6","story":"Маша отпустила воздушный шарик на улице. Ветра не было, шарик не лопнул, но он не полетел вверх, а упал на землю.","answer":"Маша надула шарик сама, ртом. В нём обычный воздух, а не лёгкий гелий, поэтому шарик опустился вниз.","hints":["Важно, чем был надут шарик.","Шарики из магазина летают, потому что в них особый газ."]},{"band":"b6","story":"Дети с бабушкой весь вечер что-то лепили, а потом съели всё, что слепили, — и все были довольны.","answer":"Они лепили пельмени (или вареники), сварили их и съели за ужином.","hints":["Лепили не из пластилина и не из снега.","Это происходило на кухне."]},{"band":"b6","story":"Вечером окно в комнате было чистым. Утром на нём появились красивые белые узоры, хотя в комнату никто не заходил и никто не рисовал.","answer":"Ночью ударил мороз — и на стекле появились морозные узоры.","hints":["Узоры нарисовала не рука человека.","На улице было очень холодно."]},{"band":"b6","story":"Котёнок прыгнул в ванну и вылез оттуда совершенно сухим, хотя его никто не вытирал.","answer":"В ванне не было воды — она была пустая.","hints":["Котёнок не намок, потому что намокать было не от чего.","Посмотрите, что было в ванне."]},{"band":"b6","story":"Петя бросил мяч, и мяч сам вернулся к нему в руки. Мяч ни обо что не ударился, никто его не ловил и не бросал обратно, верёвки на нём не было.","answer":"Петя подбросил мяч вверх — и мяч упал обратно ему в руки.","hints":["Важно, в какую сторону Петя бросил мяч.","Мяч бросили не вперёд и не в стену."]},{"band":"b6","story":"В солнечный день за Олей весь день ходила тёмная спутница. Оля бегала, прыгала, пряталась — она не отставала. А вечером, когда стемнело, спутница исчезла.","answer":"Это была Олина тень.","hints":["Спутница — не человек и не животное.","Без солнца её не бывает."]},{"band":"b6","story":"Утром во дворе стоял белый друг ребят. Днём на его месте остались только морковка, ведро, два уголька и лужа. Никто его не трогал.","answer":"Это был снеговик — днём пригрело солнце, и он растаял.","hints":["Белый друг был сделан из снега.","В тот день стало тепло."]},{"band":"b6","story":"Таня бросила камень в реку, но камень не утонул, а остался лежать сверху.","answer":"Была зима, и река замёрзла — камень упал на лёд.","hints":["Важно, какое было время года.","Вода в реке была твёрдой."]},{"band":"b10","story":"Мальчик живёт на десятом этаже. Утром он едет на лифте до первого этажа. Вечером доезжает на лифте только до седьмого и дальше идёт пешком. Но в дождливые дни он едет сразу до десятого.","answer":"Мальчик невысокий и не дотягивается до кнопки «10» — только до «7». В дождь у него с собой зонтик, им он и нажимает нужную кнопку.","hints":["Дело в кнопках лифта.","В дождливый день у мальчика в руках есть то, чего нет в другие дни."]},{"band":"b10","story":"Дедушке Пети исполнилось 64 года, но настоящий день рождения — в свою дату — он праздновал всего 16 раз.","answer":"Дедушка родился 29 февраля, а такой день бывает только раз в четыре года — в високосный год.","hints":["Дело в дате рождения дедушки.","Есть день, который бывает не каждый год."]},{"band":"b10","story":"Два мальчика родились у одной мамы в один и тот же день одного года. Они очень похожи, но они не близнецы.","answer":"Они тройняшки — у них есть ещё брат или сестра, родившиеся в тот же день.","hints":["Мальчики — не единственные дети, родившиеся в тот день.","Близнецов двое, а здесь детей больше."]},{"band":"b10","story":"Две мамы и две дочки взяли три апельсина, и каждой досталось по целому апельсину. Никто не делил апельсины на части.","answer":"Их было трое: бабушка, мама и дочка. Мама — одновременно и мама, и дочка.","hints":["Людей было меньше, чем кажется.","Кто-то может быть сразу и мамой, и дочкой."]},{"band":"b10","story":"Аня и Катя сыграли в шахматы по пять партий. Каждая выиграла три партии, ничьих не было.","answer":"Они играли не друг с другом, а с другими соперниками.","hints":["Подумайте, с кем они играли.","Девочки не были соперницами."]},{"band":"b10","story":"Саша весь вечер читал интересную книгу в полной темноте, без лампы, фонарика и телефона.","answer":"Саша незрячий и читал книгу, напечатанную шрифтом Брайля, — буквы в ней из выпуклых точек, их читают пальцами.","hints":["Саше не нужен свет, чтобы читать.","Эту книгу читают не глазами."]},{"band":"b10","story":"В июле Маша вышла на улицу и слепила снеговика, а вечером каталась на санках. Она не была ни в горах, ни на Северном полюсе.","answer":"Маша была в Южном полушарии — например, на самом юге Аргентины или Чили. Там июль — зимний месяц.","hints":["Маша была далеко от дома.","На другой половине Земли времена года наоборот."]},{"band":"b10","story":"Дедушка гулял под сильным дождём без шапки и зонта. Вся одежда промокла насквозь, а ни один волосок на голове не намок.","answer":"Дедушка лысый — волос на голове у него нет.","hints":["Дело не в шапке и не в капюшоне.","Волоски не намокли, потому что их нет."]},{"band":"b10","story":"Коля сказал: «Позавчера мне было 10 лет, а в следующем году мне исполнится 13». И он сказал правду.","answer":"Коля говорил это 1 января, а родился 31 декабря. 30 декабря ему было 10, 31-го стало 11, в этом году исполнится 12, а в следующем — 13.","hints":["Важно, в какой день Коля это сказал.","День рождения Коли — в самом конце года."]},{"band":"b10","story":"Петя целую неделю совсем не спал днём, но ни капельки не устал и чувствовал себя отлично.","answer":"Петя спал ночью, как обычно.","hints":["Обратите внимание на слово «днём».","Петя высыпался."]}],"tongue_twisters":{"b3":["Шла Саша по шоссе и сосала сушку.","Мама мыла Милу мылом.","Саша шапкой шишку сшиб.","У ежа ежата, у ужа ужата.","Шесть мышат в шалаше шуршат.","Осип охрип, Архип осип.","Шапка да шубка — вот и весь Мишутка.","Около кола колокола.","Бобр добр для бобрят.","Белые бараны били в барабаны."],"b6":["На дворе трава, на траве дрова. Не руби дрова на траве двора.","Ехал Грека через реку, видит Грека — в реке рак. Сунул Грека руку в реку, рак за руку Греку цап!","От топота копыт пыль по полю летит.","Ткёт ткач ткани на платки Тане.","Два щенка, щека к щеке, щиплют щётку в уголке.","Кукушка кукушонку купила капюшон. Надел кукушонок капюшон. Как в капюшоне он смешон!","Хохлатые хохотушки хохотом хохотали: ха-ха-ха-ха-ха!","Жужжит жужелица, жужжит, да не кружится.","Еле-еле Лена ела, есть из лени не хотела.","Носит Сеня в сени сено, спать на сене будет Сеня.","Три сороки-тараторки тараторили на горке.","Сыворотка из-под простокваши.","Шёл Егор через двор, нёс топор чинить забор.","У Сени и Сани в сетях сом с усами.","Съел молодец тридцать три пирога с пирогом, да все с творогом."],"b10":["Корабли лавировали, лавировали, да не вылавировали.","Сшит колпак не по-колпаковски, вылит колокол не по-колоколовски. Надо колпак переколпаковать да перевыколпаковать, надо колокол переколоколовать да перевыколоколовать.","Протокол про протокол протоколом запротоколировали.","Бык тупогуб, тупогубенький бычок, у быка бела губа была тупа.","Рапортовал, да не дорапортовал, а стал дорапортовывать — зарапортовался.","Мокрая погода размокропогодилась.","Тщетно тщится щука ущемить леща.","Шли сорок мышей, несли сорок грошей; две мыши поплоше несли по два гроша.","Говорил попугай попугаю: «Я тебя, попугай, попугаю». Отвечает ему попугай: «Попугай, попугай, попугай!»","Вёз корабль карамель, наскочил корабль на мель. И матросы две недели карамель на мели ели.","Расскажите про покупки! — Про какие про покупки? — Про покупки, про покупки, про покупочки мои.","Везёт Сенька Саньку с Сонькой на санках. Санки скок, Сеньку с ног, Соньку в бок, Саньку в лоб, все в сугроб.","Купи кипу пик.","Наш Полкан из Байкала лакал. Лакал Полкан, лакал, да не мелел Байкал.","У четырёх черепах по четыре черепашонка."]},"praise":["Вот это командная работа!","Ух ты, справились на отлично!","Вы настоящая команда героев!","Блестяще! Так держать!","Ничего себе! Вот это скорость!","Вы просто молодцы — все до одного!","Задание выполнено! Браво, команда!","Какие вы внимательные — ничего не упустили!","Вот это смекалка!","Здорово придумали! Мне бы и в голову не пришло!","Вместе вы — сила!","Ура! Ещё одна победа!","Высший класс!","Вы справились даже лучше, чем я ожидал!","Отличная работа! Можно выдавать медали!","Вот это смелость и находчивость!","Даже самый хитрый злодей такого не ожидал!","Восторг! Вы — лучшая команда на свете!","Красиво сработали — как настоящие профессионалы!","Вот это да! Аплодисменты команде!"]},"banksB":{"draw":[{"band":"b3","text":"Это Пузырик. Он круглый, как мячик. У него два больших глаза и улыбка до ушей. Вместо ног — четыре маленьких колёсика. На макушке растёт один цветочек."},{"band":"b3","text":"Это кот Облачко. Он пушистый и белый, как облако. У него очень длинный хвост, закрученный колечком. На голове — шапочка с помпоном. А в лапе он держит воздушный шарик."},{"band":"b3","text":"Это домик-черепаха. Вместо панциря у неё на спине маленький домик с окошком. Из трубы идёт дымок. У черепахи четыре толстые лапки. А глазки у неё весёлые и большие."},{"band":"b3","text":"Это рыбка Звёздочка. Она плавает не в воде, а в небе. У неё хвост в полосочку. На боках — круглые пятнышки. А над головой светит маленькая звёздочка."},{"band":"b3","text":"Это Улыбашка-солнышко. Оно жёлтое и круглое. У него вместо лучиков — длинные ручки, и оно всем машет. На носу — очки. А под солнышком — тучка-подушка, на которой оно лежит."},{"band":"b3","text":"Это зайка-машинка. Она похожа на машинку, но у неё длинные заячьи уши. Вместо фар — два больших глаза. Колёса у неё — морковки. На крыше сидит бабочка."},{"band":"b3","text":"Это дракончик Чих. Он маленький и зелёный. У него на спине — три треугольничка. Крылышки как у бабочки. Когда он чихает, из носа вылетают пузыри."},{"band":"b3","text":"Это волшебный цветок. У него пять лепестков, и каждый — своего цвета. В серединке цветка — весёлая рожица. Листики у него похожи на ладошки. А вокруг летают две пчёлки."},{"band":"b6","text":"Это Трёхглазик. У него три глаза на длинных ножках, как у улитки. Тело — как груша. Хвост — как у рыбы. Ног у него шесть, и все в разноцветных носках. На голове — корона из ложек."},{"band":"b6","text":"Это Летучий Чайник. У него есть носик, крышка и ручка, как у обычного чайника. Но сбоку растут два больших крыла. Внизу — птичьи лапки. Из носика идёт пар в форме сердечек. На боку нарисован якорь."},{"band":"b6","text":"Это Ёж-Библиотекарь. Вместо иголок у него на спине торчат карандаши. На носу — круглые очки. Он стоит на двух лапах и держит стопку книг. На шее — галстук-бабочка в горошек. А за ухом у него спрятан ластик."},{"band":"b6","text":"Это Облачный Кит. Он огромный и плывёт по небу. Из спины у него вместо фонтана растёт дерево с яблоками. Глаза у него квадратные. На хвосте висят качели, и на них катается мышка. А на боку — окошки, как у автобуса."},{"band":"b6","text":"Это Робот-Пирожок. Тело у него как пирожок с защипами. Руки — пружинки. Ноги — две вилки. На голове антенна с лампочкой. А на животе — кнопка с надписью «Ням»."},{"band":"b6","text":"Это Жираф-Светофор. У него очень длинная шея. На шее сверху вниз три круга: красный, жёлтый, зелёный. Пятна на нём в форме звёздочек. На ногах — роликовые коньки. В зубах — свисток."},{"band":"b6","text":"Это Снеговик-Путешественник. Он из трёх снежных шаров. На голове — панама, а не ведро. На спине — рюкзак, из которого торчит карта. Вместо носа — банан. А в руке — чемодан на колёсиках."},{"band":"b6","text":"Это Сова-Будильник. Она круглая, как часы. Глаза у неё — циферблаты со стрелками. Крылья — как два колокольчика. Она сидит на подушке. А из ушей у неё торчат кисточки, как у рыси."},{"band":"b10","text":"Это Квадрозавр. Его тело — квадрат, поставленный на угол, как ромб. Из верхнего угла растёт длинная шея с головой утки. На левом боку — четыре плавника, на правом — ни одного. Внизу две ноги-пружины разной длины. Хвост — молния из трёх зигзагов. На шее — шарф, свисающий до земли."},{"band":"b10","text":"Это Башня-Осьминог. Внизу — круглая голова осьминога с одним огромным глазом посередине. Из головы вверх, а не вниз, растут восемь щупалец. На каждом втором щупальце — по окну с занавеской. На самом высоком щупальце — флаг с рыбьим скелетом. Справа к башне приставлена лестница из макарон. У основания стоит почтовый ящик."},{"band":"b10","text":"Это Велосипедный Дракон. У него вместо передних лап — колесо, а задние лапы крутят педали. Крылья сделаны из двух зонтиков: один в клетку, другой в полоску. На спине — седло и корзинка с булками. Из ноздрей вылетают ноты. Хвост закручен в спираль ровно три раза. На лбу у него — фара."},{"band":"b10","text":"Это Кактус-Космонавт. Он стоит в цветочном горшке, к которому приделаны три ракетных сопла. На голове — прозрачный шлем-аквариум, внутри плавает рыбка. Колючки у него только с правой стороны. В левой руке — флаг, в правой — лейка. Над ним висят две луны: большая и маленькая."},{"band":"b10","text":"Это Библиотечный Слон. Уши у него — две раскрытые книги. Хобот закручен в вопросительный знак. На спине — стеллаж с пятью полками, на каждой по одной книге. Ноги у него в тапочках с помпонами. Вместо хвоста — закладка с кисточкой. Под ним — коврик в виде шахматной доски."},{"band":"b10","text":"Это Часовой Паук. Тело у него — круглые часы, стрелки показывают ровно три. Ног восемь: четыре в сапогах, четыре босые, чередуются через одну. Глаз шесть, они расположены треугольником. Над часами — шляпа-цилиндр. Паутина под ним в форме нотного стана. На одной из нитей висит ключ."},{"band":"b10","text":"Это Дом-Улитка. Вместо раковины у улитки — двухэтажный дом с треугольной крышей. На первом этаже два окна, на втором — одно круглое. Из трубы растёт подсолнух. У улитки рожки, на концах которых фонарики. Позади неё тянется дорожка из следов-сердечек. Перед дверью — коврик с надписью «Медленно»."},{"band":"b10","text":"Это Морской Конь-Почтальон. Он держится вертикально, как морской конёк, но у него грива как у лошади. На боку — сумка с тремя конвертами. На голове — фуражка с якорем. Хвост закручен вокруг подзорной трубы. Вокруг плавают пять пузырей, в самом большом — марка. Под ним — песок и одна ракушка-звезда."}],"chepuha":{"how":"Каждый игрок берёт лист бумаги, пишет ответ на первый вопрос, загибает лист так, чтобы написанное не было видно, и передаёт соседу справа. Сосед отвечает на следующий вопрос, снова загибает и передаёт дальше — так до последнего вопроса. Потом листы разворачивают и по очереди читают вслух получившиеся истории целиком: «Кто? С кем? Где?..». С дошколятами играем устно: ведущий задаёт вопрос по очереди каждому ребёнку, запоминает ответы и в конце торжественно рассказывает всю историю.","questions":["Кто?","С кем?","Где?","Когда?","Что делали?","Что им сказали?","Чем всё закончилось?"],"example":"Бабушкин кот в шляпе вместе с пожарной машиной в ванне с пеной в первый день лета учились танцевать вальс. Им сказали: «Не забудьте почистить зубы!» И в итоге все уснули под пледом, обнявшись."},"repeat":{"b1":["Похлопай в ладоши","Покажи, как прыгает зайка","Помаши ручкой","Потопай ножками","Покажи носик","Покажи ушки","Покажи, как мишка топает","Покажи, как птичка машет крылышками","Подними ручки высоко-высоко","Обними себя крепко","Покажи, какой ты большой","Присядь, как маленький грибок","Покачай головой: нет-нет","Покажи, как рыбка открывает ротик","Покружись медленно на месте"],"b3":["Похлопай три раза","Потопай, как слон","Пройди на носочках, как мышка","Покажи, как лягушка прыгает","Помаши руками, как мельница","Достань руками до пола","Постой на одной ножке и сосчитай до трёх","Покажи, как кошка умывается","Сделай страшную рожицу, а потом улыбнись","Похлопай по коленкам","Покажи, как змейка ползёт по полу","Помаши хвостиком, как собачка","Сделай руками домик над головой","Покажи, как едет паровоз: чух-чух","Потянись к солнышку на носочках","Покажи, как растёт цветочек: из комочка — вверх","Похлопай в ладоши за спиной","Покажи, как пингвин ходит вперевалочку","Дотронься до носа, потом до ушка","Замри, как снеговик, на пять секунд"],"b6":["Хлопни два раза, топни один","Хлопни, топни, хлопни","Дотронься правой рукой до левого уха","Постой на левой ноге, пока сосчитаешь до пяти","Хлопни столько раз, сколько тебе лет","Хлопни по коленкам, потом в ладоши, потом по плечам","Похлопай ровно 7 раз и замри","Сделай три шага вперёд и два назад","Покажи пальцами число 8","Хлопни в ладоши над головой, потом за спиной","Повернись вокруг себя и хлопни","Дотронься локтем до противоположной коленки","Подпрыгни на месте два раза и присядь","Хлопни один раз, потом два, потом три","Нарисуй в воздухе носом цифру 5","Изобрази робота: три шага, поворот, стоп","Хлопни, щёлкни пальцами, хлопни, щёлкни","Постой на носочках и досчитай до десяти","Покажи левой рукой «класс», а правой — «окей»","Сосчитай вслух до пяти, хлопая на каждой цифре"]},"word_tasks":{"b6":["Назовите по очереди 8 животных без повторов","Назовите по очереди 6 фруктов или овощей — никто не повторяется","Назовите 5 предметов в этой комнате, которые начинаются на букву С","Цепочка слов: каждое следующее слово начинается на последнюю букву предыдущего. Сделайте цепочку из 6 слов","Придумайте вместе слово из 4 букв на букву К","Придумайте рифмы к слову «кот» — нужно минимум 4","Назовите противоположности: большой, весёлый, горячий, день, высокий","Назовите по очереди 6 вещей, которые бывают красными","Назовите 5 сказочных героев, у которых есть хвост","Назовите по очереди 7 предметов, которые есть на кухне","Придумайте вместе 3 слова, которые начинаются на последнюю букву вашего имени","Назовите 5 животных, которые живут в воде","Придумайте рифму к словам «мишка», «ложка» и «дом»","Назовите по очереди 6 профессий без повторов","Назовите 5 вещей, которые бывают круглыми","Назовите противоположности: сухой, громкий, быстрый, утро, открыть","Назовите по очереди 6 вещей, которые можно надеть","Придумайте вместе слово из 5 букв на букву М","Назовите 5 птиц без повторов","Составьте вместе предложение, где все слова начинаются на одну букву, например «Петя пьёт персиковый…»"],"b10":["Назовите по очереди 10 городов, каждый следующий — на последнюю букву предыдущего","Назовите 8 стран без повторов за минуту","Придумайте вместе слово из 6 букв на букву П","Назовите по очереди 10 животных в алфавитном порядке: А, Б, В…","Подберите антонимы: смелый, щедрый, тяжёлый, вход, мелкий, начало, вверх","Придумайте 5 рифм к слову «квест»","Составьте из букв слова «ПРИКЛЮЧЕНИЕ» как можно больше слов за 2 минуты — нужно минимум 6","Цепочка слов из 10 звеньев, каждое на последнюю букву предыдущего, только существительные","Назовите по очереди 8 слов, которые начинаются и заканчиваются на одну и ту же букву","Придумайте вместе четверостишие, которое заканчивается словом «пароль»","Назовите по очереди 8 рек или морей без повторов","Назовите 7 слов, в которых есть буква Ё","Придумайте вместе слово-перевёртыш, которое читается одинаково с обеих сторон (например, «шалаш»), — найдите ещё 3 таких","Назовите по очереди 10 предметов, которые есть в школьном рюкзаке, без повторов","Подберите к слову «идти» 6 синонимов","Придумайте 5 слов из трёх слогов на букву Т","Назовите 8 видов спорта по очереди — кто повторит, тот помогает следующему","Расскажите вместе историю по одному предложению: каждое следующее начинается на следующую букву алфавита, от А до Ж","Найдите 3 слова, которые прячутся внутри слова «КАРАНДАШ» (например, «кара»)","Назовите по очереди 10 существительных на букву С, все из разных тем: еда, животные, транспорт, одежда…"]},"sort_tasks":[{"band":"b1","task":"Разложите мягкие игрушки и мячики по двум коробкам: в одну — всё мягкое, в другую — всё, что катится."},{"band":"b1","task":"Соберите все красные вещи из кучки на один коврик, а все остальные — на другой. Подойдут крупные кубики, мячи, подушки и машинки."},{"band":"b1","task":"Разложите носки большие (папины) и маленькие (детские) в две корзинки: большие к большим, маленькие к маленьким."},{"band":"b1","task":"Поставьте пластиковые миски и чашки по размеру: большую — к большой, маленькую — к маленькой, и найдите каждой чашке «маму»-миску."},{"band":"b3","task":"Разложите кубики, ленточки и фломастеры по цветам: красное к красному, синее к синему, жёлтое к жёлтому. Ведущий заранее смешивает всё в одну кучку."},{"band":"b3","task":"Из корзинки с яблоком, бананом, ложкой, кубиком, морковкой и машинкой отберите на тарелку только то, что можно съесть, а несъедобное — в коробку."},{"band":"b3","task":"Разложите предметы на мягкое и твёрдое: мягкая игрушка, носок, подушечка, кубик, пластиковая ложка, книжка. Мягкое — на подушку, твёрдое — на стул."},{"band":"b3","task":"Разберите кучку на круглое и не круглое: мячик, крышка, тарелка, кубик, книжка, апельсин. Круглое — в одну миску, всё остальное — в другую."},{"band":"b6","task":"Разложите крупу, макароны и фасоль, перемешанные в миске, по трём чашкам. На время — за 3 минуты, и проверим, не затерялась ли фасолинка."},{"band":"b6","task":"Разложите пуговицы (или детали конструктора) сначала по цвету, а потом каждую цветную кучку — по размеру от самой маленькой до самой большой."},{"band":"b6","task":"Разделите предметы на три группы: что тонет в воде, что плавает, и что «не знаем — проверим потом». Подойдут ложка, пробка, губка, ластик, монетка, пластиковая крышка."},{"band":"b6","task":"Разложите столовые приборы и кухонные мелочи по назначению: «чтобы есть», «чтобы готовить», «чтобы убирать». Без ножей — только ложки, лопатки, губки, прищепки, салфетки."}],"magicbag":{"b1":["Мягкий мячик","Плюшевый мишка","Детская пластиковая миска","Деревянная ложка для готовки","Варежка","Картонная детская книжка","Тапочек","Вязаная шапка","Пустая закрытая пластиковая бутылка","Пластиковая кружка","Большой кубик от конструктора","Резиновая игрушка для ванны","Сложенное полотенце","Детский носок, свёрнутый клубком","Маленькая подушка-думка"],"b3":["Яблоко","Банан","Мандарин","Картофелина","Расчёска","Мочалка","Кубик","Игрушечная машинка","Пластиковый стаканчик","Чайная ложка","Деревянная прищепка","Варежка","Шишка","Резиновый мячик","Фигурка животного","Губка для посуды","Шарф","Детская книжка","Носок","Пластиковая крышка от кастрюли"],"b6":["Лимон (а рядом — мандарин, чтобы было сложнее)","Луковица","Огурец","Ластик","Крышка от бутылки","Катушка ниток","Резинка для волос","Большая пуговица","Ключ","Колпачок от фломастера","Новая зубная щётка в упаковке","Кусочек мыла","Чайный пакетик","Скомканный шарик из фольги","Макароны-ракушки в пакетике","Теннисный мячик","Ракушка","Деталь конструктора","Тканевая перчатка","Десертная ложка и чайная ложка — угадать, какая больше"]},"imaginarium":["Самое смешное утро","Тишина","Запах лета","Секрет","Первый снег","Обида, которая прошла","Дорога домой","Самый вкусный день","Сон, который хочется досмотреть","Друг","Немножко страшно","Праздник","Невидимка","Любимая песня","Каникулы","Новое начало","Мечта","Бабушкины пирожки","Шум дождя","Смелость","Чудо","Перепутанный день","Объятие","Скука","Что-то потерялось","Самый длинный день","Тайное место","Гордость","Утро понедельника","Сюрприз"],"kozel":{"rules":"Играем по кругу: игрок нажимает кнопку, приложение показывает число от 1 до 13, и нужно быстро и чётко произнести фразу из таблицы. Сбился, запнулся или сказал фразу от другого числа — получаешь «смешинку» (ставим себе галочку), но никто не смеётся над ошибкой, смеёмся вместе. Когда выпадает 1, все хлопают ладонью по столу, а тот, кто хлопнул последним, говорит «Косой козёл с котомкой» три раза подряд. Для разминки первые два круга таблицу можно подглядывать. Побеждает тот, у кого меньше всего «смешинок», а самый смешливый получает титул «Главный козлик-болтунишка».","table":["1 (Туз) — «Косой козёл с котомкой»","2 — «Два дрозда дружно дразнились»","3 — «Три трубача трубили тревогу»","4 — «Четыре черепахи чинно чай пили»","5 — «Пять пингвинов пляшут польку»","6 — «Шесть шустрых шмелей шуршат»","7 — «Семь сов спят на сосне»","8 — «Восемь весёлых ворон в вёдрах»","9 — «Девять дятлов долбят дуб»","10 — «Десять добрых дельфинов»","11 (Валет) — «Валет варит вареники»","12 (Дама) — «Дама дует в дудочку»","13 (Король) — «Король кормит косого козла капустой»"]},"mafia":{"roles":[{"name":"Жители","count":"все остальные","desc":"Добрые жители волшебной деревни. Днём они обсуждают, кто мог быть ночным колдуном, и голосуют, кого «расколдовать». Их задача — найти колдуна, пока он не усыпил всю деревню."},{"name":"Ночная колдунья/колдун","count":"1 на 5–7 игроков","desc":"Тайный озорник. Ночью, когда все «спят» с закрытыми глазами, показывает ведущему на одного игрока — тот заколдован волшебным сном. Днём притворяется обычным жителем и старается, чтобы его не узнали."},{"name":"Доктор-волшебник","count":"1","desc":"Ночью показывает ведущему на одного игрока, которого он защищает волшебным зонтиком. Если колдун выбрал того же игрока, сон не действует и утром все просыпаются. Себя можно защищать не два раза подряд."},{"name":"Сыщик","count":"1","desc":"Ночью показывает на одного игрока, и ведущий молча кивает «да» или качает головой «нет» — колдун это или нет. Днём сыщик может намекнуть деревне, но так, чтобы колдун его не раскусил."}],"rules":["Ведущий раздаёт роли тайно: шепчет на ушко или показывает записку с картинкой (луна — колдун, крестик — доктор, лупа — сыщик, домик — житель).","«Деревня засыпает»: все закрывают глаза. Ведущий по очереди будит колдуна, доктора и сыщика — каждый молча показывает на игрока, а потом снова «засыпает».","«Деревня просыпается»: ведущий рассказывает, что случилось ночью. Если колдун заколдовал кого-то, а доктор его не спас, этот игрок «уснул волшебным сном» и выходит из игры.","Выбывший не скучает: он становится помощником ведущего — помогает следить за глазами, подсказывает, кто когда просыпается, и знает все тайны.","Днём все обсуждают по 2 минуты (таймер в приложении), кто похож на колдуна, и голосуют поднятой рукой. Тот, за кого больше голосов, открывает свою роль и становится помощником ведущего.","Ночи и дни чередуются. Жители побеждают, когда «расколдовали» колдуна; колдун — если жителей и колдунов осталось поровну.","В финале колдун снимает чары: все встают в круг и дружно говорят волшебное слово, а ведущий объявляет, кто какую роль играл."]},"detective_cases":[{"band":"b6","title":"Дело о пропавшем печенье","story":"Сегодня утром на столе стояла ваза с шоколадным печеньем. А после обеда ваза оказалась пустой! Ни одной печенюшки, только крошки. Все игрушки в доме говорят, что ничего не брали. Но кто-то же съел печенье! У нас три подозреваемых. Каждый рассказал, где был. Найдите четыре записки-улики, внимательно их прочитайте и подумайте: кто говорит правду, а кто немножко сочиняет?","suspects":[{"name":"Плюшевый медведь Бублик","desc":"Большой коричневый медведь, говорит, что весь день проспал на полке в детской и никуда не слезал."},{"name":"Резиновый утёнок Кряк","desc":"Жёлтый утёнок из ванной, говорит, что всё утро плескался в тазике с водой."},{"name":"Кукла Ромашка","desc":"Кукла с розовым бантиком, говорит, что весь день рисовала в альбоме в гостиной."}],"clues":[{"text":"Возле вазы лежит тоненькая розовая ниточка, как от бантика.","where":"рядом с местом преступления"},{"text":"Около вазы нет ни одной капельки воды: мокрый гость здесь не ходил.","where":"рядом с местом преступления"},{"text":"Пыль на полке ровная-ровная: медведь и правда никуда не слезал.","where":"у подозреваемого «Плюшевый медведь Бублик»"},{"text":"В альбоме нет ни одного нового рисунка, зато между страницами — крошки печенья.","where":"у подозреваемого «Кукла Ромашка»"}],"solution":"2","explain":"Утёнок был бы мокрым, а у вазы сухо, медведь не слезал с полки — пыль ровная. Розовая ниточка от бантика и крошки в альбоме указывают на Ромашку. Ромашка призналась: она хотела устроить чаепитие для друзей, извинилась, и теперь все вместе пьют чай с новым печеньем."},{"band":"b6","title":"Дело о разрисованной стене","story":"В игрушечном домике кто-то нарисовал на стене большую синюю каракулю! Хозяйка домика, Мышка Норушка, очень расстроилась: стену только вчера покрасили. Кто же взял карандаш? Под подозрением трое: котёнок, зайка и робот. Каждый уверяет, что он ни при чём. Найдите улики, сравните их и решите, кто художник. Только помните: детективы никого не ругают, а просто выясняют правду.","suspects":[{"name":"Котёнок Мурзик","desc":"Рыжий котёнок, говорит, что всё утро спал на подоконнике и вообще не умеет рисовать карандашами."},{"name":"Робот Винтик","desc":"Железный робот с отсеком на животе, говорит, что всё утро чинил свою антенну."},{"name":"Зайка Морковка","desc":"Белая зайка с пеналом, говорит, что рисовала, но только морковки на бумаге."}],"clues":[{"text":"Каракуля на стене нарисована синим карандашом.","where":"рядом с местом преступления"},{"text":"В пенале у Морковки только красный, оранжевый и зелёный карандаши — синего нет.","where":"у подозреваемого «Зайка Морковка»"},{"text":"У Мурзика нет ни одного карандаша, а на подоконнике осталась вмятинка: он и правда там спал.","where":"у подозреваемого «Котёнок Мурзик»"},{"text":"В отсеке на животе у Винтика — синий карандаш со стёртым кончиком.","where":"у подозреваемого «Робот Винтик»"}],"solution":"1","explain":"Стену разрисовали синим карандашом, а синего нет ни у Морковки, ни у Мурзика. Синий стёртый карандаш нашёлся только у Винтика. Винтик признался: он хотел нарисовать Норушке подарок, но промахнулся мимо листа, извинился, и теперь все вместе рисуют картину на большом листе бумаги."},{"band":"b10","title":"Дело об исчезнувшем носке","story":"Из корзины с бельём пропал любимый носок в полоску. Мама точно видела его в корзине в 15:00, а в 16:00 носка уже не было. Детективу предстоит разобраться: у кого была возможность взять носок именно в этот час и чьи следы остались на месте? Подозреваемых трое, и у каждого есть своя версия. Помните: важна не одна улика, а то, как они складываются вместе. Не торопитесь с выводами!","suspects":[{"name":"Щенок Шарик","desc":"Весёлый щенок, который любит всё грызть, говорит, что с обеда до вечера гулял с папой во дворе."},{"name":"Дракончик Искра","desc":"Маленький красный дракон, говорит, что весь день грелся у себя в коробке и к корзине не подходил."},{"name":"Енот Полоскун","desc":"Аккуратный енот, который обожает всё стирать, говорит, что сегодня ничего не трогал."}],"clues":[{"text":"Возле корзины мокрые отпечатки лапок: на каждой ровно пять тонких пальчиков.","where":"рядом с местом преступления"},{"text":"Фото с прогулки: Шарик на детской площадке, на часах сзади — 15:20, и гуляли до 16:30.","where":"у подозреваемого «Щенок Шарик»"},{"text":"Страница из Драконьей энциклопедии: «У дракончиков на лапе по три когтя, и они терпеть не могут мокнуть».","where":"у подозреваемого «Дракончик Искра»"},{"text":"В тазике у енота плавает мыльная пена, а на верёвочке рядом сушится что-то полосатое.","where":"у подозреваемого «Енот Полоскун»"}],"solution":"2","explain":"Шарик в нужный час был на прогулке, это подтверждает фото. Следы у корзины мокрые и пятипалые, а у дракончика три когтя и он не любит воду. Остаётся енот, у которого рядом сушится полосатая вещь. Полоскун признался, что увидел пятнышко на носке и решил его постирать, извинился и вернул носок чистым и душистым."},{"band":"b10","title":"Дело о пропавшем кусочке торта","story":"Вечером на кухне остался последний кусочек торта с ванильным кремом. Его оставили на завтрак. Но утром на блюдце были только следы крема. Кто-то ночью тайком устроил себе пир! Трое жильцов квартиры не спали в это время, и у каждого есть объяснение. Проверьте их алиби и улики. Внимание: один из подозреваемых рассказывает почти правду, но одна деталь его выдаёт.","suspects":[{"name":"Кот Профессор Усатов","desc":"Учёный кот в очках, говорит, что весь вечер читал толстую книгу в кабинете и на кухню не заходил."},{"name":"Балерина Пуанта","desc":"Фарфоровая кукла-балерина, говорит, что весь вечер репетировала танец в коридоре у зеркала."},{"name":"Пингвин Лёдик","desc":"Плюшевый пингвин, говорит, что катался на коврике в ванной, как на льдине."}],"clues":[{"text":"На скатерти рядом с блюдцем прилипли три шерстинки.","where":"рядом с местом преступления"},{"text":"У Лёдика нет ни одной шерстинки — только гладкие перья, а у Пуанты — фарфоровое платье.","where":"у подозреваемого «Пингвин Лёдик»"},{"text":"Записка от куклы Ляли: «Я весь вечер смотрела, как Пуанта танцует в коридоре, она ни на минуту не уходила».","where":"у подозреваемого «Балерина Пуанта»"},{"text":"Закладка в книге Усатова стоит на той же странице, что и вчера, а на странице — пятнышко ванильного крема.","where":"у подозреваемого «Кот Профессор Усатов»"}],"solution":"0","explain":"Шерсть на скатерти оставил кто-то пушистый, а у Лёдика перья, у Пуанты фарфор, и к тому же её видела Ляля. Закладка в книге не сдвинулась, значит, Усатов не читал, а пятнышко крема его выдаёт. Профессор извинился и пообещал испечь с ребятами новый торт, на всех."},{"band":"b10","title":"Дело о пропавшей короне","story":"У принцессы Ириски пропала маленькая блестящая корона. Она хранилась в шкатулке с крошечной дверцей. Шкатулку никто не ломал: дверцу аккуратно открыли и закрыли. Вечером в комнате были трое гостей. Двое из них говорят чистую правду, а третий что-то скрывает. Ваша задача — сопоставить размеры, свидетелей и находки и вычислить, кто мог добраться до короны.","suspects":[{"name":"Жираф Длинношей","desc":"Высокий плюшевый жираф, говорит, что весь вечер помогал вешать гирлянду под потолком."},{"name":"Динозавр Тоша","desc":"Большой мягкий динозавр размером с подушку, говорит, что весь вечер строил башню из кубиков."},{"name":"Мышка Пискля","desc":"Крошечная мышка, говорит, что весь вечер сидела у себя в норке и никого не видела."}],"clues":[{"text":"Дверца шкатулки шириной всего с два пальца: пролезет только тот, кто меньше ладошки.","where":"рядом с местом преступления"},{"text":"Все гости видели: Длинношей весь вечер держал гирлянду и ни разу не отошёл от окна.","where":"у подозреваемого «Жираф Длинношей»"},{"text":"Тоша ростом с подушку — он даже лапу в такую дверцу не просунет.","where":"у подозреваемого «Динозавр Тоша»"},{"text":"У входа в норку лежит золотая блёстка — точно такая же, как на короне.","where":"у подозреваемого «Мышка Пискля»"}],"solution":"2","explain":"В шкатулку мог пролезть только кто-то меньше ладошки: Тоша слишком большой, а Длинношей всё время был у всех на виду. Блёстка у норки подтверждает, что корона была у Пискли. Пискля призналась, что хотела всего разок примерить корону, извинилась и вернула её, а принцесса разрешила ей носить корону по праздникам."}],"twister":{"how":"Возьмите 12–16 листов цветной бумаги или нарисуйте фломастерами большие круги на обычных листах — по 3–4 листа каждого цвета — и разложите их на полу сеткой 4×4 с шагом примерно в полшага ребёнка. Каждый лист закрепите по краям широким скотчем, чтобы не скользил, и играйте босиком или в носках с нескользящей подошвой на ковре или мягком полу, подальше от углов мебели.","colors":["красный","синий","зелёный","жёлтый"]},"music":{"how":"Все садятся в круг и передают друг другу предмет (мягкую игрушку, мячик или шапку), пока играет мелодия из приложения. Музыка останавливается в случайный момент: у кого в руках предмет — тот нажимает кнопку и выполняет весёлое задание. После задания музыка играет снова, и передача продолжается. Никто не выбывает: задание — это не наказание, а маленькое выступление.","tasks":["Изобрази пингвина","Скажи комплимент соседу справа","Помяукай, как котёнок, который хочет молока","Покажи, как ты чистишь зубы, но очень медленно","Сделай самую смешную рожицу","Изобрази робота, который танцует","Скажи «привет» тремя разными голосами","Покажи без слов любимое животное — пусть все угадают","Спой первую строчку любой песенки","Пройдись по кругу, как королева или король","Изобрази чайник, который закипает: пш-ш-ш!","Расскажи, что ты съел бы на завтрак в стране великанов","Обними ближайшую мягкую игрушку и скажи ей что-нибудь доброе","Покажи, как ходит очень сонный медведь","Похлопай в ладоши ритм, а все повторят","Назови три вещи, которые делают тебя счастливым","Изобрази лягушку, которая поймала комара","Скажи «спасибо» соседу слева за что-нибудь","Покажи, как ты радуешься, когда находишь сокровище","Пошепчи на ушко соседу добрую тайну"]},"memory":{"how":"Разрежьте 3–6 листов бумаги на четыре части — получатся одинаковые карточки. На каждой паре нарисуйте фломастером одинаковый простой символ: круг, звезду, сердце, домик, солнце, рыбку, стрелку, цветок и т.д. — 6 пар для малышей, 10–12 для детей постарше. Карточки перемешайте и разложите рубашкой вверх, следя, чтобы рисунок не просвечивал (при необходимости нарисуйте на обороте одинаковую клеточку). Если бумаги нет, можно спрятать пары одинаковых бытовых предметов (две ложки, две прищепки, два кубика) под непрозрачными стаканчиками — открываем по два стаканчика за ход и ищем пары."},"puppet":["Зайка потерял свой голос и не может позвать маму, а Мишка и Лиса помогают его найти, подсказывая, где он мог его оставить. Роли: Зайка, Мишка, Лиса.","Котёнок боится темноты и не может уснуть, а Светлячок и Сова показывают ему, что ночью в комнате нет ничего страшного. Роли: Котёнок, Светлячок, Сова.","Ёжик хочет обнять друзей, но они боятся его колючек; вместе с Белочкой они придумывают, как обниматься по-особенному. Роли: Ёжик, Белочка, Медвежонок.","Принцесса и Дракон должны вместе испечь пирог для праздника, но Дракон случайно дунул огнём слишком сильно. Роли: Принцесса, Дракон.","Робот прилетел с другой планеты и не знает, что такое «дружба», а Кукла и Собачка объясняют ему это на примерах. Роли: Робот, Кукла, Собачка.","Мышка нашла огромный сыр, но не может утащить его одна, и ей по очереди помогают все звери. Роли: Мышка, Кот, Слон.","Динозаврик пришёл в детский сад первый раз и стесняется, а Воспитательница-Курочка и новый друг Лягушонок помогают ему освоиться. Роли: Динозаврик, Курочка, Лягушонок.","У Солнышка заболел лучик, и оно не может проснуться, а Тучка и Ветерок придумывают, как его развеселить. Роли: Солнышко, Тучка, Ветерок."]},"hostsF":{"pirates":{"texts":{"parent_role.name":"Боцманша Плюшка","costumes[5].name":"Треуголка Боцманши","intro.b3":"Йо-хо-хо, {kids}! Я Боцманша Плюшка с корабля «Весёлая Камбала». Давным-давно капитан Пряник спрятал в нашем доме настоящий клад, а карту порвал на кусочки, чтобы её не нашёл хитрый пират Барабулька. Нам нужно собрать все {fragments}. В каждой каюте вас ждёт весёлое испытание, а за ним — подсказка. Соберём карту целиком — и сундук откроется! Свистать всех наверх!","intro.b6":"Свистать всех наверх, {kids}! Я Боцманша Плюшка, и у меня отличные новости. Знаменитый капитан Пряник спрятал свой клад прямо здесь, в нашем доме. Правда, он был очень осторожным капитаном: карту порвал на кусочки и разложил по разным каютам, а каждую охраняет хитрое испытание. Пират Барабулька тоже охотится за кладом, но он путает лево и право, так что шансы у нас отличные. Ваша задача — пройти испытания, собрать все {fragments} и узнать тайный код. В Бортовом журнале всё записано. Поднять якорь!","intro.b10":"Внимание, {kids}! Говорит Боцманша Плюшка, старейшая морячка «Весёлой Камбалы» и большая любительница пирожков. Капитан Пряник, гроза всех морей и всех кондитерских, спрятал в этом доме своё главное сокровище. Перед этим он разорвал карту на части, разложил их по каютам и поставил возле каждой испытание — на смекалку, ловкость и чувство юмора. За кладом охотится и пират Барабулька, но он однажды полгода искал собственный корабль, стоя на его палубе. Соберите все {fragments}, разгадайте тайный код и введите его в Бортовой журнал. Поднять якорь, полный вперёд!","beats[1]":"Ох, ну и качка! Волны шлёпают по бортам, а мы швартуемся: перед нами {room}. Боцманша чует, что здесь пахнет приключениями (или пирожками). Чтобы плыть дальше, пройдите испытание!","beats[5]":"Опустился туман, такой густой, что Боцманша не видит собственного носа. На ощупь мы добрались — вот {room}. Туман рассеется, только если команда справится с испытанием. Вперёд!","beats[8]":"Сундук уже совсем близко — Боцманша слышит, как звенят монеты (или это урчит у неё в животе?). Ещё немного, и вот {room}. Испытание непростое, но вы уже настоящие морские волки. Вперёд!","trial_success[0]":"Йо-хо-хо, получилось! Боцманша так довольна, что пустилась в пляс. Держите подсказку — она укажет, где прячется {fragment}.","trial_success[5]":"Ура юнгам! Ветер наполняет паруса, а у Боцманши для вас подсказка. Слушайте и ищите {fragment}!","found[1]":"Нашли! Боцманша чуть не уронила треуголку от радости!","game_flavor.magicbag":"В мешке у Боцманши — добыча из трюма. Угадайте на ощупь, что там, не подглядывая!","game_flavor.repeat":"Пиратская зарядка! Повторяйте за Боцманшей всё точь-в-точь — так тренируются лучшие юнги семи морей.","game_flavor.lava":"Вода кишит щекотливыми крабами! Пока Боцманша считает, перебирайтесь только по островкам — кто коснётся «воды», того защекочут.","game_flavor.chepuha":"Пираты сочиняют морскую байку по кусочку — чем нелепее, тем лучше. Готовую историю Боцманша запишет в Бортовой журнал!","game_flavor.danetki":"Боцманша знает странную морскую историю. Разгадайте её, задавая вопросы, на которые она ответит только «да» или «нет».","game_flavor.musicpass":"Передавайте по кругу мешочек с пиратскими монетами, пока играет музыка. Музыка стихла — у кого мешочек, тот выполняет задание Боцманши!","game_flavor.quiz":"Морская викторина Боцманши! Ответьте на вопросы о сказках и мультиках — и попугай откроет следующий отсек.","finale.young":"Ура! Сундук открыт! Капитан Пряник был бы очень рад: его клад нашла самая смелая и весёлая команда на свете. Попугай Кекс хлопает крыльями, а Боцманша Плюшка сейчас шепнёт вам, где спрятано сокровище. Бегите скорее! Йо-хо-хо, юнги!","finale.older":"Тысяча медуз, вы это сделали! Карта собрана, код разгадан, а пират Барабулька от удивления снял шляпу (правда, надел её задом наперёд). Краб Клешнюк аплодирует клешнями, русалка Мидия поёт в вашу честь, и даже туман разошёлся. Сокровище капитана Пряника достаётся самой отважной команде семи морей. Боцманша Плюшка сейчас откроет главную тайну — где стоит сундук. Полный вперёд за кладом!","treasure_ideas[4]":"Купон «Боцманша выполняет одно желание»","certificate.text":"{name} получает почётное звание «{title}» за отвагу, смекалку и умение найти сокровище там, где его никто не ждал. Подпись: Боцманша Плюшка."}},"space":{"texts":{"parent_role.name":"Командир Звездулькина","intro.b3":"Приём, приём! Говорит Командир Звездулькина. {kids}, вы зачислены в экипаж ракеты «Звёздная Ромашка»! Наш друг робот Бип улетел на планету Пломбир и оставил там подарок для самых смелых космонавтов. Но подарок закрыт на звёздный замок. Бип спрятал ключики к нему по всей нашей ракете. Пройдём весёлые испытания, соберём все {fragments} — и замок откроется! Ключ на старт!","intro.b6":"Приём, приём, экипаж! На связи Командир Звездулькина. {kids}, вам доверена важнейшая миссия. Робот Бип, наш самый умный и самый рассеянный помощник, улетел на планету Пломбир и оставил там подарок для лучших космонавтов. Чтобы приземлиться, нужен код посадки. Бип разбил его на части и спрятал по всей ракете, а каждую часть сторожит испытание. По пути вас ждут невесомость, кометы и один очень любопытный инопланетянин. Соберите все {fragments}, сложите код и введите его в Бортовой компьютер. Ключ на старт — поехали!","intro.b10":"Внимание, экипаж ракеты «Звёздная Ромашка»! Говорит Командир Звездулькина, пшшш. {kids}, вас отобрали из миллиона кандидатов (остальные проспали). Задание секретное: долететь до планеты Пломбир, где хранится подарок для лучших космонавтов галактики. Беда в том, что код посадки знает только робот Бип, а Бип — гений с памятью золотой рыбки. Чтобы ничего не забыть, он разбил код на части и спрятал по всей ракете. Каждую часть охраняет испытание на ловкость, логику и выдержку. Соберите все {fragments}, сложите код и введите его в Бортовой компьютер. Обратный отсчёт: три, два, один — поехали!","beats[1]":"Внимание, невесомость! Летают ложки, летают носки, даже Командир чуть не уплыла. Мы пристыковались: {room}. Чтобы включить гравитацию обратно, пройдите испытание!","finale.young":"Ура! Посадка прошла мягко! Планета Пломбир встречает героев: робот Бип пляшет, Шуршик машет всеми ручками, а комета Марго светит ярко-ярко. На планете спрятан подарок для экипажа. Командир Звездулькина сейчас скажет, где он лежит!","finale.older":"Посадка разрешена! «Звёздная Ромашка» мягко опустилась на планету Пломбир, и встречать её вышли все местные жители — три снеговика и один очень вежливый вафельный стаканчик. Робот Бип докладывает: «Миссия выполнена на сто процентов!» Шуршик уже просится к вам в экипаж. А главный подарок планеты ждёт лучших космонавтов галактики. Командир Звездулькина сейчас назовёт координаты тайника!","certificate.text":"Удостоверение выдано: {name}. Звание: «{title}». Вручено за смелость, смекалку и мягкую посадку на планету Пломбир. Командир Звездулькина, Центр управления полётами."}},"detective":{"texts":{"parent_role.name":"Инспектор Коврижкина","intro.b3":"Так-так-так! {kids}, у нас срочное дело! Я Инспектор Коврижкина из детективного агентства «Ватрушка». Сегодня утром пропал торт «Облачко» — пышный, с вишенкой сверху. Кто его спрятал? Кот Пирожок? Мышонок Сырник? А может, рассеянный повар Шпинат? Тот, кто унёс торт, оставил по всему дому следы. Пройдём испытания и соберём все {fragments} — тогда разгадаем тайну и найдём торт! Берите лупы — за работу!","intro.b10":"Внимание, агенты! Инспектор Коврижкина, лучший нос агентства «Ватрушка», открывает дело номер ноль-ноль-торт. Сегодня в полдень из дома бесследно исчез торт «Облачко». Ну, почти бесследно: в коридоре крошки, на ручке двери крем, а у кота Пирожка подозрительно довольная морда. Мышонок Сырник утверждает, что сидит на диете, а повар Шпинат не помнит даже, где оставил колпак. {kids}, следствие поручено вам. По дому разложены {fragments}, каждую охраняет испытание на смекалку и наблюдательность. Соберите все, сложите код и введите его в Блокнот сыщика. Помните: сыщик не торопится с выводами… но и торт ждать не будет!","beats[0]":"Начинаем расследование! Первое место для осмотра — {room}. Инспектор уже заметила здесь что-то подозрительное, но, чтобы это разглядеть, нужно пройти испытание. За дело, сыщики!","beats[6]":"Инспектор Коврижкина задумчиво жуёт карандаш: версий много, доказательств мало. Значит, ищем дальше, и следующая точка — {room}. Пройдите испытание и раздобудьте новую улику!","beats[9]":"Решающая проверка! {room} — место, где тайна торта «Облачко» должна раскрыться окончательно. Инспектор так волнуется, что надела шляпу задом наперёд. Последнее испытание — вперёд!","trial_success[0]":"Отличная работа, сыщики! Инспектор Коврижкина записывает в блокнот: «Команда гениальна». А вот подсказка, где спрятана {fragment}.","trial_success[5]":"Есть! Инспектор на радостях съела бы кусок торта… если бы знала, где он. Вот подсказка — {fragment} уже близко.","found[1]":"Нашли! Инспектор Коврижкина записывает находку в блокнот.","game_flavor.danetki":"Инспектор вспомнила странную историю из старых дел. Раскройте её, задавая вопросы, на которые она отвечает только «да» или «нет».","finale.young":"Ура! Дело раскрыто! Оказалось, торт никто не крал: повар Шпинат спрятал его как сюрприз для лучших сыщиков, а потом забыл куда. Но вы нашли разгадку! Инспектор Коврижкина сейчас скажет, где сюрприз. Бегите!","finale.older":"Дело номер ноль-ноль-торт закрыто! Улики сложились, код разгадан, а виновник найден: это повар Шпинат. Он спрятал торт «Облачко» как сюрприз для самой лучшей команды сыщиков и… тут же забыл куда. Кот Пирожок и мышонок Сырник полностью оправданы (хотя крем на усах всё ещё вызывает вопросы). Награда ждёт героев следствия. Инспектор Коврижкина сейчас назовёт место, где спрятан сюрприз!","certificate.text":"Удостоверение выдано: {name}. Звание: «{title}». За раскрытие дела о пропавшем торте, зоркость и железную логику. Инспектор Коврижкина, агентство «Ватрушка»."}},"magic":{"texts":{"parent_role.name":"Чародейка Шуршинка","title":"Заклинание чародейки Шуршинки","costumes[4].name":"Мантия Шуршинки","intro.b1":"Шурум-бурум! {kids}, я добрая волшебница. Ветер унёс из моей книжки странички. Давайте найдём все {fragments}! Тогда случится чудо и появится сюрприз. Взмахнём ручками: раз, два, три — колдуем!","intro.b3":"Шурум-бурум, здравствуйте, {kids}! Я Чародейка Шуршинка, хранительница Волшебной книги. В ней записано самое доброе заклинание на свете — «Чудо-Сюрприз». Но вчера озорной сквозняк Фьюить влетел в окно и раскидал по всему дому волшебные странички! Без них заклинание не работает. Давайте пройдём весёлые испытания и соберём все {fragments}. Тогда книга засветится, и чудо обязательно случится! Берите палочки — начинаем!","intro.b6":"Шурум-бурум, юные волшебники! {kids}, я Чародейка Шуршинка, и мне очень нужна ваша помощь. Триста лет я хранила Волшебную книгу, а в ней — заклинание «Чудо-Сюрприз», которое превращает обычный день в праздник. Но сегодня сквозняк Фьюить, большой любитель пошалить, распахнул окно и разнёс страницы заклинания по всему дому. Теперь каждую страницу охраняет волшебное испытание, а без страниц книга молчит. Соберите все {fragments}, прочитайте тайное слово и введите его в Волшебную книгу. Только тогда заклинание оживёт! Палочки наготове?","intro.b10":"Шурум-бурум и добрый вечер, {kids}! Позвольте представиться: Чародейка Шуршинка, магистр мелких чудес, обладательница почётной грамоты «За вежливость к драконам». У меня беда. Волшебная книга хранила заклинание «Чудо-Сюрприз», но сквозняк Фьюить, вечный шалун и любитель открытых форточек, разметал его страницы по всему дому. Хуже того: магия обиделась и поставила у каждой страницы испытание. Без смекалки, ловкости и чувства юмора их не пройти. Соберите все {fragments}, сложите тайное слово и введите его в Волшебную книгу. Предупреждаю: сова Ухти будет подсказывать, но говорит она исключительно загадками.","beats[6]":"Чародейка Шуршинка сварила зелье-подсказку, но перепутала ложки, и оно запахло клубникой и носками. Зато зелье указывает путь: {room}. Пройдите испытание, пока оно не остыло!","trial_success[3]":"Испытание пройдено! Чародейка Шуршинка так рада, что колпак у неё сам подпрыгнул. Держите подсказку — {fragment} уже близко.","game_flavor.magicbag":"В мешке Чародейки лежат волшебные предметы. Угадайте на ощупь, что это, — магия любит смелых!","game_flavor.repeat":"Урок взмахов палочкой! Повторяйте за Чародейкой каждое движение — так учатся настоящие волшебники.","game_flavor.lava":"Пол превратился в пузырящийся лимонад! Когда Чародейка скажет «Буль-буль!», запрыгивайте на волшебные островки.","game_flavor.danetki":"Чародейка знает волшебную историю-загадку. Разгадайте её, задавая вопросы, на которые она отвечает только «да» или «нет».","finale.young":"Шурум-бурум! Книга засияла, и заклинание «Чудо-Сюрприз» сработало! Сова Ухти танцует, а дракончик Чихуля пускает радужные пузыри. Где-то в доме появился волшебный подарок. Чародейка Шуршинка сейчас шепнёт вам, где он. Ищите скорее!","finale.older":"Шурум-бурум-бах! Страницы вернулись на место, книга вспыхнула золотом, и заклинание «Чудо-Сюрприз» сработало в полную силу. Сквозняк Фьюить признал поражение и обещал впредь сдувать только пылинки. Дракончик Чихуля на радостях чихнул радугой, а сова Ухти впервые в жизни сказала что-то без загадки: «Молодцы!» Чудо уже появилось где-то в доме. Чародейка Шуршинка сейчас откроет, где его искать!","certificate.text":"Диплом выдан: {name}. Звание: «{title}». За доброе волшебство, смекалку и спасение заклинания «Чудо-Сюрприз». Чародейка Шуршинка, хранительница Волшебной книги."}},"dino":{"texts":{"parent_role.name":"Профессор Ракушкина","parent_role.how":"Говорите как восторженная учёная: поправляйте воображаемые очки, всё рассматривайте вплотную и вскрикивайте «Эврика!». Коронная фраза: «Клянусь своими косточками — это открытие века!» Реквизит — панама, кисточка для рисования и рулетка или линейка.","intro.b3":"Здравствуйте, юные исследователи! {kids}, я Профессор Ракушкина, и у меня потрясающая новость. В нашем доме побывал динозаврик Тяпа — маленькая, зелёная и очень любопытная. Тяпа обожает прятки: она спрятала своё гнездо, а внутри — подарок для друзей! По дороге она оставила следы. Пройдём весёлые испытания, соберём все {fragments} — и они приведут нас прямо к гнезду. Р-р-р, вперёд!","intro.b6":"Внимание, экспедиция! {kids}, говорит Профессор Ракушкина. Клянусь своими косточками, это открытие века: в нашем доме живёт настоящий динозаврик! Её зовут Тяпа, она размером с кошку, ест исключительно огурцы и обожает прятки. Тяпа спрятала своё гнездо с сюрпризом и разбросала по дому подсказки — следы лап. Но рядом бродят её родственники: ворчливый трицератопс Бодя, птерозавр Пик и вулкан Пых, который только пыхтит, как чайник. Каждый приготовил испытание. Соберите все {fragments}, сложите код и введите его в Палеорадар. Тогда гнездо найдётся!","intro.b10":"Срочное сообщение для экспедиции! {kids}, на связи Профессор Ракушкина, учёная с сорокалетним стажем и двумя парами запасных очков. Сегодня мой Палеорадар запищал так, что разбудил соседского кота: в этом доме обнаружен живой динозавр! Точнее, динозаврик Тяпа — небольшая, зелёная и с характером. Тяпа устроила игру: спрятала гнездо с сюрпризом и оставила следы по всему дому. А её родственники — трицератопс Бодя, птерозавр Пик и вулкан Пых — тоже включились в игру и придумали испытания. Соберите все {fragments}, расшифруйте код и введите его в Палеорадар. Учёный мир затаил дыхание!","beats[4]":"Профессор нашла огрызок огурца! Это верный знак: Тяпа была здесь совсем недавно. Мы на месте: {room}. Пройдите испытание, и след станет яснее!","beats[9]":"Профессор Ракушкина так волнуется, что протирает очки третий раз подряд. {room} — последняя точка на карте перед гнездом. Самое важное испытание экспедиции — вперёд!","game_flavor.drawdesc":"Профессор нашла кости неизвестного динозавра. Нарисуйте, как он выглядел, точно по описанию!","game_flavor.danetki":"Профессор расскажет загадочную историю из экспедиции. Разгадайте её, задавая вопросы, на которые она ответит только «да» или «нет».","finale.young":"Р-р-ри! Вот оно, гнездо Тяпы! Тяпа так рада, что вы её нашли! Трицератопс Бодя и птерозавр Пик тоже машут вам. В гнезде лежит подарок. Профессор Ракушкина сейчас скажет, где оно спрятано. Топ-топ-топ — бегом!","finale.older":"Эврика! Код верный, Палеорадар запел, а из укрытия с радостным «р-р-ри!» выглянула Тяпа. Она признаётся, что пряталась нарочно: хотела проверить, кто в этом доме самые лучшие исследователи. Теперь сомнений нет! Трицератопс Бодя аплодирует хвостом, птерозавр Пик делает круг почёта, а вулкан Пых пускает праздничный пар. Гнездо с сюрпризом ждёт. Профессор Ракушкина сейчас назовёт место!","certificate.text":"Диплом выдан: {name}. Звание: «{title}». За смелость, зоркость и открытие тайного гнезда динозаврика Тяпы. Профессор Ракушкина, руководитель экспедиции."}},"heroes":{"texts":{"parent_role.name":"Наставница Супер-Тапочка","costumes[5].name":"Наставница в форме","intro.b3":"Внимание, внимание! {kids}, на связи Наставница Супер-Тапочка из штаба отряда «Молния»! В наш город Улыбинск прикатил робот Скукотрон. Он не злой, просто ужасно занудный: хочет, чтобы все вокруг зевали и скучали. Он спрятал энергокристаллы, на которых работает Генератор Веселья! Пройдём супер-испытания и соберём все {fragments}. Тогда Генератор заработает, и веселье вернётся! Отряд, в позу героя — раз!","intro.b6":"Тревога в штабе! {kids}, говорит Наставница Супер-Тапочка. Пока весь город Улыбинск отдыхал, робот Скукотрон тихонько пробрался к Генератору Веселья и вынул из него все энергокристаллы. Теперь в городе скучно: мороженое не тает, качели не качаются, а коты даже не мурлычут. Скукотрон спрятал кристаллы по разным уголкам и поставил возле каждого испытание — ему кажется, что никто не справится. Но он ещё не встречал отряд «Молния»! Соберите все {fragments}, сложите код и введите его в Пульт штаба. Отряд, в позу героя — раз!","intro.b10":"Внимание, отряд «Молния»! Это Наставница Супер-Тапочка, ваш тренер, координатор и по совместительству главная по печенькам. {kids}, у нас ЧП. Робот Скукотрон — самая занудная машина во вселенной — отключил Генератор Веселья города Улыбинска. Он вынул энергокристаллы, разложил их по укромным уголкам и у каждого поставил испытание: на силу, скорость, смекалку и, что для него страшнее всего, на чувство юмора. Его помощники-зевунчики уже патрулируют комнаты и заразительно зевают. Соберите все {fragments}, сложите код и введите его в Пульт штаба. Город ждёт своих героев!","trial_success[0]":"Супер! Генератор Веселья мигнул и хихикнул. Наставница передаёт подсказку — слушайте, где прячется {fragment}.","game_flavor.repeat":"Тренировка героев! Повторяйте за Наставницей супер-движения — точь-в-точь и с героическим лицом.","game_flavor.lava":"Скукотрон превратил пол в скучную тянучку! Когда Наставница крикнет «Скука!», прыгайте на островки — кто останется на полу, тот зевнёт.","game_flavor.detective":"Из штаба пропал супер-бутерброд Наставницы! Изучите улики и выясните, кто его взял.","game_flavor.danetki":"Наставница расскажет странный случай с прошлого задания. Разгадайте его, задавая вопросы, на которые она ответит только «да» или «нет».","finale.young":"Ура! Генератор Веселья заработал! Скукотрон засмеялся первый раз в жизни и теперь хочет дружить. Город Улыбинск снова улыбается, а кошка Искра мурлычет песенку! А для самых смелых героев приготовлен подарок. Наставница Супер-Тапочка сейчас скажет, где он!","finale.older":"Код принят — Генератор Веселья запущен! По всему Улыбинску закачались качели, замурлыкали коты, а мороженое снова начало таять, как положено. И тут случилось невероятное: Скукотрон хихикнул. Потом рассмеялся. А потом попросился в отряд «Молния» младшим помощником по веселью. Зевунчики разучили танец. Город спасён, и героев ждёт награда. Наставница Супер-Тапочка сейчас назовёт место!","certificate.text":"Удостоверение выдано: {name}. Звание: «{title}». За смелость, скорость и возвращение веселья в город Улыбинск. Наставница Супер-Тапочка, штаб отряда «Молния»."}},"fairy":{"texts":{"parent_role.name":"Хранительница сада Медуница","costumes[5].name":"Наряд Хранительницы","intro.b3":"Тише-тише, слышите? Сад нам шепчет! {kids}, здравствуйте, я Хранительница сада Медуница. В нашем доме растёт волшебный сад феи Незабудки, а в самом его сердце — Радужный цветок. Сегодня утром шмель Жужа так громко чихнул, что все лепестки разлетелись по дому! Без них цветок не может раскрыться. Пройдём весёлые испытания и соберём все {fragments}. Тогда цветок распустится, и внутри будет сюрприз!","intro.b6":"Тише-тише, друзья! {kids}, я Хранительница сада Медуница, и сегодня нам нужна ваша помощь. В нашем доме спрятан волшебный сад феи Незабудки. Каждый год в нём расцветает Радужный цветок, а внутри него фея оставляет подарок для самых добрых и смелых. Но утром шмель Жужа понюхал пыльцу и чихнул так, что лепестки разлетелись во все стороны! Теперь их охраняют жители сада, и каждый приготовил своё испытание. Соберите все {fragments}, сложите волшебное слово и введите его в Волшебное зеркальце — и цветок распустится!","intro.b10":"Тише-тише… Слышите, как шуршат листья? {kids}, добро пожаловать в волшебный сад феи Незабудки. Я Хранительница сада Медуница: отвечаю за полив, порядок и за то, чтобы улитки не устраивали гонок по клумбам. Сегодня у нас происшествие. Шмель Жужа, известный аллергик, понюхал пыльцу Радужного цветка и чихнул так, что лепестки разлетелись по всему дому. А цветок особенный: он распускается только целым и только для тех, кто прошёл испытания сада. Светлячок Огонёк, улитка Тихоня и сам Жужа уже придумали задания. Соберите все {fragments}, сложите волшебное слово и введите его в Волшебное зеркальце. Сад верит в вас!","beats[5]":"Ой, капелька росы упала Хранительнице прямо на нос! Это сад подаёт знак: следующая остановка — {room}. Сад приготовил новое испытание — вперёд!","game_flavor.magicbag":"В корзинке у Хранительницы — подарки леса. Угадайте на ощупь, что там лежит!","game_flavor.repeat":"Танец лесных жителей! Повторяйте за Хранительницей: порхайте, как бабочки, прыгайте, как лягушата, качайтесь, как цветы.","game_flavor.lava":"Ручей разлился! Когда Хранительница скажет «Вода!», перебирайтесь на листья-островки.","game_flavor.danetki":"Хранительница расскажет загадочную историю из жизни сада. Разгадайте её, задавая вопросы, на которые она ответит только «да» или «нет».","finale.young":"Ура! Радужный цветок распустился! Он сияет всеми цветами, а бабочки танцуют вокруг. Фея Незабудка говорит вам спасибо и дарит подарок. Хранительница сада Медуница сейчас скажет, где он спрятан. Бегите скорее!","finale.older":"Чудо свершилось! Лепестки встали на место, и Радужный цветок медленно раскрылся, засияв всеми семью цветами. В саду зазвенели колокольчики, светлячок Огонёк устроил салют, а шмель Жужа дал честное шмелиное слово больше никогда не чихать на клумбы. Фея Незабудка шепчет, что такой доброй и смелой команды в её саду ещё не было. Подарок ждёт. Хранительница Медуница сейчас подскажет, где его искать!","certificate.text":"Грамота вручается: {name}. Звание: «{title}». За доброе сердце, смелость и спасение Радужного цветка. Фея Незабудка и Хранительница сада Медуница."}},"spies":{"texts":{"parent_role.name":"Шеф Невидимка","intro.b3":"Тс-с-с, агенты, говорим шёпотом! {kids}, на связи Шеф Невидимка из секретного агентства «Тихий Ёжик». У нас важное задание. Бабушка Пышка изобрела самый вкусный рецепт оладушков на свете. Чтобы рецепт никто не утащил, его разделили на кусочки и спрятали по всему дому. Наша задача — пройти секретные испытания и собрать все {fragments}. Тогда мы узнаем рецепт и получим награду! Задание понятно? На цыпочках — вперёд!","intro.b6":"Внимание, агенты! Это Шеф Невидимка, агентство «Тихий Ёжик». {kids}, вам поручается операция «Секретный рецепт». Бабушка Пышка, лучший кулинар страны, изобрела рецепт оладушков, от которых все улыбаются. Чтобы его не выведал хитрый агент Сахарная Вата из конкурирующего агентства «Хрустики», рецепт зашифровали и разделили на части. Шифровки спрятаны в разных уголках дома, и каждую охраняет испытание на ловкость, внимание и смекалку. Соберите все {fragments}, сложите пароль и введите его в Шпионский коммуникатор. Сахарная Вата уже рядом, так что действуйте тихо и быстро. Ни звука!","intro.b10":"Совершенно секретно. Читать вслух шёпотом. {kids}, говорит Шеф Невидимка, руководитель агентства «Тихий Ёжик», мастер маскировки и обладательница самых бесшумных тапочек в городе. Начинаем операцию «Секретный рецепт». Объект — рецепт оладушков бабушки Пышки, проверенный на трёх поколениях сладкоежек. Рецепт зашифрован и разбит на части, чтобы до него не добрался агент Сахарная Вата из агентства «Хрустики». Сахарная Вата хитёр, но липок: везде оставляет следы. Шифровки спрятаны по объектам, каждую охраняет испытание. Соберите все {fragments}, сложите пароль и введите его в Шпионский коммуникатор. Это сообщение не самоуничтожится, но лучше его запомнить.","trial_success[0]":"Проверка пройдена! Шеф Невидимка одобрительно кивает (очень тихо). Принимайте подсказку — вот где спрятана {fragment}.","trial_success[5]":"Доступ получен! Шеф Невидимка от удивления даже сняла тёмные очки. Подсказка: где-то рядом ждёт {fragment}.","game_flavor.danetki":"Шеф расскажет загадочный случай из архива. Раскройте его, задавая вопросы, на которые она отвечает только «да» или «нет».","finale.young":"Ура, агенты! Пароль верный! Рецепт бабушки Пышки спасён, а агент Сахарная Вата убежал отряхиваться от сахара. Вы настоящие тайные агенты! Шеф Невидимка сейчас шёпотом скажет, где спрятана награда. Тс-с-с… бегом!","finale.older":"Пароль принят. Операция «Секретный рецепт» завершена успешно! Рецепт оладушков бабушки Пышки в безопасности, а агент Сахарная Вата в очередной раз прилип к собственному следу и отправился домой пить чай. Агентство «Хрустики» даже прислало поздравительную открытку (липкую). Шеф Невидимка присваивает вам высшую степень секретности и вручает награду. Где она? Шеф сейчас скажет. Только тихо — кругом уши!","certificate.text":"Удостоверение выдано: {name}. Кодовое звание: «{title}». За ловкость, бесшумность и спасение секретного рецепта бабушки Пышки. Шеф Невидимка, агентство «Тихий Ёжик»."}}}};
</script>
<script>
/* Домашний квест — генератор квестов. Без зависимостей, детерминированный по seed. */
(function (root) {
  'use strict';
  const QD = root.QD;

  const BANDS = ['b1', 'b3', 'b6', 'b10', 'b13'];
  const BAND_LABEL = { b1: '1–2 года', b3: '3–5 лет', b6: '6–9 лет', b10: '10–12 лет', b13: '13+ лет' };
  const bi = b => BANDS.indexOf(b);
  function bandOf(age) {
    age = Number(age);
    if (age < 3) return 'b1';
    if (age < 6) return 'b3';
    if (age < 10) return 'b6';
    if (age < 13) return 'b10';
    return 'b13';
  }

  /* ---------- seeded random ---------- */
  function hashStr(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  }
  function rng(seed) {
    let a = hashStr(String(seed));
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
  function shuffle(r, arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  const sample = (r, arr, n) => shuffle(r, arr).slice(0, n);

  /* ---------- справочники ---------- */
  const ROOM_ORDER = ['living', 'kids', 'kitchen', 'bedroom', 'hall', 'bath', 'study'];
  const SPACIOUS = ['living', 'kids', 'hall', 'bedroom'];
  const TABLE_ROOMS = ['living', 'kitchen', 'kids', 'study'];
  const AFFINITY = {
    pirates: ['bowling', 'lava', 'swamp', 'cinderella', 'musicpass', 'crocodile', 'puzzle', 'tower'],
    space: ['repeat', 'tower', 'twister', 'magicbag', 'memory', 'quiz', 'kosoykozel', 'lava'],
    detective: ['whatmissing', 'danetki', 'detective', 'memory', 'magicbag', 'drawdesc', 'puzzle'],
    magic: ['magicbag', 'drawdesc', 'chepuha', 'puppet', 'imaginarium', 'repeat', 'cinderella'],
    dino: ['swamp', 'lava', 'bowling', 'puzzle', 'whatmissing', 'crocodile', 'tower'],
    heroes: ['lava', 'twister', 'bowling', 'repeat', 'tower', 'kosoykozel', 'crocodile'],
    fairy: ['puppet', 'cinderella', 'quiz', 'magicbag', 'chepuha', 'musicpass', 'swamp'],
    spies: ['danetki', 'detective', 'scrabble', 'whatmissing', 'memory', 'wordgame', 'mafia', 'jenga']
  };
  const WARMUP = ['repeat', 'magicbag', 'crocodile', 'whatmissing', 'quiz', 'bowling'];
  const OWNABLE = { jenga: 'jenga', imaginarium: 'imaginarium', puzzle: 'puzzle' };

  const SYMBOLS = [
    { id: 'star', name: 'звезда' }, { id: 'heart', name: 'сердце' }, { id: 'circle', name: 'круг' },
    { id: 'triangle', name: 'треугольник' }, { id: 'square', name: 'квадрат' }, { id: 'moon', name: 'месяц' },
    { id: 'sun', name: 'солнышко' }, { id: 'flower', name: 'цветок' }, { id: 'wave', name: 'волна' },
    { id: 'cross', name: 'крестик' }, { id: 'drop', name: 'капля' }, { id: 'arrow', name: 'стрелка' }
  ];

  const ALPHA = 'АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ';

  const game = id => QD.games.find(g => g.id === id);

  /* ведущая: подставляем женские варианты текстов про ведущего (content/hosts_f.json) */
  const hostCache = {};
  function themeForHost(th, host) {
    const ov = host === 'f' && QD.hostsF && QD.hostsF[th.id];
    if (!ov) return th;
    if (hostCache[th.id]) return hostCache[th.id];
    const t = JSON.parse(JSON.stringify(th));
    Object.keys(ov.texts || {}).forEach(path => {
      const keys = path.match(/[^.[\]]+/g);
      let o = t;
      for (let i = 0; i < keys.length - 1; i++) { if (o == null) return; o = o[keys[i]]; }
      if (o != null && typeof o[keys[keys.length - 1]] === 'string') o[keys[keys.length - 1]] = ov.texts[path];
    });
    return (hostCache[th.id] = t);
  }
  const theme = id => QD.themes.find(t => t.id === id) || QD.themes[0];
  const room = id => QD.spots.rooms.find(r => r.id === id);

  /* ---------- профиль группы ---------- */
  function profile(params) {
    const kids = params.kids.length ? params.kids : [{ age: 6 }];
    const ages = kids.map(k => Number(k.age) || 6);
    const minA = Math.min(...ages), maxA = Math.max(...ages);
    const mean = ages.reduce((a, b) => a + b, 0) / ages.length;
    const bY = bandOf(minA), bO = bandOf(maxA);
    let bD = bandOf(Math.round(mean));
    const mode = maxA < 3 ? 'toddler' : maxA < 6 ? 'symbols' : 'letters';
    if (mode !== 'toddler' && bD === 'b1') bD = 'b3';
    const kidBands = [...new Set(ages.map(bandOf))];
    return { count: kids.length, ages, minA, maxA, bY, bO, bD, mode, kidBands };
  }

  function defaultStages(ageList) {
    const p = profile({ kids: ageList.map(a => ({ age: a })) });
    return { b1: 3, b3: 5, b6: 6, b10: 7, b13: 7 }[p.bD];
  }
  // ограничение по числу этапов: возраст + сколько безопасных тайников есть в выбранных комнатах
  function maxStages(prof, roomsCount) {
    const R = Math.max(1, roomsCount || 3);
    let m = prof.mode === 'toddler' ? 5 : 10;
    const perRoom = prof.bY === 'b1' ? 4 : 7;
    m = Math.min(m, Math.max(3, perRoom * R - 1));
    if (R === 1) m = Math.min(m, prof.bY === 'b1' ? 3 : 5);
    return m;
  }

  /* обращение к детям */
  function kidsAddress(params) {
    const names = params.kids.map(k => (k.name || '').trim()).filter(Boolean);
    if (names.length && names.length === params.kids.length) {
      if (names.length === 1) return names[0];
      return names.slice(0, -1).join(', ') + ' и ' + names[names.length - 1];
    }
    return params.kids.length === 1 ? 'дружок' : 'ребята';
  }

  /* ---------- подбор игр ---------- */
  function bankBand3(b) { return (b === 'b1' || b === 'b3') ? 'b3' : (b === 'b6' ? 'b6' : 'b10'); }

  function gameFits(g, roomId, prof, params, relax) {
    if (!g.stage) return { ok: false, why: 'не для этапа' };
    // возраст
    if (prof.bY === 'b1' && prof.bO !== 'b1') {
      if (!g.bands.some(b => prof.kidBands.includes(b))) return { ok: false, why: 'не по возрасту' };
    } else if (!g.bands.includes(prof.bY)) return { ok: false, why: 'не для младшего' };
    if (prof.mode === 'toddler' && !g.bands.includes('b1')) return { ok: false, why: 'не для малышей' };
    // игроки
    const avail = g.id === 'mafia' ? prof.count : prof.count + 1;
    if (avail < g.min_players) return { ok: false, why: 'нужно ' + g.min_players + '+ игроков' };
    // шум
    if (params.quiet && g.noise === 'active') return { ok: false, why: 'шумная' };
    // комната
    const z = g.zones || ['any'];
    if (roomId === 'bath' && (g.noise === 'active' || !z.includes('any'))) return { ok: false, why: 'не для ванной' };
    if (g.noise === 'active') {
      if (!SPACIOUS.includes(roomId)) return { ok: false, why: 'мало места' };
      if (!relax && !(z.includes(roomId) || ['living', 'kids'].includes(roomId))) return { ok: false, why: 'мало места' };
    } else if (!relax && !z.includes('any') && !z.includes(roomId) && !(z.includes('table') && TABLE_ROOMS.includes(roomId))) {
      return { ok: false, why: 'нужен стол' };
    }
    return { ok: true };
  }

  function scoreGame(g, ctx) {
    const { prof, params, r, idx, prev, usedTools } = ctx;
    let s = r() * 1.2;
    s += 0.6 * prof.kidBands.filter(b => g.bands.includes(b)).length / prof.kidBands.length;
    if (g.bands.includes(prof.bD)) s += 0.4;
    if ((AFFINITY[params.theme] || []).includes(g.id)) s += 0.55;
    const own = OWNABLE[g.id];
    if (own) s += (params.owned || []).includes(own) ? 0.5 : (g.id === 'puzzle' ? 0 : -0.35);
    if (prev && prev.noise === 'active' && g.noise === 'active') s -= 0.7;
    if (prev && prev.noise === 'quiet' && g.noise === 'active') s += 0.25;
    if (usedTools.includes(g.tool) && g.tool !== 'timer' && g.tool !== 'none') s -= 0.4;
    if (idx === 0) { if ((g.prep_min || 0) > 4) s -= 0.4; if (WARMUP.includes(g.id)) s += 0.35; }
    if (g.duration && g.duration[0] >= 10) s -= 0.5;
    if (g.id === 'mafia') s -= 0.4;
    return s;
  }

  function eligibleGames(roomId, prof, params) {
    return QD.games.filter(g => gameFits(g, roomId, prof, params).ok);
  }

  /* ---------- шифры ---------- */
  function caesar(word, k) {
    return word.split('').map(ch => { const i = ALPHA.indexOf(ch); return i < 0 ? ch : ALPHA[(i + k + 32) % 32]; }).join('');
  }
  function atbash(word) { return word.split('').map(ch => { const i = ALPHA.indexOf(ch); return i < 0 ? ch : ALPHA[31 - i]; }).join(''); }
  function numbers(word) { return word.split('').map(ch => ALPHA.indexOf(ch) + 1).join(' · '); }

  function makeCipher(r, word, band) {
    const methods = band === 'b13' ? ['caesar_hidden', 'atbash', 'numbers_shift', 'caesar'] : ['caesar', 'numbers', 'reverse'];
    const m = pick(r, methods);
    if (m === 'caesar') {
      const k = 1 + Math.floor(r() * 3);
      return { method: m, encoded: caesar(word, k), key: 'Каждая буква сдвинута по алфавиту на ' + k + ' вперёд. Сдвиньте каждую на ' + k + ' назад.', alphabet: true };
    }
    if (m === 'caesar_hidden') {
      const k = 2 + Math.floor(r() * 5);
      return { method: m, encoded: caesar(word, k), key: 'Шифр сдвига, но шаг неизвестен. Подсказка: первая буква ответа — «' + word[0] + '».', alphabet: true };
    }
    if (m === 'atbash') return { method: m, encoded: atbash(word), key: 'Алфавит перевёрнут: А↔Я, Б↔Ю, В↔Э…', alphabet: true };
    if (m === 'numbers') return { method: m, encoded: numbers(word), key: 'Каждое число — номер буквы в алфавите (А = 1).', alphabet: true };
    if (m === 'numbers_shift') {
      const nums = word.split('').map(ch => ALPHA.indexOf(ch) + 1 + 10).join(' · ');
      return { method: m, encoded: nums, key: 'Номера букв, но к каждому прибавили одно и то же число. Подсказка: первая буква — «' + word[0] + '».', alphabet: true };
    }
    return { method: 'reverse', encoded: word.split('').reverse().join(''), key: 'Прочитайте задом наперёд.', alphabet: false };
  }

  function makeClue(r, spot, prof, gameId) {
    const c = { spotId: spot.id, room: spot.room, place: spot.place, answer: spot.keyword, emoji: spot.emoji };
    if (prof.mode === 'toddler') { c.kind = 'toddler'; c.text = spot.toddler; return c; }
    if (gameId === 'scrabble') {
      c.kind = 'anagram';
      let letters = shuffle(r, spot.keyword.split(''));
      if (letters.join('') === spot.keyword) letters = letters.reverse();
      c.letters = letters;
      c.text = 'Из букв, которые вы добыли в испытании, составьте слово — это и есть место, где спрятан следующий фрагмент.';
      c.backup = prof.bD === 'b3' ? spot.simple : spot.riddle;
      return c;
    }
    if (prof.bD === 'b3') { c.kind = 'simple'; c.text = spot.simple; return c; }
    if (prof.bD === 'b6') { c.kind = 'riddle'; c.text = spot.riddle; return c; }
    c.kind = 'cipher'; c.text = spot.teen; c.cipher = makeCipher(r, spot.keyword, prof.bD); c.backup = spot.riddle;
    return c;
  }

  /* ---------- содержимое инструментов ---------- */
  function toolContent(g, prof, params, r, used) {
    const A = QD.banksA, B = QD.banksB;
    const b3 = bankBand3(prof.bD);
    const take = (key, list, n) => {
      used[key] = used[key] || [];
      const fresh = list.filter(x => !used[key].includes(JSON.stringify(x)));
      const out = sample(r, fresh.length >= n ? fresh : list, n);
      out.forEach(x => used[key].push(JSON.stringify(x)));
      return out;
    };
    const d = { tool: g.tool };
    switch (g.tool) {
      case 'cards_crocodile': {
        const th = (A.crocodile_theme[params.theme] || []);
        d.words = shuffle(r, take('croT', th, 4).concat(take('croB' + b3, A.crocodile[b3] || [], 8)));
        break;
      }
      case 'quiz': {
        const n = b3 === 'b3' ? 3 : 4;
        d.questions = take('quiz' + b3, A.quiz[b3] || [], n);
        break;
      }
      case 'danetki': {
        const band = bi(prof.bD) <= 2 ? 'b6' : 'b10';
        let pool = A.danetki.filter(x => x.band === band);
        if (!pool.length) pool = A.danetki;
        d.items = take('dan', pool, 2);
        break;
      }
      case 'draw_prompts': {
        let pool = B.draw.filter(x => x.band === b3);
        if (!pool.length) pool = B.draw;
        d.items = take('draw', pool, 2).map(x => x.text);
        break;
      }
      case 'chepuha': d.chepuha = B.chepuha; break;
      case 'sequence': {
        const band = prof.bD === 'b1' ? 'b1' : prof.bD === 'b3' ? 'b3' : 'b6';
        const moves = B.repeat[band] || B.repeat.b3;
        const lens = { b1: [2, 2, 3], b3: [3, 4, 5], b6: [4, 5, 6] }[band];
        d.rounds = lens.map(L => sample(r, moves, L));
        d.moves = moves;
        break;
      }
      case 'word_tasks': {
        const band = bi(prof.bD) <= 2 ? 'b6' : 'b10';
        d.items = take('word' + band, B.word_tasks[band] || [], 3);
        break;
      }
      case 'sort_tasks': {
        const band = prof.bD === 'b1' ? 'b1' : prof.bD === 'b3' ? 'b3' : 'b6';
        let pool = B.sort_tasks.filter(x => x.band === band);
        if (!pool.length) pool = B.sort_tasks;
        d.items = take('sort', pool, 1).map(x => x.task);
        break;
      }
      case 'magicbag_items': {
        const band = prof.bY === 'b1' ? 'b1' : prof.bD === 'b3' ? 'b3' : 'b6';
        d.items = take('bag' + band, B.magicbag[band] || [], 6);
        break;
      }
      case 'imaginarium_prompts': d.items = take('img', B.imaginarium, 5); break;
      case 'kozel': d.kozel = B.kozel; d.twisters = take('tw', A.tongue_twisters[b3] || [], 2); break;
      case 'spinner_twister': d.twister = B.twister; break;
      case 'music': d.music = B.music; break;
      case 'mafia_roles': d.mafia = B.mafia; break;
      case 'detective_case': {
        const band = bi(prof.bD) <= 2 ? 'b6' : 'b10';
        let pool = B.detective_cases.filter(x => x.band === band);
        if (!pool.length) pool = B.detective_cases;
        d.case = pick(r, pool);
        break;
      }
      default: break;
    }
    if (g.id === 'whatmissing') {
      const band = prof.bY === 'b1' ? 'b1' : prof.bD === 'b3' ? 'b3' : 'b6';
      d.items = take('bag' + band, B.magicbag[band] || [], { b1: 3, b3: 5, b6: 8 }[band] || 6);
    }
    if (g.id === 'puppet') d.plot = take('pup', B.puppet, 1)[0];
    if (g.id === 'memory') d.memory = B.memory;
    if (g.id === 'kosoykozel' && !d.kozel) { d.kozel = B.kozel; }
    if (g.id === 'repeat' && !d.rounds) {
      const band = prof.bD === 'b1' ? 'b1' : prof.bD === 'b3' ? 'b3' : 'b6';
