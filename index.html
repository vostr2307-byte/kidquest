<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#5B3DF5">
<meta name="description" content="Домашний квест для детей: сюжет, загадки, тайники и игры по вашей квартире.">
<title>Домашний квест</title>
<!--TG--><script src="https://telegram.org/js/telegram-web-app.js"></script><!--/TG-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F2F0FC;
  --surface: #FFFFFF;
  --surface2: #E9E5FB;
  --ink: #1D1A3F;
  --muted: #5E5A86;
  --line: #D9D4F3;
  --primary: #5B3DF5;
  --primary-ink: #FFFFFF;
  --sun: #FFB020;
  --mint: #0E9C74;
  --coral: #E5485F;
  --radius: 18px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --font-d: 'Unbounded', 'Arial Black', system-ui, sans-serif;
  --font-b: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14122B; --surface: #1F1C3D; --surface2: #2A2650; --ink: #EFEDFF; --muted: #ABA6D8;
    --line: #34305E; --primary: #8E78FF; --primary-ink: #120E33; --sun: #FFC14D; --mint: #3DD6A6; --coral: #FF7A8C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14122B; --surface: #1F1C3D; --surface2: #2A2650; --ink: #EFEDFF; --muted: #ABA6D8;
  --line: #34305E; --primary: #8E78FF; --primary-ink: #120E33; --sun: #FFC14D; --mint: #3DD6A6; --coral: #FF7A8C;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-b); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; min-height: 100vh;
  overscroll-behavior-y: none;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--font-d); margin: 0; letter-spacing: -0.01em; line-height: 1.15; }
h1 { font-size: 30px; font-weight: 800; }
h2 { font-size: 21px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 18px calc(110px + var(--safe-b)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stack > * + * { margin-top: 14px; }
.row { display: flex; gap: 10px; align-items: center; }
.grow { flex: 1; min-width: 0; }
.hidden { display: none !important; }

/* ---------- кнопки ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 22px; border-radius: 16px;
  font-weight: 800; font-size: 17px; background: var(--primary); color: var(--primary-ink);
  transition: transform .12s ease, filter .12s ease;
}
.btn:active { transform: scale(.97); }
.btn.block { width: 100%; }
.btn.ghost { background: var(--surface2); color: var(--ink); }
.btn.line { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: 15px; border-radius: 12px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.link { color: var(--primary); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding-block: 12px calc(12px + var(--safe-b));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.bar .inner { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; }
.bar .btn { flex: 1; }
.bar .btn.ghost { flex: 0 0 auto; }

/* ---------- главная ---------- */
.hero { padding-top: 6px; }
.hero h1 { font-size: 34px; line-height: 1.05; }
.hero .lead { font-size: 18px; color: var(--muted); margin-top: 10px; max-width: 30ch; }
.track-hero { margin: 8px -6px 4px; }
.howto-list { counter-reset: s; list-style: none; padding: 0; margin: 0; }
.howto-list li { position: relative; padding: 0 0 14px 46px; }
.howto-list li::before {
  counter-increment: s; content: counter(s);
  position: absolute; left: 0; top: -2px; width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center; font-family: var(--font-d); font-weight: 700; font-size: 14px;
  background: var(--sun); color: #2A1B00;
}
.howto-list b { display: block; }
.saved { display: grid; gap: 10px; }
.saved-item {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius);
  background: var(--surface); text-align: left; width: 100%;
}
.saved-item .emo { font-size: 30px; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; flex: 0 0 46px; }
.saved-item .t { font-weight: 800; line-height: 1.2; }
.saved-item .s { font-size: 14px; color: var(--muted); }
.del { width: 40px; height: 40px; border-radius: 12px; color: var(--muted); display: grid; place-items: center; font-size: 20px; flex: 0 0 40px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 0 12px; }

/* ---------- мастер ---------- */
.steps { display: flex; gap: 6px; margin-bottom: 18px; }
.steps i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.steps i.on { background: var(--primary); }
.step-head { margin-bottom: 18px; }
.step-head .k { font-size: 14px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
.step-head p { color: var(--muted); margin-top: 8px; }
.kid {
  background: var(--surface); border-radius: var(--radius); padding: 14px;
  display: grid; grid-template-columns: 1fr auto; gap: 10px 12px; align-items: center;
}
.kid input[type=text] {
  width: 100%; border: 0; border-bottom: 2px solid var(--line); background: transparent;
  padding: 6px 2px; font-size: 18px; font-weight: 700; outline: none; border-radius: 0;
}
.kid input[type=text]:focus { border-color: var(--primary); }
.kid .agebox { display: flex; align-items: center; gap: 6px; }
.stepper { display: inline-flex; align-items: center; background: var(--surface2); border-radius: 14px; }
.stepper button { width: 42px; height: 42px; font-size: 22px; font-weight: 800; border-radius: 14px; }
.stepper output { min-width: 34px; text-align: center; font-family: var(--font-d); font-weight: 700; font-size: 18px; }
.kid .meta { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
.kid .rm { color: var(--coral); font-weight: 700; }
.add-kid { width: 100%; min-height: 54px; border-radius: var(--radius); box-shadow: inset 0 0 0 2px dashed var(--line); border: 2px dashed var(--line); font-weight: 800; color: var(--primary); }

.rooms { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.room-tg {
  display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: var(--radius);
  background: var(--surface); text-align: left; font-weight: 800; min-height: 64px;
  box-shadow: inset 0 0 0 2px transparent; transition: box-shadow .15s, background .15s;
}
.room-tg .e { font-size: 26px; }
.room-tg[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--primary); background: var(--surface2); }
.room-tg[aria-pressed="true"]::after { content: '✓'; margin-left: auto; color: var(--primary); font-size: 18px; }

.themes { display: grid; gap: 12px; }
.theme-card {
  position: relative; display: grid; grid-template-columns: 64px 1fr; gap: 4px 14px; align-items: center;
  padding: 16px; border-radius: 22px; text-align: left; overflow: hidden;
  box-shadow: inset 0 0 0 3px transparent; transition: transform .12s;
}
.theme-card:active { transform: scale(.985); }
.theme-card .e { grid-row: 1 / 3; font-size: 44px; line-height: 1; text-align: center; }
.theme-card .t { font-family: var(--font-d); font-weight: 700; font-size: 17px; line-height: 1.2; }
.theme-card .d { font-size: 14px; opacity: .85; }
.theme-card .fit { display: table; margin-top: 8px; font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; }
.theme-card[aria-pressed="true"] { box-shadow: inset 0 0 0 3px currentColor; }
.theme-card[aria-pressed="true"]::after { content: '✓'; position: absolute; bottom: 10px; right: 14px; font-size: 20px; font-weight: 800; }

.setting { background: var(--surface); border-radius: var(--radius); padding: 16px; }
.setting .row { justify-content: space-between; }
.setting .h { font-weight: 800; }
.setting .s { font-size: 14px; color: var(--muted); }
.switch { position: relative; width: 52px; height: 32px; border-radius: 16px; background: var(--line); flex: 0 0 52px; transition: background .15s; }
.switch::after { content: ''; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.switch[aria-checked="true"] { background: var(--mint); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip { padding: 8px 14px; border-radius: 999px; background: var(--surface2); font-weight: 700; font-size: 15px; }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); }
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.summary div { background: var(--surface2); border-radius: 14px; padding: 10px 6px; }
.summary b { display: block; font-family: var(--font-d); font-size: 20px; }
.summary span { font-size: 13px; color: var(--muted); }

/* ---------- тематический режим (обзор и игра) ---------- */
.themed { background: var(--t-bg); color: var(--t-ink); min-height: 100vh; }
.themed .muted { color: var(--t-muted); }
.themed .btn { background: var(--t-accent); color: var(--t-on-accent); }
.themed .btn.ghost { background: var(--t-surface); color: var(--t-ink); }
.themed .btn.line { background: transparent; color: var(--t-ink); box-shadow: inset 0 0 0 2px var(--t-line); }
.themed .bar { background: linear-gradient(to top, var(--t-bg) 70%, transparent); }
.themed :focus-visible { outline-color: var(--t-accent2); }

.q-head .emo { font-size: 46px; line-height: 1; }
.q-head h1 { font-size: 27px; margin-top: 10px; }
.q-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 15px; color: var(--t-muted); }
.q-meta b { color: var(--t-ink); }

.tabs { display: flex; gap: 6px; background: var(--t-surface); padding: 5px; border-radius: 16px; margin: 18px 0 16px; }
.tabs button { flex: 1; min-height: 42px; border-radius: 12px; font-weight: 800; color: var(--t-muted); }
.tabs button[aria-selected="true"] { background: var(--t-accent); color: var(--t-on-accent); }

.group { margin-top: 22px; }
.group > h2 { font-size: 18px; margin-bottom: 4px; }
.group > .gd { font-size: 14px; color: var(--t-muted); margin-bottom: 10px; }
.check {
  display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 12px 0; text-align: left; width: 100%;
  border-bottom: 1px solid var(--t-line);
}
.check .box { width: 26px; height: 26px; border-radius: 8px; box-shadow: inset 0 0 0 2px var(--t-line); display: grid; place-items: center; font-weight: 900; font-size: 16px; margin-top: 1px; }
.check[aria-checked="true"] .box { background: var(--t-accent2); box-shadow: none; color: var(--t-on-accent2); }
.check[aria-checked="true"] .ct { opacity: .55; text-decoration: line-through; text-decoration-thickness: 1px; }
.check .ct b { display: block; font-weight: 800; }
.check .ct span { font-size: 14.5px; color: var(--t-muted); }
.note { background: var(--t-surface); border-radius: 16px; padding: 14px 16px; font-size: 15px; }
.note b { color: var(--t-accent2); }
.pw { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pw .w { font-family: var(--font-d); font-size: 22px; letter-spacing: .12em; }
.safety li { margin-bottom: 6px; }

.stage-row { display: grid; grid-template-columns: 40px 1fr; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--t-line); }
.stage-row .num { width: 40px; height: 40px; border-radius: 50%; background: var(--t-surface); display: grid; place-items: center; font-family: var(--font-d); font-weight: 700; }
.stage-row .r { font-size: 14px; color: var(--t-muted); }
.stage-row .g { font-weight: 800; font-size: 17px; }
.stage-row .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.stage-row .acts button { font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: var(--t-surface); }

/* маршрут */
.route svg { width: 100%; height: auto; display: block; }
.route .path { fill: none; stroke: var(--t-line); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 1 14; }
.route .path-done { fill: none; stroke: var(--t-accent2); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 1 14; }
.route .stop circle { fill: var(--t-surface); stroke: var(--t-line); stroke-width: 3; }
.route .stop.done circle { fill: var(--t-accent2); stroke: var(--t-accent2); }
.route .stop.cur circle { fill: var(--t-accent); stroke: var(--t-ink); stroke-width: 3; }
.route .stop.fin circle { fill: var(--t-bg); stroke: var(--t-accent); stroke-width: 4; stroke-dasharray: 5 5; }
.route .stop text.e { font-size: 24px; text-anchor: middle; dominant-baseline: central; }
.route .stop text.l { font-size: 12.5px; text-anchor: middle; fill: var(--t-ink); font-family: var(--font-b); font-weight: 700; }
.route .stop text.n { font-size: 11px; text-anchor: middle; dominant-baseline: central; fill: var(--t-on-accent); font-family: var(--font-d); font-weight: 700; }
.route .stop .badge { fill: var(--t-accent); stroke: none; }

/* ---------- игра ---------- */
.play-top { position: sticky; top: 0; z-index: 10; background: var(--t-bg); padding: 10px 16px 10px; }
.play-top .inner { max-width: 560px; margin: 0 auto; }
.play-top .where { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.play-top .where b { font-family: var(--font-d); font-size: 15px; }
.play-top .where span { font-size: 13px; color: var(--t-muted); white-space: nowrap; }
.dots { display: flex; gap: 5px; margin-top: 8px; }
.dots i { flex: 1; height: 5px; border-radius: 3px; background: var(--t-line); }
.dots i.done { background: var(--t-accent2); }
.dots i.cur { background: var(--t-accent); }

.slots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.slot {
  width: 34px; height: 40px; border-radius: 9px; display: grid; place-items: center;
  font-family: var(--font-d); font-weight: 700; font-size: 18px;
  box-shadow: inset 0 0 0 2px var(--t-line); color: var(--t-ink);
}
.slot.got { background: var(--t-accent2); box-shadow: none; color: var(--t-on-accent2); }
.slot.pre { background: var(--t-surface); box-shadow: none; color: var(--t-muted); }
.slot svg { width: 22px; height: 22px; }
.slot.pop { animation: pop .6s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes pop { 0% { transform: scale(.2) rotate(-20deg); } 100% { transform: scale(1) rotate(0); } }

.say {
  position: relative; padding: 18px 18px 18px 20px; border-radius: 20px; background: var(--t-surface);
  font-size: 19px; line-height: 1.5;
}
.say::before { content: ''; position: absolute; left: 0; top: 18px; bottom: 18px; width: 5px; border-radius: 0 4px 4px 0; background: var(--t-accent); }
.say .who { display: block; font-size: 13px; font-weight: 800; color: var(--t-accent); margin-bottom: 6px; font-family: var(--font-b); }
.say p:last-child { margin-bottom: 0; }

.trial h2 { font-size: 22px; margin: 4px 0 6px; }
.trial .sh { color: var(--t-muted); margin-bottom: 10px; }
.trial ol { padding-left: 22px; margin: 8px 0 12px; }
.trial ol li { margin-bottom: 8px; }
.trial .tip { font-size: 15px; padding: 10px 14px; border-radius: 14px; background: var(--t-surface); margin-top: 8px; }
.trial .tip b { color: var(--t-accent2); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 2px; }
.tool-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 16px; border-radius: 14px; background: var(--t-accent2); color: var(--t-on-accent2); font-weight: 800; }
.tool-btn.alt { background: var(--t-surface); color: var(--t-ink); }

.qz { background: var(--t-surface); border-radius: 18px; padding: 14px 16px; margin-top: 10px; }
.qz .q { font-weight: 800; font-size: 17px; margin-bottom: 8px; }
.qz .opts { display: grid; gap: 6px; }
.qz .opts button { text-align: left; padding: 10px 12px; border-radius: 12px; box-shadow: inset 0 0 0 2px var(--t-line); font-weight: 700; }
.qz .opts button.ok { background: var(--t-accent2); color: var(--t-on-accent2); box-shadow: none; }
.qz .opts button.no { opacity: .45; }
.qz .fact { font-size: 14px; color: var(--t-muted); margin-top: 8px; }
.reveal { margin-top: 8px; }
.reveal > button { font-weight: 800; color: var(--t-accent2); text-decoration: underline; text-underline-offset: 3px; padding: 6px 0; }
.reveal .body { margin-top: 6px; padding: 10px 14px; border-radius: 12px; background: var(--t-bg); box-shadow: inset 0 0 0 2px var(--t-line); }

.clue {
  border-radius: 24px; padding: 22px 20px; text-align: center;
  background: var(--t-accent); color: var(--t-on-accent);
}
.clue .lbl { font-size: 13px; font-weight: 800; opacity: .8; }
.clue .txt { font-size: 21px; line-height: 1.45; margin-top: 10px; white-space: pre-line; font-weight: 700; }
.clue .big-emo { font-size: 84px; line-height: 1.1; margin: 8px 0; }
.clue .code { font-family: var(--font-d); font-size: 26px; letter-spacing: .14em; margin: 14px 0 8px; word-break: break-word; line-height: 1.35; }
.clue .key { font-size: 15px; opacity: .9; }
.alpha { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; margin-top: 12px; font-size: 12px; }
.alpha span { background: rgba(255,255,255,.18); border-radius: 6px; padding: 3px 0; line-height: 1.15; }
.alpha span b { display: block; font-size: 14px; }
.clue .letters { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
.clue .letters span { width: 40px; height: 46px; border-radius: 10px; background: rgba(255,255,255,.2); display: grid; place-items: center; font-family: var(--font-d); font-size: 22px; font-weight: 700; }
.clue-acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
.answer { background: var(--t-surface); border-radius: 16px; padding: 12px 16px; font-size: 15px; }
.answer b { font-family: var(--font-d); letter-spacing: .06em; }

.found-card { text-align: center; padding: 26px 18px; border-radius: 24px; background: var(--t-surface); }
.found-card .big { width: 120px; height: 140px; margin: 10px auto; border-radius: 18px; display: grid; place-items: center; background: var(--t-accent2); color: var(--t-on-accent2); font-family: var(--font-d); font-size: 64px; font-weight: 800; transform: rotate(-4deg); animation: pop .7s cubic-bezier(.2, 1.6, .4, 1); }
.found-card .big svg { width: 70px; height: 70px; }

/* замок */
.lock { text-align: center; }
.lock .word { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 18px 0; }
.lock .cell { width: 42px; height: 52px; border-radius: 12px; display: grid; place-items: center; font-family: var(--font-d); font-size: 24px; font-weight: 800; box-shadow: inset 0 0 0 3px var(--t-line); }
.lock .cell.fixed { background: var(--t-surface); box-shadow: none; color: var(--t-muted); }
.lock .cell.filled { background: var(--t-accent2); color: var(--t-on-accent2); box-shadow: none; }
.lock .cell.next { box-shadow: inset 0 0 0 3px var(--t-accent); }
.lock .cell svg { width: 28px; height: 28px; }
.lock .pool { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.lock .pool button { width: 52px; height: 56px; border-radius: 14px; background: var(--t-surface); font-family: var(--font-d); font-size: 24px; font-weight: 800; display: grid; place-items: center; }
.lock .pool button[disabled] { opacity: .2; }
.lock .pool button svg { width: 30px; height: 30px; }
.lock.shake .word { animation: shake .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.lock .room-hint { font-size: 11px; color: var(--t-muted); margin-top: 2px; }
.chest { font-size: 110px; line-height: 1; margin: 20px 0 6px; transition: transform .15s; }
.chest.tap { transform: scale(1.12) rotate(-6deg); }

.cert {
  position: relative; border-radius: 22px; padding: 26px 20px 22px; text-align: center; overflow: hidden;
  background: var(--t-surface); box-shadow: inset 0 0 0 3px var(--t-accent2);
}
.cert::before { content: ''; position: absolute; inset: 9px; border-radius: 15px; border: 2px dashed var(--t-line); pointer-events: none; }
.cert .e { font-size: 46px; }
.cert .ct { font-family: var(--font-d); font-size: 15px; color: var(--t-accent2); margin-top: 6px; }
.cert .nm { font-family: var(--font-d); font-size: 30px; font-weight: 800; margin: 12px 0 2px; word-break: break-word; }
.cert .ti { font-weight: 800; color: var(--t-accent); font-size: 18px; }
.cert .tx { font-size: 15px; margin-top: 10px; color: var(--t-muted); }
.cert .dt { font-size: 12px; color: var(--t-muted); margin-top: 12px; }

/* ---------- шторка инструментов ---------- */
.sheet-back { position: fixed; inset: 0; background: rgba(8, 6, 20, .55); z-index: 40; animation: fade .2s; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 92vh; overflow: auto;
  border-radius: 24px 24px 0 0; padding: 10px 18px calc(24px + var(--safe-b));
  background: var(--t-bg, var(--bg)); color: var(--t-ink, var(--ink));
  animation: up .25s cubic-bezier(.2, .9, .3, 1);
}
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--t-line, var(--line)); margin: 0 auto 14px; }
.sheet .inner { max-width: 520px; margin: 0 auto; }
.sheet h2 { margin-bottom: 12px; }
@keyframes up { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }

.timer { display: grid; place-items: center; margin: 10px 0 16px; }
.timer svg { width: 220px; height: 220px; }
.timer .ring-bg { fill: none; stroke: var(--t-surface); stroke-width: 16; }
.timer .ring { fill: none; stroke: var(--t-accent); stroke-width: 16; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .25s linear; }
.timer .t { font-family: var(--font-d); font-size: 46px; font-weight: 800; fill: var(--t-ink); text-anchor: middle; dominant-baseline: central; }
.timer.end .ring { stroke: var(--t-accent2); }

.bigcard {
  min-height: 210px; border-radius: 24px; display: grid; place-items: center; text-align: center; padding: 24px;
  background: var(--t-accent); color: var(--t-on-accent); font-family: var(--font-d); font-size: 30px; font-weight: 800; line-height: 1.2;
}
.bigcard.cover { background: var(--t-surface); color: var(--t-muted); font-family: var(--font-b); font-size: 18px; font-weight: 700; }
.spin-res { min-height: 200px; display: grid; place-items: center; text-align: center; border-radius: 24px; padding: 20px; background: var(--t-surface); }
.spin-res .limb { font-family: var(--font-d); font-size: 22px; font-weight: 700; }
.spin-res .col { width: 110px; height: 110px; border-radius: 50%; margin: 14px auto 6px; transition: background .2s; }
.spin-res .cn { font-weight: 800; font-size: 20px; }
.spinning .col { animation: wob .12s infinite alternate; }
@keyframes wob { to { transform: scale(.9); } }
.music-viz { display: flex; gap: 6px; justify-content: center; align-items: flex-end; height: 120px; margin: 10px 0 18px; }
.music-viz i { width: 16px; border-radius: 8px; background: var(--t-accent); height: 20%; }
.music-viz.on i { animation: eq .5s infinite alternate ease-in-out; }
.music-viz.on i:nth-child(2) { animation-delay: .1s; } .music-viz.on i:nth-child(3) { animation-delay: .25s; }
.music-viz.on i:nth-child(4) { animation-delay: .05s; } .music-viz.on i:nth-child(5) { animation-delay: .3s; }
.music-viz.on i:nth-child(6) { animation-delay: .15s; } .music-viz.on i:nth-child(7) { animation-delay: .2s; }
@keyframes eq { from { height: 15%; } to { height: 100%; } }
.ktable { font-size: 15px; columns: 1; }
.ktable div { padding: 4px 0; border-bottom: 1px solid var(--t-line, var(--line)); }
.ktable div.hl { color: var(--t-accent2); font-weight: 800; }
.roles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.roles-grid button { min-height: 72px; border-radius: 16px; background: var(--t-surface); font-weight: 800; padding: 8px; }
.roles-grid button.seen { opacity: .4; }

.kidview { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 28px; text-align: center; background: var(--t-accent); color: var(--t-on-accent); animation: fade .2s; }
.kidview .in { max-width: 520px; }
.kidview .txt { font-size: 28px; line-height: 1.4; font-weight: 800; white-space: pre-line; }
.kidview .code { font-family: var(--font-d); font-size: 40px; letter-spacing: .14em; word-break: break-word; }
.kidview .emo { font-size: 140px; }
.kidview .close { position: absolute; top: 14px; right: 16px; font-size: 15px; font-weight: 800; padding: 8px 14px; border-radius: 999px; background: rgba(0,0,0,.18); color: inherit; }

#toast { position: fixed; left: 50%; bottom: calc(96px + var(--safe-b)); transform: translateX(-50%); z-index: 70; background: #221E46; color: #fff; padding: 10px 18px; border-radius: 14px; font-weight: 700; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; text-align: center; }
#toast.on { opacity: 1; }
canvas.confetti { position: fixed; inset: 0; z-index: 50; pointer-events: none; }

.pick-list { display: grid; gap: 8px; }
.pick-list button { text-align: left; padding: 12px 14px; border-radius: 14px; background: var(--t-surface); }
.pick-list button b { display: block; }
.pick-list button span { font-size: 14px; color: var(--t-muted); }
.pick-list button.cur { box-shadow: inset 0 0 0 2px var(--t-accent); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
@media (min-width: 420px) { .rooms { grid-template-columns: repeat(3, 1fr); } }

.themed.sheetwrap { min-height: 0; background: none; }
.themed .sheet .btn.ghost { background: var(--t-surface); color: var(--t-ink); }
.kidview.themed { background: var(--t-accent); color: var(--t-on-accent); min-height: 0; }

.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 10px 0 0; font-size: 14.5px; }
.facts dt { color: var(--t-muted); }
.facts dd { margin: 0; min-width: 0; }
.stage-row .reveal > button { font-size: 15px; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; background: var(--surface2); padding: 5px; border-radius: 14px; }
.seg button { min-height: 42px; border-radius: 10px; font-weight: 800; color: var(--muted); }
.seg button[aria-checked="true"] { background: var(--primary); color: var(--primary-ink); }
.themed .link { color: var(--t-accent); font-weight: 700; font-size: 15px; }

.topline { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.topline .steps { flex: 1; margin-bottom: 0; }
.q-head .topline { justify-content: space-between; margin-bottom: 0; }
.q-head .topline .home-btn { order: 2; }
.home-btn { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface2); color: var(--ink); }
.themed .home-btn { background: var(--t-surface); color: var(--t-ink); }
.play-top .where { align-items: center; }
.play-top .home-btn { width: 36px; height: 36px; border-radius: 10px; }

.check .ct span { white-space: pre-line; }
.pick-list button[disabled] { opacity: .45; }
.route .stop { cursor: pointer; }
#toast { white-space: normal; line-height: 1.35; }
#toast { width: max-content; max-width: min(90vw, 380px); }

</style>
</head>

<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
window.QD = {"themes":[{"id":"pirates","title":"Сокровище капитана Пряника","tagline":"Карта порвана, сундук спрятан, попугай молчит — свистать всех наверх!","emoji":"🦜","bands":["b3","b6","b10"],"palette":{"bg":"#0B2233","surface":"#15354A","ink":"#F6EEDD","accent":"#F5B83D","accent2":"#FF7A59"},"artifact":"Бортовой журнал","fragment":{"one":"обрывок карты","many":"обрывки карты","gen":"обрывков карты"},"parent_role":{"name":"Боцман Компот","how":"Говорите хрипловатым басом, щурьте один глаз и почаще хлопайте себя по коленке. Коронная фраза: «Тысяча медуз, вот это команда!» Реквизит — полотенце на плече и свёрнутый в трубку журнал вместо подзорной трубы."},"kid_titles":["Гроза семи морей","Мастер морских узлов","Зоркий Глаз корабля","Ас штурвала","Звезда палубы","Капитан Смелое Сердце","Знаток морских карт","Душа команды","Чемпион по поиску кладов","Штурман-следопыт"],"room_names":{"living":"Кают-компания","kids":"Кубрик юнг","kitchen":"Камбуз","bedroom":"Каюта капитана","hall":"Главная палуба","bath":"Лагуна русалок","study":"Штурманская"},"costumes":[{"who":"kids","name":"Пиратская бандана","how":"Возьмите платок или старую футболку, сложите треугольником и завяжите на голове узлом на затылке — не на шее. Футболку можно надеть на голову горловиной, а рукава завязать сзади.","minutes":2,"min_band":"b3"},{"who":"kids","name":"Повязка на глаз","how":"Вырежьте кружок из тёмной бумаги, приклейте скотчем к ободку для волос и сдвиньте на один глаз. Если мешает бегать — носите на лбу, как настоящий отдыхающий пират.","minutes":3,"min_band":"b3"},{"who":"kids","name":"Подзорная труба","how":"Втулку от бумажных полотенец или свёрнутый в трубку лист закрепите скотчем и обмотайте цветной изолентой полосками.","minutes":2,"min_band":"b1"},{"who":"kids","name":"Тельняшка","how":"На светлую футболку наклейте поперёк полоски синего малярного скотча или изоленты. После игры они легко снимаются.","minutes":5,"min_band":"b3"},{"who":"kids","name":"Пиратский кушак","how":"Обвяжите вокруг талии шарф или пояс от халата, концы заправьте сбоку. За кушак можно засунуть подзорную трубу.","minutes":2,"min_band":"b1"},{"who":"parent","name":"Треуголка Боцмана","how":"Сложите из газетного разворота шапку-кораблик и нарисуйте на ней фломастером якорь.","minutes":3,"min_band":"b1"},{"who":"props","name":"Флаг «Весёлой Камбалы»","how":"Нарисуйте на листе смешную рыбу в треуголке и прикрепите прищепкой к швабре или ручке двери.","minutes":3,"min_band":"b1"},{"who":"props","name":"Сундук для клада","how":"Обувную коробку обклейте полосками коричневой бумаги или скотча, нарисуйте замок и заклёпки фломастером.","minutes":5,"min_band":"b1"}],"atmosphere":["Приглушите верхний свет и оставьте одну настольную лампу — пусть в доме будет «закат над морем».","Включите тихий фон с шумом волн и криками чаек — найдётся в любом музыкальном приложении по запросу «шум моря».","Перед каждым этапом звоните в «рынду»: пара ударов ложкой по кастрюле — и команда в сборе.","Договоритесь отвечать не «да», а «Есть, капитан!» — и смеха станет вдвое больше."],"intro":{"b1":"Йо-хо-хо! {kids}, вы мои юнги! Капитан Пряник спрятал в нашем доме сундук с кладом. Давайте вместе соберём все {fragments} и найдём сундук. Готовы? Скажем громко: «Йо-хо-хо!» Поплыли!","b3":"Йо-хо-хо, {kids}! Я Боцман Компот с корабля «Весёлая Камбала». Давным-давно капитан Пряник спрятал в нашем доме настоящий клад, а карту порвал на кусочки, чтобы её не нашёл хитрый пират Барабулька. Нам нужно собрать все {fragments}. В каждой каюте вас ждёт весёлое испытание, а за ним — подсказка. Соберём карту целиком — и сундук откроется! Свистать всех наверх!","b6":"Свистать всех наверх, {kids}! Я Боцман Компот, и у меня отличные новости. Знаменитый капитан Пряник спрятал свой клад прямо здесь, в нашем доме. Правда, он был очень осторожным капитаном: карту порвал на кусочки и разложил по разным каютам, а каждую охраняет хитрое испытание. Пират Барабулька тоже охотится за кладом, но он путает лево и право, так что шансы у нас отличные. Ваша задача — пройти испытания, собрать все {fragments} и узнать тайный код. В Бортовом журнале всё записано. Поднять якорь!","b10":"Внимание, {kids}! Говорит Боцман Компот, старейший моряк «Весёлой Камбалы» и большой любитель пирожков. Капитан Пряник, гроза всех морей и всех кондитерских, спрятал в этом доме своё главное сокровище. Перед этим он разорвал карту на части, разложил их по каютам и поставил возле каждой испытание — на смекалку, ловкость и чувство юмора. За кладом охотится и пират Барабулька, но он однажды полгода искал собственный корабль, стоя на его палубе. Соберите все {fragments}, разгадайте тайный код и введите его в Бортовой журнал. Поднять якорь, полный вперёд!"},"beats":["Поднять якорь! «Весёлая Камбала» отчаливает, и первая остановка — {room}. Старые моряки говорят, что карта даётся только тем, кто не боится испытаний. Покажите, на что способна команда!","Ох, ну и качка! Волны шлёпают по бортам, а мы швартуемся: перед нами {room}. Боцман чует, что здесь пахнет приключениями (или пирожками). Чтобы плыть дальше, пройдите испытание!","На мачту сел попугай Кекс и закричал: «Кар-р-рта! Кар-р-рта!» Похоже, {room} хранит важную тайну. Но Кекс выдаёт тайны только смельчакам — вперёд, к испытанию!","Тише, юнги! {room} — владения старого краба Клешнюка. Он совсем не злой, просто обожает игры и никого не пропускает без состязания. Сыграем с ним!","На горизонте паруса пирата Барабульки! Он тоже ищет клад, но опять перепутал лево и право. Пока он разворачивается, мы причаливаем: {room}. Скорее проходите испытание!","Опустился туман, такой густой, что Боцман не видит собственного носа. На ощупь мы добрались — вот {room}. Туман рассеется, только если команда справится с испытанием. Вперёд!","Земля! На песке кто-то нарисовал большую стрелку, и она указывает прямо сюда: {room}. Капитан Пряник оставил здесь хитрое испытание — проверим, по зубам ли оно вам!","Из воды выглянула русалка Мидия и пропела: «Кто пройдёт испытание, тот узнает дорогу!» Значит, {room} — место непростое. Покажите русалке настоящую пиратскую смекалку!","Сундук уже совсем близко — Боцман слышит, как звенят монеты (или это урчит у него в животе?). Ещё немного, и вот {room}. Испытание непростое, но вы уже настоящие морские волки. Вперёд!","Вот и последняя бухта: {room}. Здесь капитан Пряник придумал самое хитрое испытание, чтобы клад достался лучшей команде на свете. Свистать всех наверх — за дело!"],"trial_success":["Йо-хо-хо, получилось! Боцман так доволен, что пустился в пляс. Держите подсказку — она укажет, где прячется {fragment}.","Вот это команда! Даже попугай Кекс захлопал крыльями. Слушайте внимательно, куда капитан Пряник спрятал {fragment}.","Тысяча медуз, вы справились! В Бортовом журнале появилась новая запись — в ней подсказка, где искать {fragment}.","Испытание пройдено! Краб Клешнюк одобрительно щёлкает клешнями. Вот подсказка, куда держать курс дальше.","Блестяще! Такую команду не стыдно взять в любое плавание. Слушайте подсказку — {fragment} уже ждёт вас.","Ура юнгам! Ветер наполняет паруса, а у Боцмана для вас подсказка. Слушайте и ищите {fragment}!"],"found":["Есть {fragment}! Скорее в Бортовой журнал его!","Нашли! Боцман чуть не уронил треуголку от радости!","Йо-хо-хо! Ещё один обрывок карты в нашей коллекции!","Вот это глаз-алмаз! Обрывок карты найден!","Ура! Карта всё целее, а клад всё ближе!","Отлично! Попугай Кекс кричит: «Мол-лодцы! Мол-лодцы!»"],"game_flavor":{"bowling":"Флот пирата Барабульки на горизонте! Сбейте пушечным ядром все его корабли — пусть плывут домой чинить паруса.","swamp":"Корабль сел на мель! Переберитесь на берег по камушкам и не намочите ноги — внизу плещутся щекотливые медузы.","magicbag":"В мешке у Боцмана — добыча из трюма. Угадайте на ощупь, что там, не подглядывая!","cinderella":"После шторма в трюме всё перемешалось! Разложите добычу по сундукам, иначе корабль накренится.","repeat":"Пиратская зарядка! Повторяйте за Боцманом всё точь-в-точь — так тренируются лучшие юнги семи морей.","lava":"Вода кишит щекотливыми крабами! Пока Боцман считает, перебирайтесь только по островкам — кто коснётся «воды», того защекочут.","twister":"Морской узел! Ставьте руки и ноги на нужные цвета и держитесь крепко, как канат в шторм.","drawdesc":"Капитан Пряник описал в журнале таинственный остров. Нарисуйте его точно по описанию — вдруг это и есть остров сокровищ?","whatmissing":"Хитрая чайка утащила что-то с палубы! Посмотрите внимательно и скажите, чего не хватает.","chepuha":"Пираты сочиняют морскую байку по кусочку — чем нелепее, тем лучше. Готовую историю Боцман запишет в Бортовой журнал!","crocodile":"На корабле такой шторм, что слов не слышно — только жесты! Покажите слово так, чтобы команда угадала.","puppet":"Пиратский театр! Разыграйте, как капитан Пряник прятал свой клад и как его обхитрил попугай Кекс.","jenga":"Это бочки в трюме. Вытаскивайте по одной так осторожно, чтобы груз не рухнул в качку.","scrabble":"Письмо капитана Пряника промокло и рассыпалось на буквы. Соберите из них слова и спасите послание!","memory":"Капитан Пряник хранил монеты парами. Найдите все пары — и карта покажет путь.","imaginarium":"В трюме нашлись старые картинки из морских путешествий. Угадайте, какую из них загадал рассказчик.","detective":"Кто-то съел все сухари на камбузе! Изучите улики и выясните, какой пират оставил крошки.","danetki":"Боцман знает странную морскую историю. Разгадайте её, задавая вопросы, на которые он ответит только «да» или «нет».","kosoykozel":"Попугай Кекс учит морские скороговорки. Повторите быстро и не сбейтесь — иначе попугай захохочет!","musicpass":"Передавайте по кругу мешочек с пиратскими монетами, пока играет музыка. Музыка стихла — у кого мешочек, тот выполняет задание Боцмана!","puzzle":"Кусочек морской карты разорван на части. Соберите его, и станет ясно, куда плыть дальше!","tower":"Постройте маяк повыше, чтобы корабль не заблудился в темноте. Чем выше маяк — тем ярче путь!","quiz":"Морская викторина Боцмана! Ответьте на вопросы о сказках и мультиках — и попугай откроет следующий отсек.","wordgame":"У пиратов свой тайный язык. Играйте в словесную игру, и пусть ни одно слово не утонет!","mafia":"На корабль пробрались хитрые юнги Барабульки — по ночам они таскают печенье с камбуза. Днём вычислите хитрецов, пока печенье не кончилось!"},"pre_finale":"Все {fragments} собраны! Сложите их по порядку — и карта капитана Пряника откроет тайный код. Введите его в Бортовой журнал, и сундук откроется!","finale":{"young":"Ура! Сундук открыт! Капитан Пряник был бы очень рад: его клад нашла самая смелая и весёлая команда на свете. Попугай Кекс хлопает крыльями, а Боцман Компот сейчас шепнёт вам, где спрятано сокровище. Бегите скорее! Йо-хо-хо, юнги!","older":"Тысяча медуз, вы это сделали! Карта собрана, код разгадан, а пират Барабулька от удивления снял шляпу (правда, надел её задом наперёд). Краб Клешнюк аплодирует клешнями, русалка Мидия поёт в вашу честь, и даже туман разошёлся. Сокровище капитана Пряника достаётся самой отважной команде семи морей. Боцман Компот сейчас откроет главную тайну — где стоит сундук. Полный вперёд за кладом!"},"treasure_ideas":["Шоколадные монеты или печенье в коробке-сундуке","Право выбрать фильм на вечер","Пиратский ужин: домашняя пицца, которую команда украсит сама","Наклейки или маленькая игрушка для каждого юнги","Купон «Боцман выполняет одно желание»"],"passwords":["КОК","КИТ","ЮНГА","КЛАД","МОРЕ","ЯКОРЬ","ПАРУС","ПИРАТ","КОМПАС","СУНДУК","ОСТРОВ","КАПИТАН","ПОПУГАЙ","ШТУРВАЛ","ОСЬМИНОГ","ПАРУСНИК","СОКРОВИЩЕ","КАРАВЕЛЛА","БРИГАНТИНА","ОСЬМИНОЖКА"],"certificate":{"title":"Грамота лучшего кладоискателя","text":"{name} получает почётное звание «{title}» за отвагу, смекалку и умение найти сокровище там, где его никто не ждал. Подпись: Боцман Компот."}},{"id":"space","title":"Тайна планеты Пломбир","tagline":"Робот Бип спрятал звёздные коды — ракета ждёт свой экипаж!","emoji":"🚀","bands":["b3","b6","b10"],"palette":{"bg":"#0D0B2A","surface":"#1E1A4A","ink":"#EEF0FF","accent":"#4FD8FF","accent2":"#FF79D2"},"artifact":"Бортовой компьютер","fragment":{"one":"звёздный код","many":"звёздные коды","gen":"звёздных кодов"},"parent_role":{"name":"Командир Орбиткин","how":"Говорите как по рации: в начале «Приём, приём!», в конце фразы — «пшшш». Коронная фраза: «Ключ на старт — поехали!» Реквизит — дуршлаг на голове вместо шлема и половник вместо микрофона."},"kid_titles":["Звезда экипажа","Ас невесомости","Мастер стыковки","Капитан Млечного Пути","Гений бортового компьютера","Друг всех инопланетян","Зоркий Телескоп","Чемпион орбиты","Штурман звёздных трасс","Сердце экипажа"],"room_names":{"living":"Главный модуль","kids":"Отсек экипажа","kitchen":"Космическая столовая","bedroom":"Каюта сна","hall":"Стыковочный шлюз","bath":"Водный модуль","study":"Центр управления"},"costumes":[{"who":"kids","name":"Антенны инопланетянина","how":"К ободку для волос примотайте скотчем две коктейльные трубочки или скрученные полоски бумаги, на концы — шарики из фольги размером со сливу.","minutes":3,"min_band":"b3"},{"who":"kids","name":"Нашивка экипажа","how":"На кусок малярного скотча нарисуйте звезду и напишите имя космонавта, наклейте на футболку слева на груди.","minutes":2,"min_band":"b1"},{"who":"kids","name":"Реактивный ранец","how":"Две пустые пластиковые бутылки примотайте скотчем к детскому рюкзаку, из горлышек выпустите «пламя» — полоски красной и оранжевой бумаги.","minutes":5,"min_band":"b3"},{"who":"kids","name":"Космические перчатки","how":"Наденьте зимние или садовые перчатки и обмотайте запястья полоской фольги — получатся герметичные манжеты.","minutes":2,"min_band":"b3"},{"who":"parent","name":"Шлем Командира","how":"Наденьте на голову пластиковый дуршлаг — это шлем со встроенной вентиляцией. Можно приклеить к нему бумажную звезду.","minutes":1,"min_band":"b1"},{"who":"props","name":"Пульт управления","how":"На крышку коробки наклейте крышки от бутылок как кнопки и нарисуйте фломастером экраны и рычаги. Крышки приклейте надёжно — они мелкие.","minutes":5,"min_band":"b3"},{"who":"props","name":"Звёздное небо","how":"Накройте включённый фонарик (или фонарик телефона) металлическим дуршлагом и выключите свет — на потолке появятся звёзды.","minutes":2,"min_band":"b1"}],"atmosphere":["Приглушите свет (не в полную темноту — дети будут бегать) и сделайте «звёздное небо»: фонарик под дуршлагом рисует звёзды на потолке.","Включите тихую электронную «космическую» музыку или звуки космоса — ищите по запросу «звуки космоса».","Перед каждым этапом устраивайте обратный отсчёт хором: «Три, два, один — пуск!»","Говорите по «рации», сложив ладони у рта, и отвечайте друг другу «Принято!»"],"intro":{"b1":"Пшшш, приём! {kids}, вы мои космонавты! Наша ракета летит на планету Пломбир. Там нас ждёт подарок. Надо найти все {fragments}. Наденем шлемы и сосчитаем: три, два, один — полетели! Бип-бип!","b3":"Приём, приём! Говорит Командир Орбиткин. {kids}, вы зачислены в экипаж ракеты «Звёздная Ромашка»! Наш друг робот Бип улетел на планету Пломбир и оставил там подарок для самых смелых космонавтов. Но подарок закрыт на звёздный замок. Бип спрятал ключики к нему по всей нашей ракете. Пройдём весёлые испытания, соберём все {fragments} — и замок откроется! Ключ на старт!","b6":"Приём, приём, экипаж! На связи Командир Орбиткин. {kids}, вам доверена важнейшая миссия. Робот Бип, наш самый умный и самый рассеянный помощник, улетел на планету Пломбир и оставил там подарок для лучших космонавтов. Чтобы приземлиться, нужен код посадки. Бип разбил его на части и спрятал по всей ракете, а каждую часть сторожит испытание. По пути вас ждут невесомость, кометы и один очень любопытный инопланетянин. Соберите все {fragments}, сложите код и введите его в Бортовой компьютер. Ключ на старт — поехали!","b10":"Внимание, экипаж ракеты «Звёздная Ромашка»! Говорит Командир Орбиткин, пшшш. {kids}, вас отобрали из миллиона кандидатов (остальные проспали). Задание секретное: долететь до планеты Пломбир, где хранится подарок для лучших космонавтов галактики. Беда в том, что код посадки знает только робот Бип, а Бип — гений с памятью золотой рыбки. Чтобы ничего не забыть, он разбил код на части и спрятал по всей ракете. Каждую часть охраняет испытание на ловкость, логику и выдержку. Соберите все {fragments}, сложите код и введите его в Бортовой компьютер. Обратный отсчёт: три, два, один — поехали!"},"beats":["Ключ на старт! Ракета «Звёздная Ромашка» отрывается от Земли, и первая станция на маршруте — {room}. Бортовой компьютер мигает: проверка экипажа. Покажите, что вы готовы к полёту!","Внимание, невесомость! Летают ложки, летают носки, даже Командир чуть не уплыл. Мы пристыковались: {room}. Чтобы включить гравитацию обратно, пройдите испытание!","Получен сигнал: «Бип-бип-бип!» Это робот Бип передаёт привет. Сигнал идёт отсюда: {room}. Пройдите испытание — и Бип пришлёт подсказку!","Мимо пролетает комета Марго с длинным блестящим хвостом. Она согласна осветить путь, но сначала — весёлое состязание. Мы на месте: {room}. Вперёд!","Осторожно, метеоритный дождь! Правда, метеориты здесь из зефира, так что не страшно, а вкусно. Укрылись — и вот {room}. Чтобы лететь дальше, пройдите испытание!","На связи инопланетянин Шуршик с планеты Огурчик-7! У него три глаза, и все три мечтают посмотреть на ваше испытание. Он ждёт нас: {room}. Не подведём!","Бортовой компьютер чихнул и перепутал все кнопки. Починить его можно только смекалкой экипажа, а ближайшая ремонтная станция — {room}. За дело, космонавты!","Пролетаем мимо Чёрной Дыры, но она совсем крошечная и засасывает только фантики. Курс проложен: {room}. Здесь нас ждёт новое испытание — полный вперёд!","Планета Пломбир уже видна в иллюминатор — белая, круглая и, кажется, немножко тает. Последние манёвры, и вот {room}. Испытание серьёзное, но экипаж у нас лучший в галактике!","Финальная орбита! {room} — последняя станция перед посадкой на планету Пломбир. Робот Бип приготовил здесь самое хитрое испытание. Экипаж, приготовиться — поехали!"],"trial_success":["Миссия выполнена! Командир ставит экипажу пятёрку с плюсом. Бортовой компьютер принял подсказку — слушайте, где прячется {fragment}.","Бип-бип-ура! Робот Бип танцует от радости и передаёт подсказку. Где же {fragment}? Слушайте внимательно!","Отличная работа, экипаж! Гравитация в норме, настроение — космическое. Получена подсказка, где спрятан {fragment}.","Комета Марго в восторге и машет хвостом! Она подсвечивает путь к тайнику — слушайте подсказку.","Вот это скорость света! Шуршик хлопает всеми тремя ладошками. Принимайте подсказку, где вас ждёт {fragment}.","Испытание пройдено! В Центре управления все встали и аплодируют. Внимание на экран — подсказка уже здесь."],"found":["Сигнал пойман! {fragment} у нас!","Есть контакт! Ещё один звёздный код найден!","Бип-бип! Бортовой компьютер записал находку!","Ура, экипаж! Звёздный код на борту!","Вот это зоркость! Даже телескоп не нашёл бы быстрее!","Отлично! Планета Пломбир всё ближе!"],"game_flavor":{"bowling":"Рой астероидов на пути! Сбейте их метеоритом-мячом, чтобы ракета пролетела без помех.","swamp":"Мы высадились на планету из фиолетового желе. Перейдите по твёрдым кратерам и не увязните!","magicbag":"В этом контейнере — образцы с неизвестной планеты. Определите на ощупь, что нашли космонавты!","cinderella":"В невесомости весь груз перемешался! Рассортируйте его по ящикам, чтобы ракета не потеряла равновесие.","repeat":"Космическая тренировка! Повторяйте за Командиром движения, как настоящие космонавты на подготовке.","lava":"Поверхность планеты раскалилась от звезды! Когда Командир крикнет «Жарко!», стойте только на посадочных площадках.","twister":"Тренировка в невесомости: руки и ноги на нужные цвета — и держитесь, чтобы не уплыть!","drawdesc":"Шуршик рассказывает, как выглядит его друг с соседней планеты. Нарисуйте инопланетянина точно по описанию!","whatmissing":"Кто-то утащил вещь из грузового отсека! Посмотрите внимательно и скажите, чего не хватает. Наверное, опять Шуршик…","chepuha":"Сочиняем бортовой дневник по очереди! Каждый пишет кусочек, не видя остального, — получится самый странный полёт в истории.","crocodile":"Связь пропала, звука нет! Объясните слово жестами, как космонавты через иллюминатор.","puppet":"Покажите спектакль о первой встрече с инопланетянами. Пусть они будут дружелюбными и очень смешными!","jenga":"Это топливные блоки ракеты. Вынимайте по одному, чтобы башня реактора не развалилась!","scrabble":"Сигнал из космоса пришёл перепутанными буквами. Составьте из них слова и расшифруйте послание!","memory":"Звёзды в созвездиях живут парами. Найдите все пары — и звёздная карта засияет!","imaginarium":"Телескоп сделал загадочные снимки. Угадайте, какую картинку загадал рассказчик.","detective":"С космической кухни пропал последний тюбик с борщом! Изучите улики и выясните, кто его съел.","danetki":"В бортовом журнале описан странный случай на орбите. Разгадайте его вопросами, на которые Командир отвечает только «да» или «нет».","kosoykozel":"Проверка речевого модуля! Повторяйте космические скороговорки без запинки, иначе бортовой компьютер зависнет.","musicpass":"Передавайте по кругу «звёздный кристалл», пока играет космическая музыка. Музыка стихла — у кого кристалл, тот выполняет задание!","puzzle":"Карта галактики рассыпалась на кусочки! Соберите её, чтобы проложить курс.","tower":"Постройте антенну связи как можно выше — чем выше, тем лучше слышно робота Бипа!","quiz":"Экзамен для космонавтов! Ответьте на вопросы о сказках и мультиках — их знают даже на других планетах.","wordgame":"Учим инопланетный язык! Играйте в словесную игру и пополните словарь Шуршика.","mafia":"На станцию пробрались космические шутники: по ночам они перекрашивают скафандры в горошек. Днём экипаж вычисляет, кто это делает!"},"pre_finale":"Все {fragments} собраны! Сложите их по порядку — и вы получите код посадки на планету Пломбир. Введите его в Бортовой компьютер!","finale":{"young":"Ура! Посадка прошла мягко! Планета Пломбир встречает героев: робот Бип пляшет, Шуршик машет всеми ручками, а комета Марго светит ярко-ярко. На планете спрятан подарок для экипажа. Командир Орбиткин сейчас скажет, где он лежит!","older":"Посадка разрешена! «Звёздная Ромашка» мягко опустилась на планету Пломбир, и встречать её вышли все местные жители — три снеговика и один очень вежливый вафельный стаканчик. Робот Бип докладывает: «Миссия выполнена на сто процентов!» Шуршик уже просится к вам в экипаж. А главный подарок планеты ждёт лучших космонавтов галактики. Командир Орбиткин сейчас назовёт координаты тайника!"},"treasure_ideas":["Мороженое с посыпкой — подарок с планеты Пломбир","Вечер звёздного неба: фонарик под дуршлагом и мультфильм про космос","Право лечь спать на 15 минут позже","Светящиеся наклейки-звёзды на потолок","Космический ужин «из тюбиков»: йогурт, пюре или соус в пакетиках"],"passwords":["ЛУЧ","МИР","ЛУНА","МАРС","РОБОТ","ЗЕМЛЯ","КОМЕТА","РАКЕТА","ОРБИТА","ПЛАНЕТА","СПУТНИК","ЛУНОХОД","АСТЕРОИД","ТЕЛЕСКОП","ГАЛАКТИКА","КОСМОНАВТ","КОСМОНАВТЫ","ПЛАНЕТОХОД"],"certificate":{"title":"Удостоверение космонавта","text":"Удостоверение выдано: {name}. Звание: «{title}». Вручено за смелость, смекалку и мягкую посадку на планету Пломбир. Командир Орбиткин, Центр управления полётами."}},{"id":"detective","title":"Дело о пропавшем торте","tagline":"Торт исчез, на усах у кота крем — агентство «Ватрушка» берётся за дело!","emoji":"🔍","bands":["b3","b6","b10","b13"],"palette":{"bg":"#1E1915","surface":"#302821","ink":"#F4EBDC","accent":"#E9B949","accent2":"#7FB3E0"},"artifact":"Блокнот сыщика","fragment":{"one":"улика","many":"улики","gen":"улик"},"parent_role":{"name":"Инспектор Пончиков","how":"Говорите медленно и задумчиво, поглаживайте подбородок и время от времени подозрительно прищуривайтесь на кота (или на холодильник). Коронная фраза: «Так-так-так, это уже интересно!» Реквизит — шляпа или кепка, плед на плечах и любая кружка как лупа."},"kid_titles":["Гроза загадок","Мастер дедукции","Зоркий Глаз агентства","Ас лупы","Знаток следов","Звезда сыска","Гений улик","Чемпион по разгадкам","Супер-сыщик","Сердце агентства «Ватрушка»"],"room_names":{"living":"Зал совещаний","kids":"Комната свидетелей","kitchen":"Место происшествия","bedroom":"Комната снов","hall":"Проходной двор","bath":"Лаборатория пузырей","study":"Архив"},"costumes":[{"who":"kids","name":"Шляпа сыщика","how":"Подойдёт любая кепка, панама или шапка-кораблик из газеты. За ободок можно заткнуть бумажное перо или карточку «Пресса».","minutes":2,"min_band":"b1"},{"who":"kids","name":"Лупа","how":"Обведите на картоне стакан, вырежьте кольцо и приклейте скотчем полоску картона как ручку. Стекла не нужно — сыщик и так всё видит.","minutes":4,"min_band":"b3"},{"who":"kids","name":"Плащ детектива","how":"Старая рубашка или куртка взрослого с подвёрнутыми рукавами — готовый плащ. Поднимите воротник для солидности.","minutes":2,"min_band":"b3"},{"who":"kids","name":"Усы на палочке","how":"Нарисуйте и вырежьте из бумаги пышные усы, приклейте скотчем к коктейльной трубочке и держите у лица, как маску.","minutes":3,"min_band":"b3"},{"who":"kids","name":"Значок агентства","how":"Вырежьте из картона круг, обклейте фольгой, напишите «Ватрушка» и прикрепите к одежде малярным скотчем.","minutes":3,"min_band":"b1"},{"who":"parent","name":"Плащ Инспектора","how":"Накиньте на плечи плед или длинный шарф, наденьте шляпу или кепку козырьком назад, в нагрудный карман — карандаш.","minutes":1,"min_band":"b1"},{"who":"props","name":"Табличка «Идёт расследование»","how":"Напишите крупно на листе «Тихо! Идёт расследование!» и прикрепите к двери малярным скотчем.","minutes":2,"min_band":"b1"}],"atmosphere":["Приглушите свет и дайте сыщикам фонарики — осматривать места с фонариком вдвое интереснее.","Включите негромкий джаз или «шпионский» саксофон — ищите по запросу «детективный джаз».","Каждую находку торжественно записывайте в бумажный «протокол» — дети обожают диктовать.","Говорите «Так-так-так…» и делайте драматическую паузу перед каждой подсказкой."],"intro":{"b1":"Ой-ой! {kids}, пропал вкусный торт! Кто же его спрятал? Мы с вами сыщики. Будем искать все {fragments}. Найдём их — найдём и торт! Возьмём лупу и посмотрим: где же он? Ищем!","b3":"Так-так-так! {kids}, у нас срочное дело! Я Инспектор Пончиков из детективного агентства «Ватрушка». Сегодня утром пропал торт «Облачко» — пышный, с вишенкой сверху. Кто его спрятал? Кот Пирожок? Мышонок Сырник? А может, рассеянный повар Шпинат? Тот, кто унёс торт, оставил по всему дому следы. Пройдём испытания и соберём все {fragments} — тогда разгадаем тайну и найдём торт! Берите лупы — за работу!","b6":"Так-так-так, это уже интересно! {kids}, агентство «Ватрушка» открывает новое дело. Сегодня с праздничного стола исчез торт «Облачко» — три этажа крема и вишенка на макушке. Под подозрением трое: кот Пирожок, который любит всё пушистое, мышонок Сырник, который любит всё сладкое, и повар Шпинат, который вообще всё забывает. Но настоящие сыщики не гадают, а ищут доказательства. По дому спрятаны {fragments}, и каждую сторожит испытание. Соберите их все, разгадайте код в Блокноте сыщика — и тайна торта будет раскрыта!","b10":"Внимание, агенты! Инспектор Пончиков, лучший нос агентства «Ватрушка», открывает дело номер ноль-ноль-торт. Сегодня в полдень из дома бесследно исчез торт «Облачко». Ну, почти бесследно: в коридоре крошки, на ручке двери крем, а у кота Пирожка подозрительно довольная морда. Мышонок Сырник утверждает, что сидит на диете, а повар Шпинат не помнит даже, где оставил колпак. {kids}, следствие поручено вам. По дому разложены {fragments}, каждую охраняет испытание на смекалку и наблюдательность. Соберите все, сложите код и введите его в Блокнот сыщика. Помните: сыщик не торопится с выводами… но и торт ждать не будет!"},"beats":["Начинаем расследование! Первое место для осмотра — {room}. Инспектор уже заметил здесь что-то подозрительное, но, чтобы это разглядеть, нужно пройти испытание. За дело, сыщики!","Так-так-так… Дорожка из крошек ведёт прямо сюда: {room}. Крошки свежие и пахнут ванилью! Пройдите испытание — и улика станет вашей.","Свидетель найден! Кот Пирожок что-то знает, но говорит только «мяу». Он привёл нас сюда: {room}. Пройдите испытание — может, кот разговорится!","Внимание: {room}! Мышонок Сырник клянётся, что весь день ел только морковку. Но почему у него усы в креме? Проверим его рассказ — испытание ждёт!","Повар Шпинат прибежал с криком: «Я вспомнил! Ой, нет, забыл…» Зато он показал, где видел торт в последний раз: {room}. Пройдите испытание, чтобы освежить его память!","На ручке двери — отпечаток пальца в креме! Лупа показывает, что след тянется дальше, и вот {room}. Настоящие сыщики не отступают — вперёд, к испытанию!","Инспектор Пончиков задумчиво жуёт карандаш: версий много, доказательств мало. Значит, ищем дальше, и следующая точка — {room}. Пройдите испытание и раздобудьте новую улику!","Кто-то оставил записку: «Ищите там, где тише всего». Похоже, нам сюда: {room}! Но прежде чем осматривать место, пройдите проверку на смекалку.","Дело почти раскрыто! Улики складываются, как пазл, а в воздухе всё сильнее пахнет кремом. Ещё один осмотр — {room}. Испытание хитрое, но вы уже опытные сыщики!","Решающая проверка! {room} — место, где тайна торта «Облачко» должна раскрыться окончательно. Инспектор так волнуется, что надел шляпу задом наперёд. Последнее испытание — вперёд!"],"trial_success":["Отличная работа, сыщики! Инспектор Пончиков записывает в блокнот: «Команда гениальна». А вот подсказка, где спрятана {fragment}.","Так-так-так, справились! Это уже интересно. Слушайте подсказку — она приведёт прямо к тайнику.","Блестяще! Даже кот Пирожок одобрительно мурлычет. Вот подсказка, где лежит {fragment}.","Испытание пройдено! Агентство «Ватрушка» гордится вами. Внимание, подсказка: где-то рядом ждёт {fragment}.","Великолепно! С такими сыщиками ни одна загадка не устоит. Слушайте, где искать дальше.","Есть! Инспектор на радостях съел бы кусок торта… если бы знал, где он. Вот подсказка — {fragment} уже близко."],"found":["Есть {fragment}! Осторожно, это ценное доказательство!","Нашли! Инспектор Пончиков записывает находку в блокнот.","Ага! Ещё одна улика — тайна всё ближе к разгадке!","Вот это зоркость! Ни одна улика от вас не скроется!","Ура! Дело о торте становится всё яснее!","Отлично! А кот Пирожок почему-то нервно облизывается…"],"game_flavor":{"bowling":"Следственный эксперимент: мог ли кто-то нечаянно сбить коробки с кондитерского склада? Сбейте мячом все «коробки» — и проверим!","swamp":"Пол только что вымыли, ступать можно только по сухим островкам. Пройдите по ним, не оставив ни одного следа!","magicbag":"В мешке — вещи из карманов подозреваемых. Определите на ощупь, что там лежит, — это важные улики!","cinderella":"Улики перепутались! Разложите их по коробкам так, как скажет Инспектор, — иначе следствие запутается.","repeat":"Следственный эксперимент: повторите движения подозреваемого точь-в-точь, чтобы понять, как он нёс торт!","lava":"Пол залит сиропом — прилипнете! Когда Инспектор крикнет «Сироп!», перебирайтесь на сухие островки.","twister":"Проверим, мог ли кто-то дотянуться до торта на верхней полке. Ставьте руки и ноги на нужные цвета!","drawdesc":"Свидетель описывает подозреваемого. Нарисуйте его портрет точно по словам — как настоящий фоторобот!","whatmissing":"Место происшествия изменилось! Посмотрите внимательно и скажите, какая вещь исчезла.","chepuha":"Составим версию происшествия по кусочкам: каждый пишет своё, не подглядывая. Посмотрим, какую историю раскроет агентство!","crocodile":"Свидетель от волнения потерял голос и может только показывать. Угадайте, что он видел!","puppet":"Восстановите сцену с игрушками: как торт мог исчезнуть со стола? Сыграйте свою версию!","jenga":"Это стопка папок с делами. Вынимайте по одной так, чтобы архив не рухнул!","scrabble":"Подозреваемый оставил записку, но буквы перемешались. Составьте из них слова и прочитайте послание!","memory":"Отпечатки пальцев всегда совпадают с хозяином! Найдите все пары одинаковых карточек.","imaginarium":"На столе у Инспектора — загадочные снимки с места событий. Угадайте, какой из них описал рассказчик.","detective":"Ещё одно маленькое дело: пропали тапочки Инспектора! Сопоставьте улики и выясните, где они.","danetki":"Инспектор вспомнил странную историю из старых дел. Раскройте её, задавая вопросы, на которые он отвечает только «да» или «нет».","kosoykozel":"Мышонок Сырник на допросе отвечает только скороговорками! Повторите их быстро и без ошибок.","musicpass":"Передавайте по кругу «вещественное доказательство», пока играет музыка. Стоп — у кого оно в руках, тот выполняет задание Инспектора!","puzzle":"Порванная фотография с места происшествия! Соберите её — и увидите, что на ней.","tower":"Повар Шпинат уверяет, что торт был высотой с башню. Постройте такую же — проверим, правда ли это!","quiz":"Экзамен для сыщиков: вопросы о сказках и мультиках. В каждой сказке ведь тоже есть своя загадка!","wordgame":"Шифровка агентства: играйте в словесную игру и соберите цепочку слов без единой ошибки!","mafia":"Среди гостей затесались хитрые сладкоежки, которые по ночам таскают конфеты. Днём сыщики решают, кто из них хитрец!"},"pre_finale":"Все {fragments} собраны! Сложите их по порядку — получится код, который раскроет дело. Введите его в Блокнот сыщика!","finale":{"young":"Ура! Дело раскрыто! Оказалось, торт никто не крал: повар Шпинат спрятал его как сюрприз для лучших сыщиков, а потом забыл куда. Но вы нашли разгадку! Инспектор Пончиков сейчас скажет, где сюрприз. Бегите!","older":"Дело номер ноль-ноль-торт закрыто! Улики сложились, код разгадан, а виновник найден: это повар Шпинат. Он спрятал торт «Облачко» как сюрприз для самой лучшей команды сыщиков и… тут же забыл куда. Кот Пирожок и мышонок Сырник полностью оправданы (хотя крем на усах всё ещё вызывает вопросы). Награда ждёт героев следствия. Инспектор Пончиков сейчас назовёт место, где спрятан сюрприз!"},"treasure_ideas":["Торт, кекс или маффины — тот самый «пропавший» десерт","Право выбрать мультфильм или семейный детектив на вечер","Блокнот и ручка «настоящего сыщика»","Купон «Печём печенье вместе в выходные»","Купон «Инспектор выполняет одно желание»"],"passwords":["КОД","КОТ","ЛУПА","СЛЕД","ТОРТ","УЛИКА","ТАЙНА","СЫЩИК","ВЕРСИЯ","СЕКРЕТ","ЗАГАДКА","ФОНАРИК","БЛОКНОТ","КАРАНДАШ","РАЗГАДКА","ДЕТЕКТИВ","ИНСПЕКТОР","ПОДСКАЗКА","НАБЛЮДЕНИЕ","МАРМЕЛАДКА"],"certificate":{"title":"Удостоверение детектива","text":"Удостоверение выдано: {name}. Звание: «{title}». За раскрытие дела о пропавшем торте, зоркость и железную логику. Инспектор Пончиков, агентство «Ватрушка»."}},{"id":"magic","title":"Заклинание чародея Шуршуна","tagline":"Сквозняк разметал страницы заклинания — без юных волшебников не обойтись!","emoji":"🪄","bands":["b1","b3","b6","b10"],"palette":{"bg":"#24103D","surface":"#371A5C","ink":"#F7EEFF","accent":"#FFD166","accent2":"#7DF0D5"},"artifact":"Волшебная книга","fragment":{"one":"волшебная страница","many":"волшебные страницы","gen":"волшебных страниц"},"parent_role":{"name":"Чародей Шуршун","how":"Говорите таинственным полушёпотом, плавно водите руками и перед важными словами делайте паузу. Коронная фраза: «Шурум-бурум, магия, работай!» Реквизит — плед вместо мантии и деревянная ложка вместо волшебной палочки."},"kid_titles":["Мастер заклинаний","Звезда волшебной школы","Знаток зелий","Ас волшебной палочки","Гений превращений","Друг всех драконов","Чемпион по чудесам","Искра волшебства","Светлая Голова школы чудес","Сердце Волшебной книги"],"room_names":{"living":"Большой зал чудес","kids":"Комната учеников","kitchen":"Зельеварня","bedroom":"Башня снов","hall":"Зачарованный коридор","bath":"Фонтан желаний","study":"Библиотека заклинаний"},"costumes":[{"who":"kids","name":"Мантия волшебника","how":"Возьмите полотенце или тёмную наволочку и прикрепите двумя прищепками к футболке на плечах — ничего не завязывайте на шее. Можно наклеить звёзды из бумаги.","minutes":2,"min_band":"b3"},{"who":"kids","name":"Волшебная палочка","how":"Плотно сверните лист бумаги в трубочку, обмотайте фольгой или цветным скотчем, а на конец приклейте звёздочку из бумаги.","minutes":3,"min_band":"b1"},{"who":"kids","name":"Колпак звездочёта","how":"Сверните из листа картона или плотной бумаги конус по размеру головы, скрепите скотчем и нарисуйте звёзды и луну. Резинку под подбородок не делайте.","minutes":4,"min_band":"b3"},{"who":"kids","name":"Волшебные браслеты","how":"Оберните запястье свободной полоской фольги — не туго, чтобы рука легко выскальзывала. Браслет «усиливает чары».","minutes":1,"min_band":"b3"},{"who":"parent","name":"Мантия Шуршуна","how":"Накиньте на плечи плед, на голову — любую шапку или полотенце тюрбаном, в руки — деревянную ложку.","minutes":1,"min_band":"b1"},{"who":"props","name":"Котёл для зелий","how":"Пустая холодная кастрюля и деревянная ложка. Внутрь можно положить пару игрушек — «ингредиенты».","minutes":1,"min_band":"b1"},{"who":"props","name":"Хрустальный шар","how":"Поставьте включённый фонарик стеклом вверх и накройте прозрачной миской — шар засветится. Получится и с бутылкой воды на фонарике.","minutes":2,"min_band":"b1"}],"atmosphere":["Приглушите верхний свет и включите гирлянду или ночник — волшебство любит полумрак, но под ногами всё должно быть видно.","Включите тихую сказочную музыку с колокольчиками и арфой — ищите по запросу «волшебная музыка для детей».","Перед каждым этапом звените ложечкой о стакан — это «звон магического колокольчика».","Заклинание дня: все вместе говорят «Шурум-бурум!» и делают взмах палочкой перед каждым испытанием."],"intro":{"b1":"Шурум-бурум! {kids}, я добрый волшебник. Ветер унёс из моей книжки странички. Давайте найдём все {fragments}! Тогда случится чудо и появится сюрприз. Взмахнём ручками: раз, два, три — колдуем!","b3":"Шурум-бурум, здравствуйте, {kids}! Я Чародей Шуршун, хранитель Волшебной книги. В ней записано самое доброе заклинание на свете — «Чудо-Сюрприз». Но вчера озорной сквозняк Фьюить влетел в окно и раскидал по всему дому волшебные странички! Без них заклинание не работает. Давайте пройдём весёлые испытания и соберём все {fragments}. Тогда книга засветится, и чудо обязательно случится! Берите палочки — начинаем!","b6":"Шурум-бурум, юные волшебники! {kids}, я Чародей Шуршун, и мне очень нужна ваша помощь. Триста лет я хранил Волшебную книгу, а в ней — заклинание «Чудо-Сюрприз», которое превращает обычный день в праздник. Но сегодня сквозняк Фьюить, большой любитель пошалить, распахнул окно и разнёс страницы заклинания по всему дому. Теперь каждую страницу охраняет волшебное испытание, а без страниц книга молчит. Соберите все {fragments}, прочитайте тайное слово и введите его в Волшебную книгу. Только тогда заклинание оживёт! Палочки наготове?","b10":"Шурум-бурум и добрый вечер, {kids}! Позвольте представиться: Чародей Шуршун, магистр мелких чудес, обладатель почётной грамоты «За вежливость к драконам». У меня беда. Волшебная книга хранила заклинание «Чудо-Сюрприз», но сквозняк Фьюить, вечный шалун и любитель открытых форточек, разметал его страницы по всему дому. Хуже того: магия обиделась и поставила у каждой страницы испытание. Без смекалки, ловкости и чувства юмора их не пройти. Соберите все {fragments}, сложите тайное слово и введите его в Волшебную книгу. Предупреждаю: сова Ухти будет подсказывать, но говорит она исключительно загадками."},"beats":["Шурум-бурум! Волшебная книга дрогнула и указала первую дорогу: {room}. Говорят, здесь живёт старое доброе волшебство, и оно хочет проверить новых учеников. Пройдите испытание!","Прилетела сова Ухти и ухнула: «Ух-ух, страница близко!» Она кивает в одну сторону, а там — {room}. Пройдите испытание, и сова расскажет больше!","Ой, сквозняк Фьюить! Он закружился вихрем и сдул со стола все колпаки. Вихрь умчался дальше, а нас принесло сюда: {room}. Чтобы успокоить сквозняк, пройдите испытание!","Знакомьтесь: дракончик Чихуля! Когда он волнуется, то чихает мыльными пузырями. Он сторожит вход, а за ним — {room}. Чихуля пропустит только тех, кто пройдёт испытание!","Волшебная книга зашелестела и показала картинку: {room}. Значит, здесь спрятано что-то важное! Но магия любит игры — сначала испытание.","Внимание, ученики! Нас занесло сюда: {room}, а тут всё немножко вверх тормашками, даже тапки разговаривают. Расколдовать это место можно только одним способом — пройти испытание!","Чародей Шуршун сварил зелье-подсказку, но перепутал ложки, и оно запахло клубникой и носками. Зато зелье указывает путь: {room}. Пройдите испытание, пока оно не остыло!","Из волшебного зеркала выглянуло отражение, подмигнуло и прошептало: «{room}». Значит, нам туда! Но сначала — испытание, без него магия не откроется.","Книга становится всё тяжелее — это страницы возвращаются на место! Осталось совсем немного, и дорога ведёт сюда: {room}. Испытание хитрое, но вы уже настоящие волшебники!","Самое волшебное место дома — {room}. Именно сюда сквозняк Фьюить унёс самую главную страницу. Соберите всю магию, что у вас есть, — последнее испытание!"],"trial_success":["Шурум-бурум, получилось! Волшебная книга засияла золотом. Слушайте подсказку — она укажет, где спряталась {fragment}.","Великолепное волшебство! Сова Ухти довольно ухает и шепчет загадку. Слушайте, где ждёт {fragment}.","Вот это магия! Дракончик Чихуля чихнул от восторга целым облаком пузырей. А вот и подсказка к тайнику!","Испытание пройдено! Чародей Шуршун так рад, что колпак у него сам подпрыгнул. Держите подсказку — {fragment} уже близко.","Чудесно! Даже сквозняк Фьюить притих от удивления. Слушайте подсказку внимательно.","Браво, юные волшебники! Магия гордится вами. Подсказка уже светится на странице — где же {fragment}?"],"found":["Есть {fragment}! Книга радостно шелестит!","Нашли! Ещё одна страница вернулась домой!","Шурум-бурум! Заклинание становится всё сильнее!","Вот это чутьё! Страница даже засветилась от радости!","Ура! Сова Ухти хлопает крыльями!","Отлично! Сквозняк Фьюить так и не успел её утащить!"],"game_flavor":{"bowling":"Заколдованные кегли ожили и не дают пройти! Сбейте их волшебным шаром — и заклятие развеется.","swamp":"Перед нами Кисельное болото. Перейдите по волшебным кочкам и не наступите в кисель!","magicbag":"В мешке Чародея лежат волшебные предметы. Угадайте на ощупь, что это, — магия любит смелых!","cinderella":"Ингредиенты для зелья перемешались! Разложите их по котлам, иначе вместо чуда получится компот.","repeat":"Урок взмахов палочкой! Повторяйте за Чародеем каждое движение — так учатся настоящие волшебники.","lava":"Пол превратился в пузырящийся лимонад! Когда Чародей скажет «Буль-буль!», запрыгивайте на волшебные островки.","twister":"Магический узел: руки и ноги на нужные цвета — и держитесь, это укрепляет волшебную силу!","drawdesc":"Сова Ухти описывает волшебное существо, которого никто никогда не видел. Нарисуйте его точно по описанию!","whatmissing":"Сквозняк Фьюить утащил один волшебный предмет! Посмотрите внимательно и скажите, чего не хватает.","chepuha":"Сочиняем волшебную сказку по кусочку, не подглядывая. Чем чуднее — тем сильнее заклинание!","crocodile":"На вас наложено заклинание немоты! Говорить нельзя — показывайте слово жестами, пока чары не спадут.","puppet":"Волшебный театр! Разыграйте с игрушками, как сквозняк Фьюить разметал страницы и как его утихомирили.","jenga":"Это башня волшебника. Вынимайте по одному камешку так, чтобы башня не рухнула!","scrabble":"Буквы заклинания рассыпались! Соберите из них слова — каждое слово возвращает книге силу.","memory":"Волшебные карты прячут пары. Найдите все совпадения — и чары откроются!","imaginarium":"В хрустальном шаре мелькают картинки. Угадайте, какую из них загадал рассказчик.","detective":"Из Зельеварни пропал котелок с какао! Изучите улики и выясните, кто его утащил.","danetki":"Чародей знает волшебную историю-загадку. Разгадайте её, задавая вопросы, на которые он отвечает только «да» или «нет».","kosoykozel":"Заклинания нужно произносить без запинки! Повторите волшебные скороговорки быстро и чётко.","musicpass":"Передавайте по кругу волшебный шар, пока играет музыка. Музыка стихла — шар выдаёт задание тому, у кого он в руках!","puzzle":"Страница с волшебной картинкой порвана на кусочки! Соберите её, чтобы увидеть, куда идти.","tower":"Постройте волшебную башню повыше — чем выше башня, тем дальше видно сове Ухти!","quiz":"Экзамен школы волшебства! Ответьте на вопросы о сказках и мультиках — в них ведь тоже живёт магия.","wordgame":"Слова — это тоже магия! Играйте в словесную игру и сплетите самое длинное заклинание.","mafia":"Среди учеников затесались озорные колдунишки: по ночам они превращают тапки в лягушек. Днём найдите шутников, пока все тапки не заквакали!"},"pre_finale":"Все {fragments} собраны! Сложите их по порядку — и проявится волшебное слово. Произнесите его хором и введите в Волшебную книгу!","finale":{"young":"Шурум-бурум! Книга засияла, и заклинание «Чудо-Сюрприз» сработало! Сова Ухти танцует, а дракончик Чихуля пускает радужные пузыри. Где-то в доме появился волшебный подарок. Чародей Шуршун сейчас шепнёт вам, где он. Ищите скорее!","older":"Шурум-бурум-бах! Страницы вернулись на место, книга вспыхнула золотом, и заклинание «Чудо-Сюрприз» сработало в полную силу. Сквозняк Фьюить признал поражение и обещал впредь сдувать только пылинки. Дракончик Чихуля на радостях чихнул радугой, а сова Ухти впервые в жизни сказала что-то без загадки: «Молодцы!» Чудо уже появилось где-то в доме. Чародей Шуршун сейчас откроет, где его искать!"},"treasure_ideas":["«Волшебное зелье»: какао с зефирками или смузи в красивом стакане","Вечер фокусов: колода карт и пара простых фокусов, которые разучите вместе","Право выбрать сказку и почитать её вместе перед сном","Фонарик для чтения под одеялом","Наклейки со звёздами и волшебными существами"],"passwords":["МАГ","ДАР","ЧУДО","СОВА","МАГИЯ","ЗЕЛЬЕ","МАНТИЯ","ДРАКОН","ПАЛОЧКА","ЧАРОДЕЙ","ЕДИНОРОГ","КОЛПАЧОК","ВОЛШЕБНИК","ЗВЕЗДОЧКА","ЗАКЛИНАНИЕ","ВОЛШЕБСТВО"],"certificate":{"title":"Диплом юного волшебника","text":"Диплом выдан: {name}. Звание: «{title}». За доброе волшебство, смекалку и спасение заклинания «Чудо-Сюрприз». Чародей Шуршун, хранитель Волшебной книги."}},{"id":"dino","title":"Тайна гнезда динозаврика Тяпы","tagline":"Динозаврик Тяпа оставила следы по всему дому — куда они ведут?","emoji":"🦕","bands":["b1","b3","b6","b10"],"palette":{"bg":"#12291A","surface":"#1F3D29","ink":"#EEF6E4","accent":"#A6E35A","accent2":"#FF9F43"},"artifact":"Палеорадар","fragment":{"one":"отпечаток лапы","many":"отпечатки лап","gen":"отпечатков лап"},"parent_role":{"name":"Профессор Окаменелкин","how":"Говорите как восторженный учёный: поправляйте воображаемые очки, всё рассматривайте вплотную и вскрикивайте «Эврика!». Коронная фраза: «Клянусь своими косточками — это открытие века!» Реквизит — панама, кисточка для рисования и рулетка или линейка."},"kid_titles":["Знаток динозавров","Мастер раскопок","Зоркий Глаз экспедиции","Друг всех динозавров","Звезда палеонтологии","Ас следопытства","Чемпион по поиску гнёзд","Смелое Сердце джунглей","Гений окаменелостей","Великий Рык экспедиции"],"room_names":{"living":"Долина гигантов","kids":"Папоротниковый лес","kitchen":"Пещера обедов","bedroom":"Сонная пещера","hall":"Тропа динозавров","bath":"Тёплое озеро","study":"Лаборатория профессора"},"costumes":[{"who":"kids","name":"Хвост динозавра","how":"Длинный носок или старую штанину колготок набейте другими носками и заправьте концом за пояс сзади. Тяните хвост за собой и рычите.","minutes":3,"min_band":"b1"},{"who":"kids","name":"Гребень на спине","how":"Вырежьте из цветной бумаги 5–6 треугольников и наклейте малярным скотчем в ряд на капюшон и спину кофты.","minutes":4,"min_band":"b1"},{"who":"kids","name":"Бинокль исследователя","how":"Склейте скотчем рядом две втулки от туалетной бумаги и раскрасьте фломастером.","minutes":2,"min_band":"b1"},{"who":"kids","name":"Шляпа экспедиции","how":"Подойдёт любая панама или кепка. Спереди приклейте скотчем бумажную «эмблему» с отпечатком лапы.","minutes":2,"min_band":"b3"},{"who":"parent","name":"Жилет Профессора","how":"Наденьте рубашку или жилет с карманами, в карманы — кисточку, линейку и блокнот. На нос — любые очки или очки, нарисованные на бумаге.","minutes":2,"min_band":"b1"},{"who":"props","name":"Гнездо с яйцом","how":"Скрутите плед или полотенце кольцом на полу, в середину положите мяч, обёрнутый белой бумагой, — это яйцо динозавра.","minutes":2,"min_band":"b1"},{"who":"props","name":"Окаменелости","how":"Сделайте в кусочках пластилина отпечатки лап игрушечных динозавров, вилки или ракушки — получатся «древние следы».","minutes":5,"min_band":"b3"}],"atmosphere":["Приглушите свет и оставьте пару ламп — пусть дом станет «вечерними джунглями».","Включите звуки тропического леса с птицами и дождём — ищите по запросу «звуки джунглей».","Положите на пол несколько бумажных «следов» динозавра — пусть ведут от комнаты к комнате.","Перед каждым этапом все хором рычат «Р-р-р!» — так экспедиция показывает, что готова."],"intro":{"b1":"Р-р-р! {kids}, смотрите: тут ходил маленький динозаврик Тяпа! Она оставила следы. Давайте найдём все {fragments}! Они приведут нас к гнезду с подарком. Потопаем, как динозавры: топ-топ-топ! Пошли искать!","b3":"Здравствуйте, юные исследователи! {kids}, я Профессор Окаменелкин, и у меня потрясающая новость. В нашем доме побывал динозаврик Тяпа — маленькая, зелёная и очень любопытная. Тяпа обожает прятки: она спрятала своё гнездо, а внутри — подарок для друзей! По дороге она оставила следы. Пройдём весёлые испытания, соберём все {fragments} — и они приведут нас прямо к гнезду. Р-р-р, вперёд!","b6":"Внимание, экспедиция! {kids}, говорит Профессор Окаменелкин. Клянусь своими косточками, это открытие века: в нашем доме живёт настоящий динозаврик! Её зовут Тяпа, она размером с кошку, ест исключительно огурцы и обожает прятки. Тяпа спрятала своё гнездо с сюрпризом и разбросала по дому подсказки — следы лап. Но рядом бродят её родственники: ворчливый трицератопс Бодя, птерозавр Пик и вулкан Пых, который только пыхтит, как чайник. Каждый приготовил испытание. Соберите все {fragments}, сложите код и введите его в Палеор
